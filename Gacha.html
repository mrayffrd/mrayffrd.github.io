<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#191c2b">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Warp</title>
<script>
/* Tema (Sistem / Gelap / Terang) dipasang sebelum halaman tampil, sama seperti index.html */
(function(){function ap(){try{var p=localStorage.getItem('emu.theme')||'system';var l=p==='light'||(p==='system'&&matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.dataset.theme=l?'light':'dark';var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=l?'#ffffff':'#191c2b';}catch(e){}}
ap();try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',ap)}catch(e){}})();
</script>
<style>
/* =====================================================================
   TEMA BERSAMA — sama dengan index.html (EMU Joki)
   Token warna, font Inter, kartu rata, tab bergaris, tombol pil.
   Mendukung tema Gelap / Terang / Sistem (pilihan disimpan di 'emu.theme').
   ===================================================================== */
:root{
  color-scheme:dark;
  --bg:#0f111b; --nav:#191c2b; --card:#1a1d2c; --card2:#252a3d; --line:rgba(255,255,255,.08);
  --tx:#eef0fb; --tx2:#a9aecb; --tx3:#7c82a3;
  --ac:#4f5ff0; --ac-tx:#9aa6ff; --ac-soft:rgba(99,112,255,.18); --ac-rgb:99,112,255;
  --ok:#3ddc97; --gold:#ffc861; --credit:#5fe0ee; --bad:#ff6b7a;
  --ok-rgb:61,220,151; --gold-rgb:255,200,97; --credit-rgb:95,224,238; --bad-rgb:255,107,122;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:Consolas,"DejaVu Sans Mono","Courier New",ui-monospace,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  /* nama lama, supaya kode lama tetap jalan */
  --panel:var(--card); --panel-2:var(--card2); --tx-2:var(--tx2); --tx-3:var(--tx3);
  --line-hi:var(--ac); --success:var(--ok); --danger:var(--bad);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f2f8; --nav:#ffffff; --card:#ffffff; --card2:#f0f1f9; --line:rgba(25,30,60,.09);
  --tx:#1b1f33; --tx2:#585e7c; --tx3:#8a8fa9;
  --ac:#5461f0; --ac-tx:#4452dd; --ac-soft:#e7e9ff; --ac-rgb:84,97,240;
  --ok:#12a56b; --gold:#b9770e; --credit:#0e8a9a; --bad:#d93a4c;
  --ok-rgb:18,165,107; --gold-rgb:185,119,14; --credit-rgb:14,138,154; --bad-rgb:217,58,76;
  --shadow:0 8px 24px rgba(30,40,90,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font-family:inherit}
[hidden]{display:none!important}
::selection{background:rgba(var(--ac-rgb),.35);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,134,170,.35);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--ac-tx);outline-offset:2px;border-radius:8px}

/* ---------- layar boot ---------- */
#emu-boot{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;letter-spacing:3px;font-size:13px;color:var(--tx3);font-family:var(--sans);font-weight:600;transition:opacity .45s ease}
#emu-boot.off{opacity:0;pointer-events:none}
#emu-boot b{font-size:20px;font-weight:800;letter-spacing:6px;background:linear-gradient(90deg,#8794ff,#5fb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#emu-boot i{display:block;width:150px;height:3px;overflow:hidden;border-radius:3px;background:var(--card2)}
#emu-boot i::after{content:"";display:block;width:40%;height:100%;background:var(--ac);border-radius:3px;animation:bootbar 1.1s ease-in-out infinite}
@keyframes bootbar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}


/* ---------- tombol (utama = aksen, seperti .btn-ac di index) ---------- */
.btn{appearance:none;font:700 13.5px var(--sans);text-decoration:none;color:#fff;background:var(--ac);border:1px solid transparent;min-height:40px;padding:0 20px;border-radius:99px;cursor:pointer;transition:filter .2s,transform .15s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;user-select:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn-gold{background:rgba(var(--gold-rgb),.16);border-color:rgba(var(--gold-rgb),.55);color:var(--gold)}
.btn-credit{background:rgba(var(--credit-rgb),.14);border-color:rgba(var(--credit-rgb),.5);color:var(--credit)}
.btn-outline{background:var(--card2);color:var(--tx);border-color:var(--line)}
.btn-sell{background:rgba(var(--bad-rgb),.14);border-color:rgba(var(--bad-rgb),.5);color:var(--bad);min-height:30px;padding:0 12px;font-size:12px;margin-top:6px}
.btn-use{min-height:30px;padding:0 12px;font-size:12px;margin-top:6px}


/* ---------- popup ---------- */
.popup-overlay{position:fixed;inset:0;background:rgba(5,6,12,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;justify-content:center;align-items:center;z-index:1000;padding:16px}
.popup-overlay.show{display:flex}
.popup{background:var(--card);padding:26px 22px;border-radius:20px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:popIn .26s cubic-bezier(.3,.9,.3,1);position:relative;color:var(--tx)}
@keyframes popIn{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.popup h2{margin-bottom:14px;color:var(--tx);font-weight:800}
.popup input,.login-box input{width:100%;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:500 14px var(--sans);margin-bottom:14px;outline:none;transition:border-color .2s}
.popup input:focus,.login-box input:focus{border-color:var(--ac)}
.popup .close-btn{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--tx3);font-size:24px;cursor:pointer;line-height:1}
.popup .close-btn:hover{color:var(--tx)}
.popup p{color:var(--tx2)}
.login-box{max-width:380px;margin:60px auto;text-align:center}
.popup.pc{padding:0;overflow:hidden}
.pbn{height:96px;background:linear-gradient(135deg,#4452dd,#1b1f33) center/cover}
.pav{width:88px;height:88px;margin:-44px auto 8px;border:3px solid var(--card)}
.pc .in{padding:0 20px 22px}
.pc .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pc small{color:var(--tx3)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%);background:#232738;color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:2000;font-size:13px;animation:fadeInOut 2.3s forwards;pointer-events:none;text-align:center;max-width:min(420px,calc(100vw - 32px))}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(20px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1}100%{opacity:0}}


.rate-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;color:var(--tx)}
.rate-table th,.rate-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.rate-table th{color:var(--ac-tx);font-weight:700}

/* ===== WARP UI ===== */
body{overflow:hidden}
button{font:inherit;color:inherit}
#warp{--a1:rgba(190,170,255,.4);--a2:rgba(90,110,255,.45);--cube:#a48cff;position:fixed;inset:0;overflow:hidden;color:#fff;background:linear-gradient(135deg,#262b68,#3a3478 50%,#1a1e4d)}
#warp[data-b=infinite]{--a1:rgba(255,170,230,.38);--a2:rgba(255,190,110,.32);--cube:#ff9ad5;background:linear-gradient(135deg,#3a2264,#5a2f7a 50%,#2a1a4d)}
#warp::before{content:"";position:absolute;inset:0;filter:blur(24px);background:radial-gradient(55% 50% at 25% 30%,var(--a1),transparent 70%),radial-gradient(50% 50% at 82% 82%,var(--a2),transparent 70%)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) 24px 0}
.ttl small{display:block;color:#f0c987;font-size:13px;font-weight:600}
.ttl h1{font-size:19px;font-weight:600}
.top-r{display:flex;gap:12px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 6px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(10,12,40,.55);border:1px solid rgba(255,255,255,.18)}
.chip img{width:22px;height:22px;object-fit:contain}
.chip button{background:none;border:0;cursor:pointer;font-size:16px;line-height:1}
.x{color:#fff;text-decoration:none;font-size:30px;line-height:1;background:none;border:0;cursor:pointer;opacity:.9}
.tabs{position:absolute;left:0;top:104px;z-index:4;display:flex;flex-direction:column;gap:14px}
.tab{width:120px;height:50px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:11px;font-weight:600;cursor:pointer;text-align:right;transform:translateX(-26px);transition:.25s;border:2px solid rgba(255,255,255,.22);border-left:0;background:linear-gradient(90deg,#171a44,#4d47a0)}
.tab[data-t=infinite]{background:linear-gradient(90deg,#2a1444,#a0479a)}
.tab.on{transform:none;width:150px;border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.3)}
.stage{position:absolute;left:170px;right:56px;top:84px;bottom:100px;display:flex}
.tag{position:absolute;left:-12px;top:-14px;z-index:3;background:#2f86e6;color:#fff;font-size:12px;font-weight:600;padding:5px 14px;border-radius:0 8px 8px 0}
.info{position:relative;z-index:2;width:min(300px,40%);padding:40px 22px 20px;color:#22233a;border-radius:0 34px 0 0;background:linear-gradient(#f7f7fb 68%,rgba(247,247,251,.55));overflow:hidden}
.info h2{font-size:34px;font-weight:700;line-height:1.1;margin-bottom:22px}
.timer{color:#f0a030;font-weight:700;font-size:14px;margin-bottom:14px}
.desc{font-weight:700;font-size:14px;line-height:1.5}
.desc b{color:#f0a030}
.caps{display:flex;gap:10px;margin-top:16px}
.cap{width:52px;height:130px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 2px;font-size:10px;font-weight:600;text-align:center;background:linear-gradient(#2a2f6e,#6a5cc0);color:#fff;overflow:hidden}
.cap span{font-size:24px}
.art{flex:1;position:relative;overflow:hidden;background:linear-gradient(160deg,#0d0f2e,#2a2470 60%,#4a3aa8);border:1px solid rgba(255,255,255,.12)}
[data-b=infinite] .art{background:linear-gradient(160deg,#1a0d2e,#5a2070 60%,#a03a90)}
.cube{position:absolute;background:linear-gradient(135deg,#fff,var(--cube));opacity:.85;box-shadow:0 0 14px var(--cube);animation:fl 4s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-10px) rotate(25deg)}}
.hero{position:absolute;right:16%;top:50%;width:min(46%,260px);aspect-ratio:1;transform:translateY(-55%);border-radius:50%;display:grid;place-items:center;font-size:clamp(60px,9vw,110px);background:radial-gradient(circle,rgba(255,255,255,.55),var(--cube) 45%,transparent 72%);filter:drop-shadow(0 0 30px var(--cube))}
.plate{position:absolute;right:24px;bottom:22%;background:rgba(10,10,30,.75);padding:3px 14px;font-size:14px;font-weight:600;border-left:3px solid #fff}
.plate i{display:block;color:#ffd77a;font-size:11px;letter-spacing:2px;font-style:normal}
.bot{position:absolute;left:170px;right:56px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bl,.br{display:flex;gap:12px;flex-wrap:wrap}
.pill{border:0;cursor:pointer;padding:9px 26px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(240,240,250,.92);color:#33344c;text-decoration:none}
.pull{display:flex;align-items:stretch;overflow:hidden;padding:0;border:0;border-radius:99px;cursor:pointer;background:rgba(240,240,250,.95);color:#33344c;font-size:13px;font-weight:600}
.pull span{display:flex;align-items:center;gap:6px;padding:10px 16px}
.pull span:first-child{background:rgba(200,190,150,.35)}
.pull img{width:18px;height:18px;object-fit:contain}
.pull:disabled,.pill:disabled{opacity:.55;cursor:not-allowed}
#fx{position:fixed;inset:0;z-index:1400;display:none;background:radial-gradient(circle at 50% 50%,#10163d,#04050f 70%);overflow:hidden;--fxc:#6fa8ff}
#fx.show{display:block}
#fx.c4{--fxc:#b46aff}
#fx.c5{--fxc:#ffcf6a}
#fx.c4,#fx.c5{animation:flash 1s}
@keyframes flash{0%{background:var(--fxc)}100%{}}
.st{position:absolute;left:110%;height:2px;width:140px;background:linear-gradient(90deg,transparent,var(--fxc));animation:st linear infinite}
@keyframes st{to{transform:translateX(-140vw)}}
#skip{position:absolute;right:24px;bottom:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);color:#fff;padding:7px 18px;border-radius:99px;cursor:pointer;font-size:12px}
#res{position:fixed;inset:0;z-index:1500;display:none;overflow:hidden;background:radial-gradient(80% 70% at 50% 25%,#1d2660,#070915 72%)}
#res.show{display:block}
.rt{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:24px;z-index:3;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
#res .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:24px;z-index:3}
.uid{position:absolute;left:24px;bottom:16px;font-size:11px;opacity:.7}
.rg{position:absolute;left:50%;top:50%;width:min(1000px,118vw);transform:translate(-50%,-50%) rotate(-8deg);display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,88px);grid-template-columns:1fr 1fr;gap:22px 44px}
.rg.one{grid-template-rows:150px;grid-template-columns:min(440px,84vw);width:auto;transform:translate(-50%,-50%) rotate(-4deg)}
.rc{position:relative;display:flex;align-items:center;gap:14px;padding:0 16px;opacity:0;animation:rin .45s forwards;background:linear-gradient(90deg,rgba(8,12,34,.94),rgba(16,22,56,.85));border-bottom:2px solid #3c73ee;box-shadow:0 6px 18px rgba(50,100,255,.3)}
.rg:not(.one) .rc:nth-child(n+6){top:-40px}
@keyframes rin{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
.rc.r4{background:linear-gradient(100deg,#4b25b0,#a55cf0 60%,#7b45de);border:2px solid #c9a4ff;box-shadow:0 0 26px rgba(180,110,255,.75)}
.rc.r5{background:linear-gradient(100deg,#a86a10,#ffcf6a 60%,#d9962a);border:2px solid #fff0b8;box-shadow:0 0 30px rgba(255,200,90,.85)}
.ri{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px}
.ci{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08)}
.ri i{font-style:normal;color:#ffd77a;font-size:10px;letter-spacing:1px;white-space:nowrap}
.rn{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rn small{display:block;font-size:11px;color:#ffe08a}
.ra{width:56px;height:74px;display:grid;place-items:center;font-size:30px;flex-shrink:0;border:1px solid rgba(255,255,255,.35);background:linear-gradient(160deg,#2a3a7a,#0d1030);box-shadow:5px -3px 0 -1px rgba(255,255,255,.12)}
.ra img{width:100%;height:100%;object-fit:cover}
.one .ra{width:96px;height:124px;font-size:52px}
.new.dup{color:#cfd6ff;background:#26304f;border-color:#8b97d6}
.new{position:absolute;right:12px;top:-11px;font-size:11px;padding:1px 9px;color:#ffd77a;background:#2b1a55;border:1px solid #ffd77a;border-radius:6px}
@media (max-width:820px){
  .topbar{padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0}
  .tabs{flex-direction:row;left:12px;right:12px;top:66px;gap:8px}
  .tab,.tab.on{transform:none;flex:1;width:auto;border-left:2px solid rgba(255,255,255,.22);border-radius:8px;height:40px;justify-content:center;padding:0 6px}
  .stage{left:12px;right:12px;top:122px;bottom:150px;flex-direction:column}
  .info{width:auto;padding:30px 16px 14px;border-radius:0 26px 0 0}
  .info h2{font-size:24px;margin-bottom:8px}
  .caps{display:none}
  .art{min-height:130px}
  .hero{right:10%;top:45%}
  .bot{left:12px;right:12px;flex-direction:column-reverse;align-items:stretch}
  .bl,.br{justify-content:center}
  .rg{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:1fr;grid-auto-rows:58px;width:min(420px,90vw);gap:9px;transform:translate(-50%,-50%) rotate(-3deg)}
  .rg:not(.one) .rc:nth-child(n+6){top:0}
  .rg .ra{width:40px;height:50px;font-size:22px}
}
</style>
</head>

<script>
(function(){
  var first = !sessionStorage.getItem('popit_booted');
  sessionStorage.setItem('popit_booted','1');
  var el = document.getElementById('emu-boot');
  var wait = first ? 700 : 200;
  function done(){ el.classList.add('off'); setTimeout(function(){ el.remove(); }, 450); }
  if (document.readyState === 'complete') setTimeout(done, wait);
  else addEventListener('load', function(){ setTimeout(done, wait); }, { once:true });
  setTimeout(done, 2200);
})();
</script>

<div class="popup-overlay" id="rd-popup">
  <div class="popup">
    <button class="close-btn" onclick="closeRd()">×</button>
    <h2>Redeem Code</h2>
    <input id="rd-in" placeholder="Masukkan kode" autocomplete="off">
    <button class="btn" style="width:100%" onclick="doRedeem()">Redeem</button>
  </div>
</div>

<script>
/* =====================================================
   SCRIPT.JS
   ===================================================== */

const API_URL = "https://script.google.com/macros/s/AKfycbz7gHt-Pc5dRyKYwejO7VpMH_nmBR8Cxsk1pVt3y4h9rcXx4KtgF2vBqkOQ4ENz10MJkQ/exec";
// ↑ Pastikan ini URL Web App kamu yang benar

const SECRET = "popit_secret_2026";

// ========== HARGA JUAL (GANTI DI SINI SAJA) ==========
const SELL_PRICE = {
  banner: 5,          // Harga jual 1 banner (Mora)
  petMultiplier: 1    // Harga pet = earnAmount × angka ini
};

let currentUser = null;

async function apiCall(action, data = {}) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, secret: SECRET, ...data })
    });
    return await res.json();
  } catch (err) {
    console.error("API Error:", err);
    return { success: false, message: "Gagal terhubung ke server" };
  }
}

async function login(username, password) {
  const res = await apiCall("login", { username, password });
  if (res.success) {
    currentUser = res.user;
    localStorage.setItem("popit_session", JSON.stringify({ username }));
  }
  return res;
}

async function register(username, password) {
  const res = await apiCall("register", { username, password });
  if (res.success) {
    currentUser = res.user;
    localStorage.setItem("popit_session", JSON.stringify({ username }));
  }
  return res;
}

async function loadSession() {
  const session = localStorage.getItem("popit_session");
  if (!session) return false;
  try {
    const { username } = JSON.parse(session);
    const res = await apiCall("getUser", { username });
    if (res.success) {
      currentUser = res.user;
      return true;
    }
  } catch (e) {}
  return false;
}

function logout() {
  localStorage.removeItem("popit_session");
  currentUser = null;
  window.location.href = "login.html";
}

async function updateUser(updates) {
  if (!currentUser) return { success: false };
  const res = await apiCall("updateUser", {
    username: currentUser.username,
    updates
  });
  if (res.success) currentUser = res.user;
  return res;
}

function updateCurrencyDisplay() {
  if (!currentUser) return;
  document.querySelectorAll(".mora-count").forEach(el => el.textContent = currentUser.mora || 0);
  document.querySelectorAll(".credit-count").forEach(el => el.textContent = currentUser.credit || 0);
}

async function addCurrency(type, amount) {
  if (!currentUser) return;
  const updates = {};
  if (type === "mora") updates.mora = (currentUser.mora || 0) + amount;
  if (type === "credit") updates.credit = (currentUser.credit || 0) + amount;
  await updateUser(updates);
  updateCurrencyDisplay();
}

async function redeemCode(code) {
  if (!currentUser) return { success: false, message: "Belum login" };
  const res = await apiCall("redeem", {
    username: currentUser.username,
    code: code.trim().toUpperCase()
  });
  if (res.success) {
    currentUser = res.user;
    updateCurrencyDisplay();
  }
  return res;
}

async function getGachaConfig(type) {
  return await apiCall("getGacha", { type });
}

async function doGacha(type, times = 1) {
  if (!currentUser) return { success: false, message: "Belum login" };
  const res = await apiCall("doGacha", {
    username: currentUser.username,
    type,
    times
  });
  if (res.success) {
    currentUser = res.user;
    updateCurrencyDisplay();
  }
  return res;
}

async function claimPetEarnings() {
  if (!currentUser) return;
  const res = await apiCall("claimPets", { username: currentUser.username });
  if (res.success && (res.earnedMora > 0 || res.earnedCredit > 0)) {
    currentUser = res.user;
    updateCurrencyDisplay();
    showToast(`🐾 Pet menghasilkan: ${res.earnedMora} Mora & ${res.earnedCredit} Credit!`);
  }
}

async function getChats() {
  const res = await apiCall("getChats");
  return res.chats || [];
}

async function sendChat(message) {
  if (!currentUser || !message.trim()) return;
  return await apiCall("sendChat", {
    username: currentUser.username,
    message: message.trim()
  });
}

function showToast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2300);
}

async function requireLogin() {
  const ok = await loadSession();
  if (!ok) {
    window.location.href = "login.html";
    return false;
  }
  updateCurrencyDisplay();
  claimPetEarnings();
  return true;
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return "baru saja";
  if (m < 60) return m + " mnt lalu";
  return Math.floor(m / 60) + " jam lalu";
}

</script>
<script>
async function showRate(type) {
      const res = await getGachaConfig(type);
      if (!res.success || !res.items) {
        showToast("Gagal memuat rate");
        return;
      }

      const total = res.items.reduce((s, i) => s + (i.chance || 0), 0) || 1;
      document.getElementById("rate-title").textContent =
        type === "zero" ? "Rate Zero Gacha" : "Rate Infinite Gacha";

      document.getElementById("rate-content").innerHTML = `
        <table class="rate-table">
          <thead><tr><th>Item</th><th>Tipe</th><th>Chance</th></tr></thead>
          <tbody>
            ${res.items.map(i => {
              const pct = ((i.chance || 0) / total * 100).toFixed(1);
              return `<tr>
                <td>${i.name}</td>
                <td>${i.type}</td>
                <td>${pct}%</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      `;
      document.getElementById("rate-popup").classList.add("show");
    }

    function closeRate() {
      document.getElementById("rate-popup").classList.remove("show");
    }

    

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

const CREDIT_LOGO = "https://static.wikia.nocookie.net/houkai-star-rail/images/d/d9/Item_Credit.png/revision/latest?cb=20230722075044";
const MORA_LOGO = "https://media.printables.com/media/prints/274692/images/2440991_fbc314d8-5e72-465c-b7f6-13397d418cc8/thumbs/inside/1280x960/png/icon_mora_274692.webp";

// ---- Banner: ubah nama / teks di sini ----
const BANNERS = {
  zero:     { name:"Contract Zero",     cur:"credit", label:"Credit", logo:CREDIT_LOGO, plate:"Zero Gacha",     hero:"✦" },
  infinite: { name:"Contract Infinite", cur:"mora",   label:"Mora",   logo:MORA_LOGO,   plate:"Infinite Gacha", hero:"∞" }
};
const PRICE = { 1:100, 10:900 };
// ---- Item ganda (pet/banner yang sudah dimiliki) otomatis ditukar jadi mata uang ----
// type: "auto" = sesuai mata uang banner (Zero -> Credit, Infinite -> Mora); atau isi "mora" / "credit"
const DUP_REFUND = { amount: 50, type: "auto" };

// ---- Rarity: pakai item.rarity (3-5) kalau ada dari spreadsheet, kalau tidak dari tipe item ----
function rarityOf(it) {
  const n = parseInt(it.rarity);
  if (n >= 3 && n <= 5) return n;
  if (it.type === "pet") return 5;
  if (it.type === "banner") return 4;
  return 3;
}
const TYPE_ICON = { banner:"🖼️", pet:"🐾", mora:"🪙", credit:"💎" };

let running = false, cur = "zero";
const seen = new Set(), cfg = {};

function buildCubes() {
  const art = $("art");
  for (let i = 0; i < 26; i++) {
    const t = i / 25, s = 6 + (1 - t) * 24, c = document.createElement("div");
    c.className = "cube";
    c.style.cssText = `width:${s}px;height:${s}px;left:${8 + t * 62}%;top:${72 - Math.sin(t * Math.PI) * 58}%;animation-delay:${-i * .3}s;transform:rotate(${i * 17}deg)`;
    art.appendChild(c);
  }
}

function setBanner(t) {
  if (running) return;
  cur = t;
  const b = BANNERS[t];
  $("warp").dataset.b = t;
  document.querySelectorAll(".tab").forEach(e => e.classList.toggle("on", e.dataset.t === t));
  $("bn-title").textContent = $("bn-name").textContent = b.name;
  $("plate-name").textContent = b.plate;
  $("hero").textContent = b.hero;
  $("bn-desc").innerHTML = `Setiap Warp memakai <b>${b.label}</b>.<br>Warp ×1 = <b>${PRICE[1]}</b> ${b.label}<br>Warp ×10 = <b>${PRICE[10]}</b> ${b.label}`;
  document.querySelectorAll(".cl").forEach(i => i.src = b.logo);
  drawCaps();
}

async function drawCaps() {
  if (!cfg[cur]) {
    const r = await getGachaConfig(cur);
    cfg[cur] = (r && r.success && r.items) ? r.items : [];
  }
  const top = cfg[cur].slice().sort((a, b) => (a.chance || 0) - (b.chance || 0)).slice(0, 3);
  $("caps").innerHTML = top.map(i => `<div class="cap"><span>${TYPE_ICON[i.type] || "🎁"}</span>${esc(i.name)}</div>`).join("");
}

function setDis(d) {
  ["btn-pull-1", "btn-pull-10"].forEach(id => $(id).disabled = d);
}

async function pull(times) {
  if (running || !currentUser) return;
  const b = BANNERS[cur], cost = PRICE[times];
  if ((currentUser[b.cur] || 0) < cost) { showToast(`Tidak cukup! Butuh ${cost} ${b.cur}`); return; }
  running = true; setDis(true);

  const before = {   // isi inventori sebelum gacha, untuk mendeteksi item ganda
    pet: (currentUser.pets || []).map(x => x.name),
    banner: (currentUser.banners || []).map(x => x.name)
  };
  const fx = $("fx");
  fx.querySelectorAll(".st").forEach(e => e.remove());
  for (let i = 0; i < 45; i++) {
    const s = document.createElement("div");
    s.className = "st";
    s.style.cssText = `top:${Math.random() * 100}%;animation-duration:${.3 + Math.random() * .5}s;animation-delay:${-Math.random()}s;width:${80 + Math.random() * 160}px`;
    fx.appendChild(s);
  }
  fx.className = "show";

  const [res] = await Promise.all([doGacha(cur, times), sleep(1500)]);
  if (!res.success) {
    fx.className = "";
    showToast(res.message || "Gagal melakukan gacha");
    running = false; setDis(false);
    return;
  }
  const items = res.results || [];
  await settleDuplicates(items, before, b.cur);
  fx.className = "show c" + Math.max(3, ...items.map(rarityOf));
  await Promise.race([sleep(1100), new Promise(r => $("skip").onclick = r)]);
  showResult(items);
  fx.className = "";
  running = false; setDis(false);
}

// Tandai item ganda, buang salinannya dari inventori, lalu ganti dengan DUP_REFUND.amount Mora/Credit
async function settleDuplicates(items, before, bannerCur) {
  const owned = { pet: new Map(), banner: new Map() };
  before.pet.forEach(n => owned.pet.set(n, (owned.pet.get(n) || 0) + 1));
  before.banner.forEach(n => owned.banner.set(n, (owned.banner.get(n) || 0) + 1));

  const gotNow = new Set(), touched = { pet: new Set(), banner: new Set() };
  let dups = 0;
  items.forEach(it => {
    if (it.type !== "pet" && it.type !== "banner") return;
    touched[it.type].add(it.name);
    const key = it.type + "|" + it.name;
    if (owned[it.type].has(it.name) || gotNow.has(key)) { it.dup = true; dups++; }
    else gotNow.add(key);
  });
  if (!dups) return;

  const type = DUP_REFUND.type === "auto" ? bannerCur : DUP_REFUND.type;
  const amount = DUP_REFUND.amount * dups;
  const updates = { [type]: (currentUser[type] || 0) + amount };

  // pangkas salinan berlebih (yang terbaru) dari daftar milik pemain
  const trim = (list, kind) => {
    const keep = n => owned[kind].get(n) || 1, seenCount = {}, removed = [];
    const out = list.filter(x => {
      if (!touched[kind].has(x.name)) return true;
      seenCount[x.name] = (seenCount[x.name] || 0) + 1;
      if (seenCount[x.name] <= keep(x.name)) return true;
      removed.push(x); return false;
    });
    return { out, removed };
  };
  const pets = trim(currentUser.pets || [], "pet");
  const bans = trim(currentUser.banners || [], "banner");
  if (pets.removed.length) updates.pets = pets.out;
  if (bans.removed.length) {
    updates.banners = bans.out;
    const act = currentUser.activeBanner;
    if (act && !bans.out.some(x => x.id === act)) {         // banner aktif ikut terhapus -> pindah ke salinan yang tersisa
      const gone = bans.removed.find(x => x.id === act);
      const alt = gone && bans.out.find(x => x.name === gone.name);
      updates.activeBanner = alt ? alt.id : null;
    }
  }

  const r = await updateUser(updates);
  if (r && r.success) {
    items.forEach(it => { if (it.dup) { it.refundType = type; it.refundAmount = DUP_REFUND.amount; } });
    updateCurrencyDisplay();
  } else {
    items.forEach(it => { delete it.dup; });
    showToast("Gagal menukar item ganda");
  }
}

function showResult(items) {
  const rg = $("rg");
  rg.className = "rg" + (items.length === 1 ? " one" : "");
  rg.innerHTML = items.map((it, i) => {
    const r = rarityOf(it);
    const isNew = it.dup ? false : (it.isNew ?? it.new ?? ((it.type === "banner" || it.type === "pet") && !seen.has(it.name)));
    seen.add(it.name);
    const pic = it.image || it.img || it.icon;
    const art = (typeof pic === "string" && /^https?:/.test(pic)) ? `<img src="${esc(pic)}" alt="">` : (TYPE_ICON[it.type] || "🎁");
    const amt = it.dup
      ? `<small>Ganda → +${esc(it.refundAmount)} ${it.refundType === "mora" ? "Mora" : "Credit"}</small>`
      : (it.type === "mora" || it.type === "credit") ? `<small>+${esc(it.amount)} ${it.type === "mora" ? "Mora" : "Credit"}</small>` : "";
    return `<div class="rc r${r}" style="animation-delay:${i * .12}s">
      <div class="ri"><span class="ci">${TYPE_ICON[it.type] || "🎁"}</span><i>${"★".repeat(r)}</i></div>
      <div class="rn">${esc(it.name)}${amt}</div>
      <div class="ra">${art}</div>${it.dup ? '<b class="new dup">Ganda</b>' : isNew ? '<b class="new">New</b>' : ""}</div>`;
  }).join("");
  $("uid").textContent = "UID: " + (currentUser ? currentUser.username : "");
  $("res").classList.add("show");
}
function closeRes() { $("res").classList.remove("show"); }

function openRd() { $("rd-popup").classList.add("show"); }
function closeRd() { $("rd-popup").classList.remove("show"); }
async function doRedeem() {
  const c = $("rd-in").value;
  if (!c.trim()) return;
  const r = await redeemCode(c);
  showToast(r.message || (r.success ? "Berhasil!" : "Gagal"));
  if (r.success) { $("rd-in").value = ""; closeRd(); }
}

buildCubes();
setBanner("zero");
(async () => { if (await requireLogin()) { drawCaps(); } })();
</script>
</body>
</html>
