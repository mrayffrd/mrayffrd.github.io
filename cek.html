<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#03030a">
<title>EMU | Cek Pesanan</title>
<meta name="description" content="Cek status pesanan joki di EMU JOKI dengan ID pesananmu.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== TEMA BERSAMA EMU ===== */
/* =====================================================================
   EMU JOKI — TEMA BERSAMA  (emu.css)
   Diturunkan dari beranda.html "Multiverse": ruang gelap #03030a, font
   monospace, cahaya indigo, panel kaca, kontrol segmented + tab bergaris
   neon. Dipakai oleh index / genshin / hsr / portal (dan halaman lain).
   ===================================================================== */
:root{
  color-scheme: dark;
  --ac-rgb: 148,168,255;                 /* warna aksen aktif (diganti lewat panel ◉) */
  --ac: rgb(var(--ac-rgb));
  --gold-rgb: 255,220,150;
  --ok-rgb: 87,224,168;
  --bad-rgb: 255,110,120;
  --info-rgb: 90,160,255;
  --bg: #03030a;
  --panel: rgba(5,7,18,.86);
  --panel-2: rgba(12,15,36,.78);
  --line: rgba(110,125,215,.32);
  --line-hi: rgba(var(--ac-rgb),.75);
  --tx: #dfe4ff;
  --tx-2: #9aa4d8;
  --tx-3: #6f79b4;
  --mono: Consolas, "DejaVu Sans Mono", "Courier New", ui-monospace, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 16px; --r-md: 11px; --r-sm: 8px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--tx);
  font-family:var(--mono); font-size:14px; line-height:1.6;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
body.locked{ overflow:hidden; }
a{ color:inherit; }
img{ max-width:100%; }
::selection{ background:rgba(var(--ac-rgb),.35); color:#fff; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:rgba(110,125,215,.35); border-radius:9px; }
::-webkit-scrollbar-track{ background:transparent; }
:focus-visible{ outline:2px solid var(--ac); outline-offset:2px; border-radius:6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.wrap{ width:100%; max-width:1200px; margin:0 auto; padding:0 20px; }
.sans{ font-family:var(--sans); }
.muted{ color:var(--tx-2); }
.dim{ color:var(--tx-3); }

/* ---------- LATAR: gambar + nebula + bintang + vinyet ---------- */
#emu-img{ position:fixed; inset:0; z-index:-5; background:#03030a center/cover no-repeat; opacity:.22; transition:opacity .5s; }
.emu-nebula{ position:fixed; inset:-10%; z-index:-4; pointer-events:none;
  background:
    radial-gradient(38% 34% at 18% 22%, rgba(var(--ac-rgb),.20), transparent 70%),
    radial-gradient(34% 30% at 82% 30%, rgba(160,90,255,.13), transparent 70%),
    radial-gradient(46% 38% at 60% 92%, rgba(var(--ac-rgb),.14), transparent 72%);
  animation:nebDrift 46s ease-in-out infinite alternate; }
@keyframes nebDrift{ from{ transform:translate3d(-1.5%,-1%,0) scale(1); } to{ transform:translate3d(2%,1.5%,0) scale(1.08); } }
#emu-stars{ position:fixed; inset:0; z-index:-3; pointer-events:none; }
.emu-veil{ position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(3,3,10,.78) 100%),
             linear-gradient(180deg, rgba(3,3,10,.55), rgba(3,3,10,.25) 30%, rgba(3,3,10,.6)); }
.emu-cursor{ position:fixed; left:0; top:0; width:340px; height:340px; margin:-170px 0 0 -170px; z-index:-1; pointer-events:none;
  background:radial-gradient(circle, rgba(var(--ac-rgb),.16), transparent 62%); opacity:0; transition:opacity .4s; will-change:transform; }
.emu-cursor.on{ opacity:1; }

/* ---------- BOOT & WARP ---------- */
#emu-boot{ position:fixed; inset:0; z-index:9000; background:#03030a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  letter-spacing:3px; font-size:14px; color:#9aa4d8; transition:opacity .45s ease; }
#emu-boot.off{ opacity:0; pointer-events:none; }
#emu-boot b{ font-size:21px; letter-spacing:6px; color:#e6ecff; text-shadow:0 0 22px rgba(var(--ac-rgb),.7); }
#emu-boot i{ display:block; width:180px; height:2px; overflow:hidden; border-radius:2px; background:rgba(120,140,220,.18); }
#emu-boot i::after{ content:""; display:block; width:40%; height:100%; background:linear-gradient(90deg,transparent,var(--ac),transparent); animation:bootbar 1.1s ease-in-out infinite; }
@keyframes bootbar{ from{ transform:translateX(-100%); } to{ transform:translateX(260%); } }
.emu-warp{ position:fixed; inset:0; z-index:8900; pointer-events:none; opacity:0; transition:opacity .26s ease;
  background:radial-gradient(circle at 50% 50%, rgba(var(--ac-rgb),.35), #03030a 62%); }
body.leaving .emu-warp{ opacity:1; }
body.leaving main{ transform:scale(1.03); filter:blur(3px); transition:transform .26s, filter .26s; }

/* ---------- HEADER ---------- */
.emu-header{ position:sticky; top:0; z-index:900; padding:calc(10px + var(--safe-t)) 0 10px;
  background:rgba(5,7,18,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); }
.emu-header::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ac-rgb),.8),transparent); opacity:.55; }
.header-wrap{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; font-weight:700; letter-spacing:5px; font-size:16px; white-space:nowrap; }
.brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--ac); box-shadow:0 0 12px var(--ac), 0 0 26px rgba(var(--ac-rgb),.6); animation:pulse 2.4s ease-in-out infinite; }
.brand small{ letter-spacing:2px; color:var(--tx-3); font-weight:400; font-size:11px; }
@keyframes pulse{ 50%{ opacity:.45; transform:scale(.8); } }
.header-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }

/* ---------- TOMBOL ---------- */
.icon-btn,.btn{ appearance:none; font:inherit; font-size:12px; letter-spacing:1px; text-decoration:none; cursor:pointer; color:#dfe4ff;
  padding:8px 13px; border-radius:var(--r-md); background:rgba(18,22,48,.85); border:1px solid rgba(96,110,190,.5);
  transition:background .2s, border-color .2s, box-shadow .2s, transform .2s; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.icon-btn:hover,.btn:hover{ background:rgba(70,90,190,.45); border-color:var(--line-hi); box-shadow:0 0 16px rgba(var(--ac-rgb),.3); transform:translateY(-1px); }
.icon-btn:active,.btn:active{ transform:scale(.97); }
.icon-btn.on{ background:rgba(var(--ac-rgb),.22); border-color:var(--line-hi); color:#fff; }
.btn{ padding:11px 18px; font-size:13px; font-weight:700; }
.btn-primary{ background:linear-gradient(180deg,rgba(var(--ac-rgb),.42),rgba(var(--ac-rgb),.2)); border-color:rgba(var(--ac-rgb),.9); color:#fff; box-shadow:0 0 18px rgba(var(--ac-rgb),.3), inset 0 0 10px rgba(255,255,255,.06); }
.btn-primary:hover{ background:linear-gradient(180deg,rgba(var(--ac-rgb),.6),rgba(var(--ac-rgb),.3)); }
.btn-ok{ background:rgba(var(--ok-rgb),.2); border-color:rgba(var(--ok-rgb),.85); color:#c9ffe8; }
.btn-ok:hover{ background:rgba(var(--ok-rgb),.34); box-shadow:0 0 18px rgba(var(--ok-rgb),.35); }
.btn-ghost{ background:transparent; }
.btn-danger{ background:rgba(var(--bad-rgb),.16); border-color:rgba(var(--bad-rgb),.7); color:#ffd1d5; }
.btn-danger:hover{ background:rgba(var(--bad-rgb),.3); box-shadow:0 0 16px rgba(var(--bad-rgb),.3); }
.btn-block{ width:100%; }
.btn[disabled]{ opacity:.5; pointer-events:none; }
.chip{ appearance:none; font:inherit; font-size:11px; letter-spacing:.8px; padding:6px 12px; border-radius:99px; cursor:pointer;
  color:var(--tx-2); background:rgba(9,12,30,.8); border:1px solid rgba(96,110,190,.4); transition:.2s; white-space:nowrap; }
.chip:hover{ color:#fff; border-color:var(--line-hi); }
.chip.on{ color:#fff; background:rgba(var(--ac-rgb),.22); border-color:var(--line-hi); box-shadow:0 0 12px rgba(var(--ac-rgb),.25); }
.chip b{ color:var(--ac); font-weight:700; margin-left:4px; }
.tag{ display:inline-block; font-size:10px; letter-spacing:1px; padding:3px 9px; border-radius:99px; color:var(--tx-2); background:rgba(9,12,30,.85); border:1px solid rgba(96,110,190,.35); }
.tag.gold{ color:#ffdc96; border-color:rgba(var(--gold-rgb),.5); }

/* ---------- PANEL / KARTU ---------- */
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,.45); }
.section-title{ text-align:center; font-size:20px; font-weight:700; letter-spacing:5px; margin:72px 0 8px; color:#eef1ff; text-transform:uppercase; }
.section-sub{ text-align:center; margin:0 auto 28px; max-width:560px; color:var(--tx-2); font-family:var(--sans); font-size:14px; }
.section-title::after{ content:""; display:block; width:90px; height:2px; margin:12px auto 0; background:linear-gradient(90deg,transparent,var(--ac),transparent); box-shadow:0 0 12px rgba(var(--ac-rgb),.8); }
.tilt{ transform-style:preserve-3d; transition:transform .25s ease, border-color .25s, box-shadow .25s; will-change:transform; }
.shine{ position:relative; overflow:hidden; }
.shine::after{ content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%), rgba(var(--c, var(--ac-rgb)),.22), transparent 70%); }
.shine:hover::after{ opacity:1; }

/* ---------- INPUT ---------- */
input,select,textarea{ font:inherit; color:var(--tx); }
.field{ width:100%; padding:11px 14px; border-radius:var(--r-md); background:rgba(9,12,30,.92); border:1px solid rgba(96,110,190,.4); outline:none; font-size:14px; transition:.2s; }
.field::placeholder{ color:var(--tx-3); }
.field:focus{ border-color:var(--line-hi); box-shadow:0 0 0 3px rgba(var(--ac-rgb),.18), 0 0 18px rgba(var(--ac-rgb),.2); }
select.field{ appearance:none; padding-right:30px; cursor:pointer; background-image:linear-gradient(45deg,transparent 50%,var(--tx-2) 50%),linear-gradient(135deg,var(--tx-2) 50%,transparent 50%); background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%; background-size:5px 5px; background-repeat:no-repeat; }
select.field option{ background:#0a0d22; }
.search{ position:relative; flex:1 1 260px; min-width:0; }
.search .ico{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--tx-3); pointer-events:none; }
.search .field{ padding-left:38px; padding-right:38px; }
.search .x{ position:absolute; right:8px; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%; border:0; background:transparent; color:var(--tx-2); cursor:pointer; display:none; font-size:16px; }
.search.has .x{ display:block; }
.search .x:hover{ color:#fff; background:rgba(255,255,255,.08); }

/* ---------- SEGMENTED + TAB (persis gaya beranda) ---------- */
.tabs{ position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border-bottom:1px solid rgba(96,110,190,.28); }
.tabs .tab{ appearance:none; font:inherit; background:transparent; border:0; padding:10px 6px 12px; font-size:11px; letter-spacing:2.6px; color:var(--tx-3); cursor:pointer; transition:color .2s; text-transform:uppercase; }
.tabs .tab:hover{ color:#fff; }
.tabs .tab.on{ color:#eaf0ff; }
.tabs .tabline{ position:absolute; left:0; bottom:-1px; height:2px; width:calc(100% / var(--n,2)); background:linear-gradient(90deg,transparent,var(--ac) 30%,var(--ac) 70%,transparent);
  box-shadow:0 0 10px rgba(var(--ac-rgb),.85); transform:translateX(calc(var(--t,0) * 100%)); transition:transform .3s cubic-bezier(.3,.9,.3,1); }
.seg{ position:relative; display:grid; grid-template-columns:repeat(var(--n,3),1fr); padding:3px; border-radius:12px; background:rgba(9,12,30,.92); border:1px solid rgba(96,110,190,.32); }
.seg .thumb{ position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px) / var(--n,3)); border-radius:9px; pointer-events:none;
  background:linear-gradient(180deg,rgba(var(--ac-rgb),.36),rgba(var(--ac-rgb),.2)); border:1px solid rgba(var(--ac-rgb),.85);
  box-shadow:0 0 14px rgba(var(--ac-rgb),.45), inset 0 0 9px rgba(255,255,255,.1);
  transform:translateX(calc(var(--i,0) * 100%)); transition:transform .3s cubic-bezier(.3,.9,.3,1); }
.seg button{ position:relative; z-index:1; appearance:none; font:inherit; background:transparent; border:0; border-radius:9px; padding:9px 1px; font-size:11px; color:#7e88c0; cursor:pointer; transition:color .2s; }
.seg button.on{ color:#fff; font-weight:700; }

/* ---------- PANEL KONTROL ◉ (dock) ---------- */
#dockBtn{ position:fixed; z-index:950; left:calc(14px + env(safe-area-inset-left,0px)); bottom:calc(20px + var(--safe-b)); width:50px; height:50px; border-radius:50%;
  border:1px solid rgba(150,170,255,.55); color:#cfd8ff; font:inherit; font-size:19px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 50%, rgba(8,10,26,.96) 42%, rgba(var(--ac-rgb),.4) 72%, rgba(var(--ac-rgb),.06) 100%); box-shadow:0 0 18px rgba(var(--ac-rgb),.35); transition:box-shadow .3s; }
#dockBtn:hover{ box-shadow:0 0 28px rgba(var(--ac-rgb),.65); }
#dockBtn:active{ transform:scale(.94); }
#dock{ position:fixed; z-index:949; left:calc(10px + env(safe-area-inset-left,0px)); bottom:calc(78px + var(--safe-b)); width:min(380px, calc(100vw - 20px)); max-height:min(70vh,560px); overflow-y:auto;
  background:rgba(5,7,18,.94); border:1px solid rgba(110,125,215,.45); border-radius:14px; padding:12px 12px 14px; box-shadow:0 10px 40px rgba(0,0,0,.6); display:none; }
#dock.on{ display:block; animation:paneIn .22s ease-out; }
#dock .sec{ font-size:10px; letter-spacing:2px; color:var(--tx-3); margin:12px 2px 7px; text-transform:uppercase; }
#dock .pane{ display:none; } #dock .pane.on{ display:block; animation:paneIn .22s ease-out; }
#dock .tabs{ margin:-2px 0 6px; }
#dock .row{ display:grid; gap:6px; grid-template-columns:repeat(var(--c,2),1fr); }
#dock .row .btn,#dock .row .icon-btn{ padding:9px 4px; font-size:11px; }
#dock .opt{ margin:0 0 14px; }
#dock .opt .hd{ display:flex; justify-content:space-between; align-items:baseline; margin:0 3px 7px; }
#dock .opt .hd span{ font-size:10px; letter-spacing:2.6px; color:#7f89c4; }
#dock .opt .hd em{ font-style:normal; font-size:11px; color:#a9bbff; }
#dock .opt .cap{ margin:6px 3px 0; font-size:10px; color:#565f92; }
.swatches{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
.swatch{ appearance:none; height:34px; border-radius:10px; cursor:pointer; border:1px solid rgba(255,255,255,.14); background:rgb(var(--s)); position:relative; transition:transform .2s, box-shadow .2s; }
.swatch:hover{ transform:translateY(-2px); }
.swatch.on{ box-shadow:0 0 0 2px #03030a, 0 0 0 4px rgb(var(--s)), 0 0 18px rgb(var(--s)); }
.swatch-name{ text-align:center; font-size:11px; letter-spacing:1px; color:#a9bbff; margin-top:8px; }
@keyframes paneIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
.emu-reset{ position:fixed; z-index:940; left:calc(74px + env(safe-area-inset-left,0px)); bottom:calc(26px + var(--safe-b)); display:none; background:rgba(var(--bad-rgb),.25); border-color:rgba(var(--bad-rgb),.7); }

/* ---------- TOAST ---------- */
#emu-toast{ position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); z-index:99999; max-width:min(420px,calc(100vw - 32px)); padding:11px 18px; border-radius:12px; font-size:13px;
  background:rgba(5,7,18,.96); border:1px solid rgba(var(--ac-rgb),.7); color:#eef1ff; box-shadow:0 0 22px rgba(var(--ac-rgb),.3), 0 10px 30px rgba(0,0,0,.5);
  transform:translate(-50%,30px); opacity:0; pointer-events:none; transition:transform .3s cubic-bezier(.3,.9,.3,1), opacity .3s; text-align:center; }
#emu-toast.show{ transform:translate(-50%,0); opacity:1; }

/* ---------- MODAL ---------- */
.modal{ position:fixed; inset:0; z-index:9500; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(2,2,8,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s; }
.modal.show{ opacity:1; visibility:visible; }
.modal-box{ width:100%; max-width:420px; max-height:calc(100vh - 32px); overflow-y:auto; padding:24px; border-radius:18px; background:rgba(6,8,22,.97); border:1px solid rgba(var(--ac-rgb),.55);
  box-shadow:0 0 40px rgba(var(--ac-rgb),.22), 0 20px 60px rgba(0,0,0,.6); transform:translateY(14px) scale(.97); transition:transform .3s cubic-bezier(.3,.9,.3,1); }
.modal.show .modal-box{ transform:none; }
.modal-box h3{ margin:0 0 12px; font-size:16px; letter-spacing:3px; color:#eef1ff; text-transform:uppercase; }
.modal-box p{ margin:6px 0; }
.modal-actions{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.kv{ display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px dashed rgba(96,110,190,.28); font-size:13px; }
.kv span:first-child{ color:var(--tx-3); letter-spacing:1px; } .kv b{ text-align:right; color:#eef1ff; word-break:break-word; }

/* ---------- SKELETON & KOSONG ---------- */
.skel{ position:relative; overflow:hidden; border-radius:var(--r-lg); background:rgba(12,15,36,.7); border:1px solid rgba(96,110,190,.2); min-height:270px; }
.skel::after{ content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(var(--ac-rgb),.14) 50%,transparent 70%); transform:translateX(-100%); animation:sk 1.4s infinite; }
@keyframes sk{ to{ transform:translateX(100%); } }
.empty{ text-align:center; padding:54px 20px; color:var(--tx-2); border:1px dashed var(--line); border-radius:var(--r-lg); background:rgba(5,7,18,.6); }
.empty h4{ margin:0 0 8px; font-size:16px; letter-spacing:4px; color:#eef1ff; }
.empty p{ margin:0 0 16px; font-family:var(--sans); }

/* ---------- FLOATING ---------- */
.btn-float{ position:fixed; right:calc(20px + env(safe-area-inset-right,0px)); bottom:calc(20px + var(--safe-b)); z-index:940; display:flex; align-items:center; gap:8px; text-decoration:none;
  padding:13px 20px; border-radius:99px; font-weight:700; letter-spacing:2px; font-size:13px; color:#fff;
  background:radial-gradient(circle at 30% 30%, rgba(var(--ac-rgb),.55), rgba(20,26,70,.95)); border:1px solid rgba(var(--ac-rgb),.85); box-shadow:0 0 24px rgba(var(--ac-rgb),.45); transition:.2s; }
.btn-float:hover{ transform:scale(1.06); box-shadow:0 0 34px rgba(var(--ac-rgb),.7); }
.btn-float.wa{ border-color:rgba(var(--ok-rgb),.85); background:radial-gradient(circle at 30% 30%, rgba(var(--ok-rgb),.5), rgba(8,40,30,.95)); box-shadow:0 0 22px rgba(var(--ok-rgb),.4); }

/* ---------- FOOTER ---------- */
footer.emu-footer{ margin-top:90px; padding:34px 20px calc(40px + var(--safe-b)); text-align:center; border-top:1px solid var(--line); color:var(--tx-3); font-size:12px; letter-spacing:1.5px; background:linear-gradient(180deg,transparent,rgba(3,3,10,.7)); }
footer.emu-footer nav{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; margin-bottom:14px; }
footer.emu-footer nav a{ text-decoration:none; color:var(--tx-2); } footer.emu-footer nav a:hover{ color:#fff; text-shadow:0 0 10px var(--ac); }

/* ---------- KEDUDUKAN MOBILE ---------- */
@media (max-width:640px){
  .wrap{ padding:0 14px; }
  .brand small{ display:none; }
  .icon-btn{ padding:7px 10px; font-size:11px; }
  .section-title{ font-size:16px; letter-spacing:3px; margin-top:56px; }
  #dockBtn{ width:44px; height:44px; font-size:17px; }
  .btn-float{ padding:11px 16px; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important; }
}

/* =====================================================================
   HALAMAN TOKO (genshin.html / hsr.html)
   ===================================================================== */
.page-head{ text-align:center; padding:46px 0 22px; }
.page-head h2{ margin:0 0 8px; font-size:clamp(20px,4.6vw,32px); letter-spacing:6px; font-weight:700; color:#fff; text-transform:uppercase; text-shadow:0 0 30px rgba(var(--ac-rgb),.55); }
.page-head p{ margin:0 0 16px; color:var(--tx-2); font-family:var(--sans); }
.page-head .tags{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:12px; margin-bottom:14px; }

<script>
/* ===== MESIN BERSAMA EMU ===== */
/* =====================================================================
   EMU JOKI — MESIN BERSAMA  (emu.js)
   Dipakai semua halaman: layar boot, langit bintang (canvas), panel ◉,
   ganti warna & background, toast, modal, transisi antar halaman,
   efek tilt, dan modul toko (EMU.shop) untuk genshin.html / hsr.html.
   ===================================================================== */
(function () {
'use strict';

/* ------------------------------ util ------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  getJSON(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  setJSON(k, v) { return LS.set(k, JSON.stringify(v)); }
};
const SS = {
  get(k, d) { try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp  = n => 'Rp ' + (parseInt(n) || 0).toLocaleString('id-ID');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer  = matchMedia('(hover:hover) and (pointer:fine)').matches;
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    try { const t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;opacity:0'; document.body.append(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok; }
    catch (e2) { return false; }
  }
}

/* --------------------------- pengaturan --------------------------- */
const DEFAULT_BG = 'LINK GAMBAR DISINI';
const ACCENTS = {
  nebula: { n: 'NEBULA · Aether',  rgb: '148,168,255' },
  neon:   { n: 'NEON · Sol',       rgb: '255,110,200' },
  ember:  { n: 'EMBER · Storm',    rgb: '255,140,60'  },
  kristal:{ n: 'KRISTAL · Nexus',  rgb: '90,255,240'  },
  glitch: { n: 'GLITCH · Matrix',  rgb: '60,255,140'  },
  aurum:  { n: 'AURUM · Zero',     rgb: '255,220,150' }
};
const PARTS  = [{ n: 'Mati', d: 0 }, { n: 'Rendah', d: .5 }, { n: 'Sedang', d: 1 }, { n: 'Tinggi', d: 1.7 }, { n: 'Ultra', d: 2.6 }];
const SPEEDS = [{ n: 'Pelan', v: .45 }, { n: 'Normal', v: 1 }, { n: 'Cepat', v: 2 }];
const IMGS   = [{ n: 'Mati', o: 0 }, { n: 'Redup', o: .22 }, { n: 'Terang', o: .5 }];
const lowEnd = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 2;
const S = Object.assign({ accent: null, part: lowEnd ? 1 : 2, speed: 1, cursor: 1, img: 1 }, LS.getJSON('emu.set', {}));
const saveS = () => LS.setJSON('emu.set', S);

function applyAccent() {
  const key = (S.accent && ACCENTS[S.accent]) ? S.accent : (document.body.dataset.accent || 'nebula');
  const a = ACCENTS[key] || ACCENTS.nebula;
  document.documentElement.style.setProperty('--ac-rgb', a.rgb);
  let m = $('meta[name="theme-color"]'); if (m) m.content = '#03030a';
  return key;
}

/* --------------------------- toast & modal --------------------------- */
let toastEl, toastT;
function toast(msg, ms = 2600) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.id = 'emu-toast'; toastEl.setAttribute('role', 'status'); toastEl.setAttribute('aria-live', 'polite'); document.body.append(toastEl); }
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms);
}
const Modal = {
  open(id) { const m = typeof id === 'string' ? document.getElementById(id) : id; if (!m) return; m.classList.add('show'); document.body.classList.add('locked'); const f = $('button,[href],input', m); },
  close(id) { const m = typeof id === 'string' ? document.getElementById(id) : id; if (!m) return; m.classList.remove('show'); if (!$('.modal.show')) document.body.classList.remove('locked'); },
  closeAll() { $$('.modal.show').forEach(m => m.classList.remove('show')); document.body.classList.remove('locked'); }
};
document.addEventListener('click', e => {
  const m = e.target.classList && e.target.classList.contains('modal') ? e.target : null;
  if (m) Modal.close(m);
  const c = e.target.closest && e.target.closest('[data-close]');
  if (c) Modal.close(c.closest('.modal'));
});

/* ------------------------------ boot ------------------------------ */
function boot() {
  const first = !SS.get('emu.booted', false);
  let el = document.getElementById('emu-boot');           // pakai elemen statis di HTML (anti-kedip) kalau ada
  if (!el) { el = document.createElement('div'); el.id = 'emu-boot'; el.innerHTML = '<b>E M U &nbsp; J O K I</b><i></i><span></span>'; document.body.append(el); }
  const sp = el.querySelector('span'); if (sp) sp.textContent = first ? 'menyalakan mesin dimensi...' : 'menembus dimensi...';
  SS.set('emu.booted', true);
  const done = () => { el.classList.add('off'); setTimeout(() => el.remove(), 520); };
  const wait = first ? 850 : 260;
  const go = () => setTimeout(done, wait);
  if (document.readyState === 'complete') go(); else addEventListener('load', go, { once: true });
  setTimeout(done, 3200);   // pengaman
  const warp = document.createElement('div'); warp.className = 'emu-warp'; document.body.append(warp);
}

/* ------------------------- langit bintang ------------------------- */
const Sky = (() => {
  let cv, ctx, W = 0, H = 0, dpr = 1, white = [], tint = [], meteors = [], t = 0, last = 0, mx = 0, my = 0, px = 0, py = 0, nextM = 2.5, raf = 0;
  let fN = 0, fT = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build(); if (!running()) drawStatic();
  }
  function build() {
    white = []; tint = [];
    const n = clamp(Math.round(W * H / 9500 * PARTS[S.part].d), 0, 900);
    for (let i = 0; i < n; i++) {
      const z = .25 + Math.random() * .75;
      const s = { x: Math.random() * W, y: Math.random() * H, z, r: .4 + z * 1.15, tw: Math.random() * 6.28, ts: .6 + Math.random() * 1.8 };
      (Math.random() < .28 ? tint : white).push(s);
    }
  }
  const running = () => S.part > 0 && !reduceMotion && !document.hidden;
  function paint(list, dt, sp, style) {
    ctx.fillStyle = style;
    for (const s of list) {
      if (dt) { s.y += 7 * s.z * sp * dt; s.x -= 2.2 * s.z * sp * dt; if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; } if (s.x < -4) s.x = W + 4; }
      const sx = s.x - px * 34 * s.z, sy = s.y - py * 34 * s.z;
      ctx.globalAlpha = (.3 + .7 * s.z) * (.62 + .38 * Math.sin(t * s.ts + s.tw));
      if (s.r < 1.05) ctx.fillRect(sx, sy, s.r * 1.7, s.r * 1.7);
      else { ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, 6.283); ctx.fill(); ctx.globalAlpha *= .22; ctx.beginPath(); ctx.arc(sx, sy, s.r * 3, 0, 6.283); ctx.fill(); }
    }
  }
  function draw(dt) {
    ctx.clearRect(0, 0, W, H);
    const sp = SPEEDS[S.speed].v, rgb = getComputedStyle(document.documentElement).getPropertyValue('--ac-rgb').trim() || '148,168,255';
    paint(white, dt, sp, '#dfe6ff');
    paint(tint, dt, sp, 'rgb(' + rgb + ')');
    ctx.globalAlpha = 1;
    if (dt && S.part >= 2) {
      nextM -= dt * sp;
      if (nextM <= 0) { nextM = 3 + Math.random() * 5; meteors.push({ x: Math.random() * W * 1.1, y: -20 + Math.random() * H * .35, vx: -(420 + Math.random() * 300), vy: 230 + Math.random() * 170, life: 0 }); }
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i]; m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
        const a = Math.max(0, 1 - m.life / 1.1);
        if (a <= 0) { meteors.splice(i, 1); continue; }
        const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * .13, m.y - m.vy * .13);
        g.addColorStop(0, 'rgba(255,255,255,' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
        ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * .13, m.y - m.vy * .13); ctx.stroke();
      }
    }
  }
  function drawStatic() { if (S.part > 0) draw(0); else ctx.clearRect(0, 0, W, H); }
  function frame(ts) {
    raf = 0;
    if (!running()) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (ts - last) / 1000 || .016); last = ts; t += dt;
    px += (mx - px) * .05; py += (my - py) * .05;
    draw(dt);
    fN++; fT += dt;
    if (fT >= .5) { EMU.fps = Math.round(fN / fT); fN = 0; fT = 0; const e = $('#dkFps'); if (e) e.textContent = EMU.fps + ' FPS'; }
  }
  function start() { if (!raf && running()) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  return {
    init() {
      cv = document.createElement('canvas'); cv.id = 'emu-stars'; cv.setAttribute('aria-hidden', 'true');
      document.body.prepend(cv); ctx = cv.getContext('2d');
      resize();
      addEventListener('resize', debounce(resize, 150));
      addEventListener('pointermove', e => { mx = e.clientX / W - .5; my = e.clientY / H - .5; }, { passive: true });
      document.addEventListener('visibilitychange', start);
      start();
    },
    refresh() { build(); if (!running()) { drawStatic(); } start(); }
  };
})();

function initLayers() {
  const img = document.createElement('div'); img.id = 'emu-img'; img.setAttribute('aria-hidden', 'true');
  const neb = document.createElement('div'); neb.className = 'emu-nebula'; neb.setAttribute('aria-hidden', 'true');
  const veil = document.createElement('div'); veil.className = 'emu-veil'; veil.setAttribute('aria-hidden', 'true');
  document.body.prepend(veil); document.body.prepend(neb); document.body.prepend(img);
  Sky.init();
  if (finePointer) {
    const c = document.createElement('div'); c.className = 'emu-cursor'; c.style.transition = 'opacity .4s, transform .22s ease-out';
    document.body.append(c);
    addEventListener('pointermove', e => { c.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)'; c.classList.toggle('on', !!S.cursor); }, { passive: true });
    document.addEventListener('mouseleave', () => c.classList.remove('on'));
  }
}

/* ------------------------- background gambar ------------------------- */
let resetBtn, bgInput;
function applyBg() {
  const custom = LS.get('customBackground', '');

function shrinkImage(file, maxSide = 1600, q = .82) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, maxSide / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function tilt(sel, max = 6) {
  if (!finePointer || reduceMotion) { $$(sel).forEach(el => el.classList.add('shine')); return; }
  $$(sel).forEach(el => {
    el.classList.add('tilt', 'shine');
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      el.style.setProperty('--mx', (x * 100) + '%'); el.style.setProperty('--my', (y * 100) + '%');
      el.style.transform = 'perspective(800px) rotateX(' + ((.5 - y) * max) + 'deg) rotateY(' + ((x - .5) * max) + 'deg) translateY(-4px)';
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  });
}
function count(el, dur = 1200) {
  const to = parseFloat(el.dataset.to || el.textContent) || 0;
  if (reduceMotion) { el.textContent = to; return; }
  const t0 = performance.now();
  const step = n => { const p = clamp((n - t0) / dur, 0, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

    LS.set('emu.uid.' + KEY, uid); LS.set('emu.nick', name);
    const hist = orders(); hist.unshift({ orderId, game: cfg.game, items: lastOrder.items, total: lastOrder.total, uid, name, time: lastOrder.time }); LS.setJSON('emu.orders', hist.slice(0, 30));
    el('payDetail').innerHTML = '<div class="kv"><span>ID PESANAN</span><b>' + esc(orderId) + '</b></div><div class="kv"><span>LAYANAN</span><b>' + esc(lastOrder.items) + '</b></div><div class="kv"><span>' + esc(cfg.uidLabel || 'UID') + '</span><b>' + esc(uid) + '</b></div><div class="kv"><span>NAMA</span><b>' + esc(name) + '</b></div><div class="kv"><span>TOTAL</span><b>' + rp(lastOrder.total) + '</b></div>';
    Modal.open('paymentPopup');
    cart = []; saveCart(); cartOpen(false);
  }
  async function goToWhatsApp() {
    if (!lastOrder) return;
    const o = lastOrder;
    const w = window.open('about:blank', '_blank');            // dibuka sinkron supaya tidak diblokir popup blocker
    const fd = new FormData();
    fd.append('token', TOKEN); fd.append('orderId', o.orderId); fd.append('game', cfg.game);
    fd.append('uid', o.uid); fd.append('items', o.items); fd.append('total', o.total); fd.append('nickname', o.name); fd.append('status', 'Menunggu Pembayaran');
    try { toast('⏳ Menyimpan ke database...'); await fetch(API_URL, { method: 'POST', body: fd }); toast('✅ Pesanan tersimpan! ID: ' + o.orderId); }
    catch (err) { toast('⚠️ Gagal simpan ke sheet'); }
    let pesan = 'Halo Admin EMU\nID: #' + o.orderId + '\nPesanan ' + cfg.game + ':\n';
    o.lines.forEach(l => { pesan += '- ' + l.nama + (l.qty > 1 ? ' x' + l.qty : '') + ' : ' + rp(l.harga * l.qty) + '\n'; });
    pesan += '\nTotal: ' + rp(o.total) + '\nUID: ' + o.uid + '\nNama: ' + o.name;
    const url = 'https://wa.me/' + WA_NUM + '?text=' + encodeURIComponent(pesan);
    if (w) w.location.href = url; else location.href = url;
    Modal.close('paymentPopup');
  }

  /* ---- detail & riwayat ---- */
  let detailP = null;
  function detail(p) {
    detailP = p;
    el('detailContent').innerHTML =
      '<img class="detail-img" src="' + esc(p.gambar || PLACEHOLDER) + '" alt="' + esc(p.nama) + '">' +
      '<div class="kv"><span>NAMA</span><b>' + esc(p.nama) + '</b></div><div class="kv"><span>HARGA</span><b>' + rp(p.harga) + '</b></div><div class="kv"><span>KATEGORI</span><b>' + esc(p.kategori || '-') + '</b></div>' +
      '<p class="muted sans" style="font-size:13px;margin-top:12px">' + esc(p.deskripsi || 'Layanan joki cepat, aman dan privasi terjaga.') + '</p>';
    el('btnAddFromDetail').onclick = () => { add(p); Modal.close('detailPopup'); cartOpen(true); };
    Modal.open('detailPopup');
  }
  function showHistory() {
    const h = orders();
    el('historyList').innerHTML = h.length ? h.map(o =>
      '<div class="hist"><div><b>#' + esc(o.orderId) + '</b> <span class="tag">' + esc(o.game) + '</span><br><small class="muted">' + esc(o.items) + '</small><br><small class="dim">' + new Date(o.time).toLocaleString('id-ID') + ' · ' + rp(o.total) + '</small></div>' +
      '<div class="hist-act"><button class="chip" data-copy="' + esc(o.orderId) + '" type="button">Salin</button><a class="chip" href="cek.html?id=' + encodeURIComponent(o.orderId) + '">Cek</a></div></div>').join('')
      : '<div class="ci-empty">Belum ada pesanan dari perangkat ini.</div>';
    Modal.open('historyPopup');
  }

  /* ---- event ---- */
  qEl.addEventListener('input', debounce(() => { q = qEl.value.trim(); el('shopQwrap').classList.toggle('has', !!q); render(); }, 120));
  el('shopQx').addEventListener('click', () => { qEl.value = ''; q = ''; el('shopQwrap').classList.remove('has'); render(); qEl.focus(); });
  el('shopSort').addEventListener('change', e => { sort = e.target.value; render(); });
  el('shopFav').addEventListener('click', () => { favOnly = !favOnly; render(); });
  el('shopView').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return; view = b.dataset.v; LS.set('emu.view', view); render(); });
  tabsEl.addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; history_replace(); render(); });
  function history_replace() { try { history.replaceState(null, '', cat === 'semua' ? location.pathname : '#' + encodeURIComponent(cat)); } catch (e) {} }
  listEl.addEventListener('click', e => {
    const card = e.target.closest('.svc'); if (!card) return;
    const p = all[+card.dataset.i]; if (!p) return;
    const act = e.target.closest('[data-act]');
    if (!act) { if (e.target.closest('.svc-img,h3')) detail(p); return; }
    if (act.dataset.act === 'add') add(p);
    else if (act.dataset.act === 'detail') detail(p);
    else if (act.dataset.act === 'fav') {
      if (favs.has(p.nama)) favs.delete(p.nama); else favs.add(p.nama);
      LS.setJSON('emu.fav.' + KEY, Array.from(favs)); toast(favs.has(p.nama) ? '♥ Ditambah ke favorit' : 'Dihapus dari favorit'); render();
    }
  });
  listEl.addEventListener('error', e => { if (e.target.tagName === 'IMG' && e.target.src !== PLACEHOLDER) e.target.src = PLACEHOLDER; }, true);
  emptyEl.addEventListener('click', e => {
    if (e.target.closest('[data-retry]')) load(true);
    if (e.target.closest('[data-reset]')) { q = ''; qEl.value = ''; favOnly = false; cat = 'semua'; el('shopQwrap').classList.remove('has'); render(); }
    if (e.target.closest('[data-all]')) { cat = 'semua'; render(); }
  });
  el('cartFloatBtn').addEventListener('click', () => cartOpen());
  el('cartClose').addEventListener('click', () => cartOpen(false));
  el('cartClear').addEventListener('click', clearCart);
  el('cartItemsListPopup').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const k = +b.closest('.ci').dataset.k, it = cart[k]; if (!it) return;
    if (b.dataset.a === 'inc') it.qty++;
    else if (b.dataset.a === 'dec') { it.qty--; if (it.qty <= 0) cart.splice(k, 1); }
    else cart.splice(k, 1);
    saveCart();
  });
  el('btnOrder').addEventListener('click', generateOrder);
  el('btnWA').addEventListener('click', goToWhatsApp);
  el('btnCopyId').addEventListener('click', async () => { if (lastOrder) toast((await copyText(lastOrder.orderId)) ? 'ID pesanan disalin' : 'Gagal menyalin'); });
  el('btnHistClear').addEventListener('click', () => { LS.del('emu.orders'); showHistory(); toast('Riwayat dihapus'); });
  el('historyList').addEventListener('click', async e => { const c = e.target.closest('[data-copy]'); if (c) toast((await copyText(c.dataset.copy)) ? 'ID pesanan disalin' : 'Gagal menyalin'); });
  document.addEventListener('click', e => { if (e.target.closest('[data-emu="history"]')) { e.preventDefault(); showHistory(); } });
  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
    if (e.key === '/' && !typing) { e.preventDefault(); qEl.focus(); }
    else if ((e.key === 'c' || e.key === 'C') && !typing && !e.ctrlKey && !e.metaKey) cartOpen();
    else if (e.key === 'Escape') { cartOpen(false); if (typing) document.activeElement.blur(); }
  });

  /* ---- mulai ---- */
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (h) cat = h;
  el('uidIn').value = LS.get('emu.uid.' + KEY, ''); el('nameIn').value = LS.get('emu.nick', '');
  paintCart(); load();
}

/* ------------------------------ init ------------------------------ */
const EMU = { $, $$, LS, SS, esc, rp, toast, Modal, copy: copyText, tilt, count, shop, fps: 0, S, ACCENTS };
window.EMU = EMU;
function init() {
  applyAccent();
  boot(); initLayers(); initBg(); initDock(); initGuards(); initNav();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
<script>

/* Ganti ACTION_CEK jika nama action di Google Apps Script kamu berbeda.
   Endpoint dipakai sama seperti index.html (EMU.shop) & admin.html. */
const API_URL = "https://script.google.com/macros/s/AKfycbxL3kVn_10-yypGSc8wnH9QzRxOZ2c_gXEmf2HzOV6-hOgcTaLzD-PSlVTFn3EHzYc3/exec";
const ACTION_CEK = "cekPesanan";
const $id = id => document.getElementById(id);

function statusClass(s){
  s = String(s || '').toLowerCase();
  if (s.includes('selesai') || s.includes('lunas')) return 'ok';           // hijau
  if (s.includes('diproses') || s.includes('proses')) return 'blue';       // biru
  if (s.includes('menunggu') || s.includes('belum bayar') || s.includes('unpaid')) return 'bad'; // merah
  if (s.includes('batal') || s.includes('gagal') || s.includes('tolak')) return 'bad'; // merah
  return 'gold';
}

/* Deteksi apakah "row" yang dibalas server sebenarnya adalah sinyal
   "tidak ditemukan" yang dibungkus sebagai data biasa (bukan row.error /
   row.notFound). Ini terjadi kalau Apps Script membalas object dengan
   status literal "TIDAK_DITEMUKAN" / "NOT FOUND" dsb, alih-alih flag
   notFound / error yang semestinya. */
function isNotFoundRow(row){
  if (!row) return true;
  const statusText = String(row.status || '').trim().toLowerCase();
  const looksNotFound = /tidak\s*ditemukan|not\s*found|notfound|nf|invalid|kosong/.test(statusText);
  const noRealData = !row.orderId && !row.game && !row.items;
  return looksNotFound || (noRealData && !row.status);
}

/* Cek apakah status masih menunggu pembayaran (bukan sudah dibatalkan/ditolak) */
function isMenungguPembayaran(s){
  s = String(s || '').toLowerCase();
  const menunggu = s.includes('menunggu') || s.includes('belum bayar') || s.includes('unpaid');
  const sudahBatal = s.includes('batal') || s.includes('gagal') || s.includes('tolak');
  return menunggu && !sudahBatal;
}

let currentRow = null; // data pesanan yang sedang ditampilkan, dipakai buat update instan saat dibatalkan

function renderHasil(data){
  currentRow = data;
  const box = $id('hasilCek');
  if (!data){
    box.innerHTML = '<div class="result-empty">❌ Pesanan dengan ID tersebut tidak ditemukan. Periksa lagi ID pesananmu, atau pastikan penulisannya (huruf besar/kecil, spasi, tanda "-") persis sama seperti saat order.</div>';
    return;
  }
  const cls = statusClass(data.status);
  const bisaBatal = isMenungguPembayaran(data.status) && data.orderId;
  box.innerHTML =
    '<span class="result-status ' + cls + '">' + EMU.esc(data.status || 'Status tidak diketahui') + '</span>' +
    '<div class="kv"><span>ID PESANAN</span><b>#' + EMU.esc(data.orderId || '-') + '</b></div>' +
    '<div class="kv"><span>GAME</span><b>' + EMU.esc(data.game || '-') + '</b></div>' +
    '<div class="kv"><span>LAYANAN</span><b>' + EMU.esc(data.items || '-') + '</b></div>' +
    (data.uid ? '<div class="kv"><span>UID</span><b>' + EMU.esc(data.uid) + '</b></div>' : '') +
    (data.name || data.nickname ? '<div class="kv"><span>NAMA</span><b>' + EMU.esc(data.name || data.nickname) + '</b></div>' : '') +
    (data.total ? '<div class="kv"><span>TOTAL</span><b>' + EMU.rp(data.total) + '</b></div>' : '') +
    (bisaBatal ? '<button type="button" class="btn btn-danger btn-block" id="btnBatalkanPesanan" data-order-id="' + EMU.esc(data.orderId) + '" style="margin-top:16px">✕ Batalkan Pembelian</button>' : '');
}

/* Bersihkan ID: hilangkan spasi di awal/akhir DAN spasi di tengah,
   samakan huruf jadi besar. Sebagian orang tanpa sadar menyalin ID
   dengan spasi tersembunyi dari WhatsApp/sheet, yang bikin pencarian
   di server gagal walau ID "kelihatannya" sama. */
function normalizeId(raw){
  return String(raw || '').trim().toUpperCase().replace(/^#/, '').replace(/\s+/g, '');
}

async function fetchPesanan(id){
  // Kirim beberapa nama parameter sekaligus (id, orderId, kode) supaya
  // tetap cocok apapun nama parameter yang dibaca oleh Apps Script kamu.
  const url = API_URL + '?action=' + ACTION_CEK +
    '&id=' + encodeURIComponent(id) +
    '&orderId=' + encodeURIComponent(id) +
    '&kode=' + encodeURIComponent(id);
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  // Bantuan debug: buka DevTools > Console untuk lihat respons mentah dari server.
  console.log('[EMU cekPesanan] respons server untuk ID', id, ':', data);
  return Array.isArray(data) ? data[0] : data;
}

async function cekStatus(idParam){
  const inp = $id('inputOrderId');
  const id = normalizeId(idParam || inp.value);
  if (!id){ EMU.toast('⚠️ Masukkan ID pesanan dulu'); inp.focus(); return; }
  inp.value = id;
  $id('hasilCek').innerHTML = '<div class="skel" style="min-height:120px"></div>';
  try{
    const row = await fetchPesanan(id);
    if (!row || row.error || row.notFound || isNotFoundRow(row)) { renderHasil(null); return; }
    renderHasil(row);
  } catch (err){
    console.error('[EMU cekPesanan] gagal fetch:', err);
    $id('hasilCek').innerHTML = '<div class="result-empty">⚠️ Gagal menghubungi server. Periksa koneksi internetmu lalu coba lagi.</div>';
  }
}

/* Kirim permintaan pembatalan pesanan ke Apps Script (action=cancel,
   sesuai doGet di Code.gs milikmu — request GET, tanpa token). */
const ACTION_BATAL = "cancel";

async function batalkanPesanan(orderId){
  if (!orderId) return;
  if (!confirm('Batalkan pesanan #' + orderId + '? Tindakan ini tidak bisa dibatalkan kembali.')) return;

  const btn = $id('btnBatalkanPesanan');
  if (btn){ btn.disabled = true; btn.textContent = 'Membatalkan...'; }

  try{
    const url = API_URL + '?action=' + ACTION_BATAL + '&orderId=' + encodeURIComponent(orderId);
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const hasil = await res.json();
    if (!hasil || hasil.status !== 'success') throw new Error('Server membalas: ' + (hasil && hasil.status));

    EMU.toast('✅ Pesanan #' + orderId + ' dibatalkan');
    // Update tampilan status jadi "Dibatalkan" secara instan (data di sheet sudah ikut berubah)
    if (currentRow && currentRow.orderId === orderId){
      currentRow.status = 'Dibatalkan';
      renderHasil(currentRow);
    }
  } catch (err){
    console.error('[EMU batalkanPesanan] gagal:', err);
    EMU.toast('⚠️ Gagal membatalkan pesanan. Coba lagi.');
    if (btn){ btn.disabled = false; btn.textContent = '✕ Batalkan Pembelian'; }
  }
}

$id('hasilCek').addEventListener('click', e => {
  const btn = e.target.closest('#btnBatalkanPesanan');
  if (!btn) return;
  batalkanPesanan(btn.dataset.orderId);
});

function renderHistory(){
  const list = EMU.LS.getJSON('emu.orders', []);
  const wrap = $id('localHistoryList');
  if (!list.length){
    wrap.innerHTML = '<div class="history-empty">Belum ada pesanan dari perangkat ini.</div>';
    return;
  }
  wrap.innerHTML = list.map((o, i) =>
    '<div class="history-item" data-i="' + i + '">' +
      '<div class="history-info" data-act="open"><div class="history-id">#' + EMU.esc(o.orderId) + '</div><div class="history-game">' + EMU.esc(o.game) + ' · ' + EMU.esc(o.items || '') + '</div></div>' +
      '<button type="button" class="btn btn-danger" data-act="hapus" style="padding:6px 12px;font-size:11px">Hapus</button>' +
    '</div>'
  ).join('');
}

$id('btnCek').addEventListener('click', () => cekStatus());
$id('inputOrderId').addEventListener('keydown', e => { if (e.key === 'Enter') cekStatus(); });
$id('localHistoryList').addEventListener('click', e => {
  const item = e.target.closest('.history-item'); if (!item) return;
  const list = EMU.LS.getJSON('emu.orders', []);
  const o = list[+item.dataset.i]; if (!o) return;
  if (e.target.closest('[data-act="hapus"]')){
    list.splice(+item.dataset.i, 1);
    EMU.LS.setJSON('emu.orders', list);
    renderHistory();
    EMU.toast('🗑️ Dihapus dari histori');
    return;
  }
  cekStatus(o.orderId);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

renderHistory();
const qId = new URLSearchParams(location.search).get('id');
if (qId) cekStatus(qId);

</script>
