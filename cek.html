<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<title>Cek Pesanan - neve Joki</title>
<meta name="description" content="Cek status pesanan joki dengan ID pesananmu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05060c; --panel:rgba(12,14,28,.72); --line:rgba(130,145,230,.18); --line-hi:rgba(148,168,255,.6);
  --tx:#e6e9ff; --tx-2:#9aa3d6; --tx-3:#6d76ad; --ac:#94a8ff;
  --ok:87,224,168; --bad:255,110,120; --info:90,160,255; --gold:255,220,150;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:14px/1.6 var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40% 34% at 15% 0%,rgba(148,168,255,.14),transparent 70%),radial-gradient(34% 30% at 90% 100%,rgba(160,90,255,.09),transparent 70%)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(5,6,12,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.bar{max-width:880px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;margin-right:auto;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand img{height:34px;width:auto;max-width:140px;object-fit:contain;display:block}
nav{display:flex;gap:4px}
nav a{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:500;color:var(--tx-2);text-decoration:none;transition:.15s}
nav a:hover{color:#fff;background:rgba(148,168,255,.1)}
nav a.on{color:#fff;background:rgba(148,168,255,.16)}

/* konten */
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:44px 20px 40px}
h1{font-size:clamp(22px,5vw,28px);font-weight:700;letter-spacing:-.02em;text-align:center}
.sub{text-align:center;color:var(--tx-2);margin:6px 0 26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:rgba(8,10,22,.9);color:var(--tx);font:inherit;font-size:16px;outline:none;transition:.2s}
input:focus{border-color:var(--line-hi);box-shadow:0 0 0 3px rgba(148,168,255,.15)}
input::placeholder{color:var(--tx-3)}
.btn{appearance:none;font:inherit;font-size:13px;font-weight:600;height:44px;padding:0 20px;border-radius:11px;cursor:pointer;color:#fff;background:rgba(148,168,255,.2);border:1px solid var(--line-hi);transition:.2s;touch-action:manipulation}
.btn:hover{background:rgba(148,168,255,.32)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.danger{background:rgba(var(--bad),.14);border-color:rgba(var(--bad),.6);color:#ffd1d5;width:100%;margin-top:16px}
.btn.danger:hover{background:rgba(var(--bad),.26)}
.btn.sm{height:32px;padding:0 12px;font-size:12px}

/* hasil */
#hasil{margin-top:20px}
#hasil:empty{display:none}
.status{display:inline-block;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;border:1px solid}
.status.ok{background:rgba(var(--ok),.14);color:#c9ffe8;border-color:rgba(var(--ok),.6)}
.status.gold{background:rgba(var(--gold),.14);color:#ffdc96;border-color:rgba(var(--gold),.6)}
.status.bad{background:rgba(var(--bad),.14);color:#ffd1d5;border-color:rgba(var(--bad),.6)}
.status.blue{background:rgba(var(--info),.14);color:#cfe2ff;border-color:rgba(var(--info),.6)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--tx-3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}
.kv b{font-weight:600;text-align:right;word-break:break-word}
.empty{text-align:center;color:var(--tx-2);padding:18px 6px;font-size:13.5px}
.skel{height:120px;border-radius:12px;background:linear-gradient(100deg,rgba(148,168,255,.05) 30%,rgba(148,168,255,.14) 50%,rgba(148,168,255,.05) 70%) 0 0/200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* riwayat */
h2{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin:28px 2px 10px}
.hist{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:rgba(8,10,22,.55);transition:border-color .2s}
.hist:hover{border-color:var(--line-hi)}
.hist .info{flex:1;min-width:0;cursor:pointer}
.hist .btn{flex:none}
.hist b{display:block;font-size:14px;font-weight:600}
.hist small{display:block;color:var(--tx-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

footer{border-top:1px solid var(--line);padding:22px 20px calc(24px + env(safe-area-inset-bottom,0));text-align:center;color:var(--tx-3);font-size:12px}
footer nav{justify-content:center;flex-wrap:wrap;margin-bottom:8px}
footer nav a{font-size:12px;padding:4px 10px}

#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0));transform:translate(-50%,16px);max-width:min(420px,calc(100vw - 32px));padding:11px 20px;border-radius:12px;background:rgba(8,10,22,.97);border:1px solid var(--line-hi);color:var(--tx);font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:560px){
  .bar{padding:8px 14px;gap:8px}
  nav a{padding:6px 10px;font-size:12px}
  .brand img{height:30px}
  main{padding:30px 14px 30px}
  .card{padding:16px}
  .btn{flex:1 1 100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="index.html" aria-label="Beranda"><img src="logo.png" alt="neve" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'neve'}))"></a>
    <nav aria-label="Menu utama">
      <a href="index.html">Beranda</a>
      <a href="cek.html" class="on" aria-current="page">Cek Pesanan</a>
    </nav>
  </div>
</header>

<main>
  <h1>Cek Status Pesanan</h1>
  <p class="sub">Masukkan ID Pesanan yang diberikan saat order</p>

  <section class="card">
    <form class="row" id="f" novalidate>
      <label class="hidden" for="oid">ID Pesanan</label>
      <input id="oid" placeholder="Contoh: GI123456 atau HSR123456" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
      <button class="btn" id="btnCek" type="submit">Cek Sekarang</button>
    </form>
    <div id="hasil" aria-live="polite"></div>
  </section>

  <h2>Histori pesanan di perangkat ini</h2>
  <div id="hist"></div>
</main>

<footer>
  <nav aria-label="Tautan bawah">
    <a href="cek.html">Cek Pesanan</a><a href="snk.html">Syarat &amp; Ketentuan</a><a href="https://wa.me/6285150886538" target="_blank" rel="noopener">Hubungi CS</a>
  </nav>
  © 2026 neve Enterprise. All rights reserved.
</footer>
<div id="toast" role="status"></div>

<script>
/* ===== Konfigurasi (sama seperti sebelumnya) ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbxL3kVn_10-yypGSc8wnH9QzRxOZ2c_gXEmf2HzOV6-hOgcTaLzD-PSlVTFn3EHzYc3/exec";
const ACTION_CEK = "cekPesanan";
const ACTION_BATAL = "cancel";
const HIST_KEY = "emu.orders";   /* kunci penyimpanan dipertahankan agar histori lama tetap terbaca */

/* ===== Util ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => "Rp " + (parseInt(n) || 0).toLocaleString("id-ID");
const LS = {
  json(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  setJson(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let tt;
function toast(m, ms = 2600){ const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), ms); }

/* ===== Logika status ===== */
function statusClass(s){
  s = String(s || "").toLowerCase();
  if (s.includes("selesai") || s.includes("lunas")) return "ok";
  if (s.includes("proses")) return "blue";
  if (s.includes("menunggu") || s.includes("belum bayar") || s.includes("unpaid")) return "bad";
  if (s.includes("batal") || s.includes("gagal") || s.includes("tolak")) return "bad";
  return "gold";
}
/* Server kadang membalas "tidak ditemukan" sebagai data biasa */
function isNotFoundRow(row){
  if (!row) return true;
  const st = String(row.status || "").trim().toLowerCase();
  const nf = /tidak\s*ditemukan|not\s*found|notfound|nf|invalid|kosong/.test(st);
  const noData = !row.orderId && !row.game && !row.items;
  return nf || (noData && !row.status);
}
function isMenungguPembayaran(s){
  s = String(s || "").toLowerCase();
  const menunggu = s.includes("menunggu") || s.includes("belum bayar") || s.includes("unpaid");
  const batal = s.includes("batal") || s.includes("gagal") || s.includes("tolak");
  return menunggu && !batal;
}
/* Hilangkan spasi (termasuk di tengah), samakan huruf besar, buang "#" */
const normalizeId = raw => String(raw || "").trim().toUpperCase().replace(/^#/, "").replace(/\s+/g, "");

/* ===== Tampilan hasil ===== */
let currentRow = null;
function renderHasil(d){
  currentRow = d;
  const box = $("hasil");
  if (!d){
    box.innerHTML = '<div class="empty">Pesanan dengan ID tersebut tidak ditemukan. Periksa lagi penulisannya (huruf besar/kecil, spasi, tanda "-") agar persis sama seperti saat order.</div>';
    return;
  }
  const bisaBatal = isMenungguPembayaran(d.status) && d.orderId;
  const kv = (k, v) => '<div class="kv"><span>' + k + '</span><b>' + v + '</b></div>';
  box.innerHTML =
    '<span class="status ' + statusClass(d.status) + '">' + esc(d.status || "Status tidak diketahui") + '</span>' +
    kv("ID Pesanan", "#" + esc(d.orderId || "-")) +
    kv("Game", esc(d.game || "-")) +
    kv("Layanan", esc(d.items || "-")) +
    (d.uid ? kv("UID", esc(d.uid)) : "") +
    (d.name || d.nickname ? kv("Nama", esc(d.name || d.nickname)) : "") +
    (d.total ? kv("Total", rp(d.total)) : "") +
    (bisaBatal ? '<button type="button" class="btn danger" id="btnBatal" data-order-id="' + esc(d.orderId) + '">Batalkan Pembelian</button>' : "");
}

/* ===== API ===== */
async function fetchPesanan(id){
  /* beberapa nama parameter sekaligus agar cocok dengan Apps Script */
  const url = API_URL + "?action=" + ACTION_CEK + "&id=" + encodeURIComponent(id) + "&orderId=" + encodeURIComponent(id) + "&kode=" + encodeURIComponent(id);
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}
let busy = false;
async function cekStatus(idParam){
  if (busy) return;
  const inp = $("oid"), id = normalizeId(idParam || inp.value);
  if (!id){ toast("Masukkan ID pesanan dulu"); inp.focus(); return; }
  inp.value = id;
  busy = true; $("btnCek").disabled = true;
  $("hasil").innerHTML = '<div class="skel"></div>';
  try{
    const row = await fetchPesanan(id);
    renderHasil(!row || row.error || row.notFound || isNotFoundRow(row) ? null : row);
  }catch(err){
    console.error("[cekPesanan]", err);
    $("hasil").innerHTML = '<div class="empty">Gagal menghubungi server. Periksa koneksi internetmu lalu coba lagi.</div>';
  }finally{ busy = false; $("btnCek").disabled = false; }
}
async function batalkanPesanan(orderId){
  if (!orderId) return;
  if (!confirm("Batalkan pesanan #" + orderId + "? Tindakan ini tidak bisa dibatalkan kembali.")) return;
  const btn = $("btnBatal");
  if (btn){ btn.disabled = true; btn.textContent = "Membatalkan..."; }
  try{
    const res = await fetch(API_URL + "?action=" + ACTION_BATAL + "&orderId=" + encodeURIComponent(orderId));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const h = await res.json();
    if (!h || h.status !== "success") throw new Error("Server membalas: " + (h && h.status));
    toast("Pesanan #" + orderId + " dibatalkan");
    if (currentRow && currentRow.orderId === orderId){ currentRow.status = "Dibatalkan"; renderHasil(currentRow); }
  }catch(err){
    console.error("[batalkanPesanan]", err);
    toast("Gagal membatalkan pesanan. Coba lagi.");
    if (btn){ btn.disabled = false; btn.textContent = "Batalkan Pembelian"; }
  }
}

/* ===== Histori lokal ===== */
function renderHistory(){
  const list = LS.json(HIST_KEY, []), w = $("hist");
  if (!list.length){ w.innerHTML = '<div class="empty">Belum ada pesanan dari perangkat ini.</div>'; return; }
  w.innerHTML = list.map((o, i) =>
    '<div class="hist" data-i="' + i + '"><div class="info" data-act="open"><b>#' + esc(o.orderId) + '</b><small>' + esc(o.game) + ' · ' + esc(o.items || "") + '</small></div>' +
    '<button type="button" class="btn sm danger" style="width:auto;margin:0" data-act="hapus">Hapus</button></div>'
  ).join("");
}

/* ===== Event ===== */
$("f").addEventListener("submit", e => { e.preventDefault(); cekStatus(); });
$("hasil").addEventListener("click", e => { const b = e.target.closest("#btnBatal"); if (b) batalkanPesanan(b.dataset.orderId); });
$("hist").addEventListener("click", e => {
  const item = e.target.closest(".hist"); if (!item) return;
  const list = LS.json(HIST_KEY, []), i = +item.dataset.i, o = list[i]; if (!o) return;
  if (e.target.closest('[data-act="hapus"]')){
    list.splice(i, 1); LS.setJson(HIST_KEY, list); renderHistory(); toast("Dihapus dari histori"); return;
  }
  cekStatus(o.orderId);
  scrollTo({top: 0, behavior: "smooth"});
});

renderHistory();
const qId = new URLSearchParams(location.search).get("id");
if (qId) cekStatus(qId);
</script>
</body>
</html>
