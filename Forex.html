<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta id="vp" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<title>Forex — Trading &amp; Pemantauan Posisi</title>
<meta property="og:title" content="Forex — Trading &amp; Pemantauan Posisi">
<meta property="og:description" content="Trading Mora dan Credit dengan posisi tersinkron dan pemantauan spreadsheet.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="description" content="Forex — trading simulasi dengan harga pasar nyata. Gunakan Mora dan Credit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FOREX
   ===================================================================== */
:root{
  color-scheme:dark;
  --ac-rgb:148,168,255; --ac:rgb(var(--ac-rgb));
  --gold-rgb:255,220,150; --gold:rgb(var(--gold-rgb));
  --credit-rgb:90,255,240; --credit:rgb(var(--credit-rgb));
  --up:#2ebd85; --dn:#f6465d; --up-rgb:46,189,133; --dn-rgb:246,70,93;
  --bg:#05060d; --panel:rgba(10,13,28,.92); --panel-2:rgba(16,20,42,.85); --panel-3:rgba(22,27,54,.9);
  --line:rgba(110,125,215,.2); --line-hi:rgba(var(--ac-rgb),.7);
  --tx:#e3e7ff; --tx-2:#98a2d6; --tx-3:#6a74ab;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --hdr:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{padding-top:var(--safe-t);font:14px/1.5 var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(40% 34% at 12% 0%,rgba(var(--ac-rgb),.14),transparent 70%),radial-gradient(36% 32% at 92% 8%,rgba(160,90,255,.09),transparent 70%),radial-gradient(40% 30% at 60% 100%,rgba(var(--ac-rgb),.07),transparent 72%)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
::selection{background:rgba(var(--ac-rgb),.35);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(110,125,215,.3);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--tx-3)}
.cur-ico{width:18px;height:18px;object-fit:contain;vertical-align:middle;flex:none}

/* ---------- profil (menyatu di kartu simbol & daftar pasar) ---------- */
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--line-hi);background:#0c0f24;display:block;flex:none}
.sh-av{position:absolute;top:50%;right:12px;transform:translateY(-50%);display:block;border-radius:50%}.sh-av .av{width:30px;height:30px}
.sh-av:hover .av{border-color:#fff}
.wl-top{display:flex;align-items:center;gap:8px}.wl-top .ib{flex:none;width:30px;padding:0}.wl-top .ib svg{width:14px;height:14px}.wl-top .ib.act{color:#fff;border-color:var(--line-hi);background:rgba(var(--ac-rgb),.2)}
.srch .x{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--tx-3);font-size:13px;border-radius:50%}.srch .x:hover{color:#fff}
.wl-av{display:none}

/* ---------- layout ---------- */
.app{max-width:1680px;margin:12px auto 24px;padding:0 12px;display:grid;grid-template-columns:292px minmax(0,1fr) 332px;gap:12px;align-items:start}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.wl,.tk{position:sticky;top:calc(var(--hdr) + 10px);max-height:calc(100dvh - var(--hdr) - 24px);display:flex;flex-direction:column;overflow:hidden}
.tk{overflow:auto}
.mid{display:flex;flex-direction:column;gap:12px;min-width:0}

/* ---------- watchlist ---------- */
.wl-h{padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.srch{display:flex;align-items:center;gap:8px;height:32px;margin-top:8px;padding:0 10px;border-radius:99px;background:rgba(9,12,30,.9);border:1px solid rgba(96,110,190,.3);color:var(--tx-3)}
.srch:focus-within{border-color:var(--line-hi)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--tx)}
.srch svg{width:16px;height:16px;flex:none}
.gtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.gtabs::-webkit-scrollbar{display:none}
.gt{flex:none;height:28px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:600;color:var(--tx-2);border:1px solid var(--line);background:rgba(9,12,30,.6);transition:.15s}
.gt.on{color:#fff;background:rgba(var(--ac-rgb),.22);border-color:var(--line-hi)}
.wl-list{flex:1;overflow-y:auto;min-height:120px}
.wr{display:grid;grid-template-columns:22px minmax(0,1fr) 54px auto;align-items:center;gap:8px;width:100%;padding:9px 12px;text-align:left;border-bottom:1px solid rgba(110,125,215,.1);transition:background .15s;position:relative}
.wr:hover{background:rgba(var(--ac-rgb),.07)}
.wr.on{background:rgba(var(--ac-rgb),.14);box-shadow:inset 3px 0 0 var(--ac)}
.star{width:22px;height:22px;display:grid;place-items:center;color:var(--tx-3);font-size:15px;line-height:1;border-radius:6px}
.star.on{color:#ffd166}.star:hover{color:#ffd166}
.wn{min-width:0}.wn b{display:block;font-size:13.5px;font-weight:700;letter-spacing:.01em}
.wn small{display:block;font-size:11px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr svg.sp{width:54px;height:24px;overflow:visible}
.wp{text-align:right}.wp b{display:block;font-size:13.5px;font-weight:700;transition:color .4s}
.wp b.fu{color:var(--up)}.wp b.fd{color:var(--dn)}
.wp small{display:block;font-size:11.5px;font-weight:600}
.wl-f{flex:none;padding:10px 12px;border-top:1px solid var(--line);font-size:11px;line-height:1.5;color:var(--tx-3)}
.dotc{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--tx-3);vertical-align:middle}
.dotc.ok{background:var(--up);box-shadow:0 0 8px rgba(var(--up-rgb),.7)}.dotc.mid{background:#ffb84d}

/* ---------- header simbol ---------- */
.symh{position:relative;padding:8px 52px 8px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px}
.sh-l{min-width:0}
.sh-l h1{font-size:16px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:99px;border:1px solid}
.badge.live{color:var(--up);border-color:rgba(var(--up-rgb),.5);background:rgba(var(--up-rgb),.1)}
.badge.ecb{color:#8fb4ff;border-color:rgba(120,160,255,.5);background:rgba(120,160,255,.1)}
.badge.sim{color:var(--tx-2);border-color:var(--line);background:rgba(255,255,255,.04)}
.sh-l p{font-size:12px;color:var(--tx-3)}
.sh-px{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh-px .big{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.1;transition:color .3s}
.sh-px .chg{font-size:12.5px;font-weight:700}
.sh-m{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.kv{display:flex;flex-direction:column;gap:1px}.kv small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3)}.kv b{font-size:13.5px;font-weight:700}

/* ---------- chart ---------- */
.chartc{overflow:hidden}
.ctb{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:flex;gap:2px;background:rgba(9,12,30,.8);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--tx-2);transition:.15s;white-space:nowrap}
.seg button:hover{color:#fff}.seg button.on{background:rgba(var(--ac-rgb),.25);color:#fff}
.ctb .sp{flex:1}
.ib{height:30px;min-width:30px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:rgba(9,12,30,.7);font-size:12px;font-weight:600;color:var(--tx-2);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.ib:hover{color:#fff;border-color:var(--line-hi)}
.spd{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx-3)}
.spd select{height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(9,12,30,.9);padding:0 6px;font-size:12px;font-weight:600}
.cwrap{position:relative;height:clamp(340px,54vh,600px);touch-action:pan-y;cursor:crosshair}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.lg{position:absolute;left:12px;top:8px;font-size:11.5px;color:var(--tx-2);pointer-events:none;display:flex;gap:10px;flex-wrap:wrap;text-shadow:0 1px 6px #000}
.lg b{font-weight:700}
.cmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--tx-3);font-size:13px;pointer-events:none;text-align:center;padding:20px}

/* ---------- ticket ---------- */
.tk-sec{padding:14px;border-bottom:1px solid var(--line)}
.tk-sec:last-child{border-bottom:0}
.tk h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac{padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.ac small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);display:flex;align-items:center;gap:6px}
.ac b{font-size:17px;font-weight:800}
.ac.m b{color:var(--gold)}.ac.c b{color:var(--credit)}
.eqrow{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--tx-2)}
.eqrow b{font-weight:700}
.sidebtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb{padding:11px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);text-align:center;transition:.15s}
.sb small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-2)}
.sb b{display:block;font-size:16px;font-weight:800;margin-top:1px}
.sb.sell.on{border-color:var(--dn);background:rgba(var(--dn-rgb),.16)}.sb.sell.on small,.sb.sell.on b{color:var(--dn)}
.sb.buy.on{border-color:var(--up);background:rgba(var(--up-rgb),.16)}.sb.buy.on small,.sb.buy.on b{color:var(--up)}
.sprd{text-align:center;font-size:11px;color:var(--tx-3);margin-top:7px}
.fld{margin-top:12px}
.fld>label,.fld>.lb{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--tx-2);margin-bottom:6px}
.fld>label small,.fld>.lb small{color:var(--tx-3);font-weight:500}
.curseg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.curseg button{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;color:var(--tx-2)}
.curseg button.on.m{border-color:rgba(var(--gold-rgb),.85);background:rgba(var(--gold-rgb),.12);color:var(--gold)}
.curseg button.on.c{border-color:rgba(var(--credit-rgb),.85);background:rgba(var(--credit-rgb),.12);color:var(--credit)}
.inp{display:flex;align-items:center;height:42px;border-radius:10px;border:1px solid rgba(96,110,190,.4);background:rgba(9,12,30,.92);overflow:hidden}
.inp:focus-within{border-color:var(--line-hi);box-shadow:0 0 0 3px rgba(var(--ac-rgb),.14)}
.inp input{flex:1;min-width:0;height:100%;padding:0 12px;background:none;border:0;outline:0;font-size:16px;font-weight:600}
.inp .st{width:38px;height:100%;display:grid;place-items:center;color:var(--tx-2);font-size:18px;border-left:1px solid var(--line)}
.inp .st:hover{color:#fff;background:rgba(var(--ac-rgb),.12)}
.pcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.pcs button,.lvs button{height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(9,12,30,.7);font-size:12px;font-weight:600;color:var(--tx-2)}
.pcs button:hover,.lvs button:hover{color:#fff;border-color:var(--line-hi)}
.lvs{display:flex;gap:6px;flex-wrap:wrap}.lvs button{flex:1 0 44px}.lvs button.on{color:#fff;background:rgba(var(--ac-rgb),.25);border-color:var(--line-hi)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.two>*{min-width:0}
.sum{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:rgba(9,12,30,.55);padding:4px 12px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:12.5px;border-bottom:1px dashed rgba(110,125,215,.14)}
.sum div:last-child{border:0}.sum span{color:var(--tx-3)}.sum b{font-weight:700;text-align:right}
.go{width:100%;height:50px;margin-top:14px;border-radius:12px;font-weight:800;font-size:14.5px;letter-spacing:.03em;color:#fff;transition:filter .15s,transform .1s;box-shadow:0 8px 24px -10px currentColor}
.go.buy{background:linear-gradient(180deg,#34cf96,#1f9d6c)}.go.sell{background:linear-gradient(180deg,#ff5c73,#d12f47)}
.gobtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.gobtns .go{margin-top:0;height:56px;line-height:1.2;padding:0 6px}.go small{display:block;font-size:11px;letter-spacing:.1em;opacity:.92}.go b{display:block;font-size:15.5px;font-weight:800;letter-spacing:0}
.go:hover{filter:brightness(1.1)}.go:active{transform:scale(.985)}.go:disabled{opacity:.45;cursor:not-allowed;filter:none}
.err{margin-top:10px;font-size:12px;color:var(--dn);min-height:16px}
.note{font-size:11px;color:var(--tx-3);line-height:1.55}

/* ---------- posisi / riwayat ---------- */
.posp{overflow:hidden}
.ptabs{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ptabs button{height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx-2);white-space:nowrap}
.ptabs button.on{background:rgba(var(--ac-rgb),.2);color:#fff}
.ptabs .sp{flex:1}
.ptabs .ib.dg{color:#ffb4bd;border-color:rgba(var(--dn-rgb),.45)}
.pbody{padding:10px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.pc{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--up)}.pc.sell::before{background:var(--dn)}
.pc-h{display:flex;align-items:center;gap:8px}
.pc-h b{font-size:14px}.tag{font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:6px}
.tag.buy{background:rgba(var(--up-rgb),.16);color:var(--up)}.tag.sell{background:rgba(var(--dn-rgb),.16);color:var(--dn)}
.pc-h .pl{margin-left:auto;text-align:right;font-weight:800;font-size:15px;line-height:1.15}.pc-h .pl small{display:block;font-size:11px;font-weight:700}
.pc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;font-size:12px}
.pc-g span{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx-3)}.pc-g b{font-weight:700}
.pc-a{display:flex;gap:8px}
.pc-a button{flex:1;height:44px;border-radius:9px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:rgba(9,12,30,.7)}
.pc-a button.cl{background:rgba(var(--dn-rgb),.16);border-color:rgba(var(--dn-rgb),.5);color:#ffc0c8}.pc-a button:hover{filter:brightness(1.2)}
.empty{padding:34px 12px;text-align:center;color:var(--tx-3);font-size:13px}
.htab{width:100%;border-collapse:collapse;font-size:12.5px}
.htab th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);text-align:left;padding:6px 8px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
.htab td{padding:9px 8px;border-bottom:1px solid rgba(110,125,215,.1);white-space:nowrap}
.htab tr:hover td{background:rgba(var(--ac-rgb),.05)}.htab td.r,.htab th.r{text-align:right}
.hwrap{overflow-x:auto}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stc{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}.stc small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3)}.stc b{font-size:18px;font-weight:800;display:block;margin-top:2px}

/* ---------- responsif sentuhan ---------- */
button,[role=button],.go,.sb,.wr{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.pressed{filter:brightness(1.3)!important;transform:scale(.97)!important}
.cbtn{position:absolute;left:10px;bottom:32px;z-index:3;height:38px;padding:0 16px;border-radius:99px;font-size:12.5px;font-weight:800;color:#fff;background:rgba(246,70,93,.9);border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 22px -8px #000;display:flex;align-items:center;white-space:nowrap}
.cbtn.p{background:rgba(46,189,133,.9)}
.qi{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--tx-2);padding:2px 6px;cursor:pointer}
.qi b{color:var(--tx)}.qi .cur-ico{width:15px;height:15px;margin-right:4px}

/* ---------- aksi cepat & nav bawah (potret) ---------- */
.qa{display:none}
.mnav{display:none}

/* ---------- modal & toast ---------- */
.veil{position:fixed;inset:0;z-index:200;background:rgba(2,3,10,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px}
.veil.on{display:flex}
.mdl{width:100%;max-width:400px;background:rgba(8,10,24,.98);border:1px solid rgba(var(--ac-rgb),.5);border-radius:18px;padding:22px 20px;box-shadow:0 0 40px rgba(var(--ac-rgb),.18),0 20px 60px rgba(0,0,0,.6);animation:pin .24s cubic-bezier(.3,.9,.3,1)}
@keyframes pin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.mdl h2{font-size:17px;margin-bottom:12px}
.mdl .sum{margin-top:0}
.mdl .row{display:flex;gap:8px;margin-top:16px}
.mdl .row button{flex:1;height:44px;border-radius:11px;font-weight:700;border:1px solid var(--line);background:var(--panel-2)}
.mdl .row button.pri{background:linear-gradient(180deg,rgba(var(--ac-rgb),.5),rgba(var(--ac-rgb),.28));border-color:var(--line-hi);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));transform:translateX(-50%);z-index:400;max-width:min(440px,calc(100vw - 28px));padding:11px 20px;border-radius:12px;font-size:13px;text-align:center;background:rgba(5,7,18,.97);border:1px solid rgba(var(--ac-rgb),.65);box-shadow:0 0 22px rgba(var(--ac-rgb),.25),0 10px 30px rgba(0,0,0,.5);animation:tin 3s forwards;pointer-events:none}
.toast.up{border-color:rgba(var(--up-rgb),.7)}.toast.dn{border-color:rgba(var(--dn-rgb),.7)}
@keyframes tin{0%{opacity:0;transform:translate(-50%,16px)}10%,86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#boot{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--tx-2);font-size:13px;letter-spacing:.06em;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
#boot .sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(var(--ac-rgb),.2);border-top-color:var(--ac);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- responsif ---------- */

<script>
/* =====================================================================
   BAGIAN 1 — AKUN, MORA & CREDIT  (sistem yang sama dengan Popit.html)
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbwHtatQVaip_YspROYu7Rmtm1xWG_f69yBHoahG7DoPElB08sMmKgSCXgdgF7X9_14/exec";
const SECRET  = "popit_secret_2026";
/* API ke-2: spreadsheet khusus Forex (grafik & riwayat). Tempel URL /exec dari deploy AppsScript-Forex.gs di sini. */
const FOREX_API_URL = "https://script.google.com/macros/s/AKfycbyS-fh49G7lo7D_pwK-HzgwQH9ziVvMK7eBADYJJdLBJkGuHtialFdOC5LMYHmIZrW7zw/exec";
let currentUser = null;

async function apiCall(action, data = {}) {
  const ac = new AbortController(), tm = setTimeout(()=>ac.abort(), 15000);
  try {
    const res = await fetch(API_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action, secret: SECRET, ...data }), signal: ac.signal });
    return await res.json();
  } catch (err) { console.error("API Error:", err); return { success:false, message:"Gagal terhubung ke server" }; }
  finally { clearTimeout(tm); }
}
async function loadSession() {
  const session = localStorage.getItem("popit_session");
  if (!session) return false;
  try {
    const { username } = JSON.parse(session);
    const res = await apiCall("getUser", { username });
    if (res.success) { currentUser = res.user; return true; }
  } catch (e) {}
  return false;
}
async function updateUser(updates) {
  if (!currentUser) return { success:false };
  const res = await apiCall("updateUser", { username: currentUser.username, updates });
  if (res && res.success && res.user) {
    const m = currentUser.mora, c = currentUser.credit;       // saldo lokal (optimistis) jangan tertimpa respons lama
    currentUser = res.user;
    if (!("mora" in updates)) currentUser.mora = m;
    if (!("credit" in updates)) currentUser.credit = c;
  }
  return res;
}
function updateCurrencyDisplay() {
  if (!currentUser) return;
  document.querySelectorAll(".mora-count").forEach(el => el.textContent = fmtN(currentUser.mora || 0));
  document.querySelectorAll(".credit-count").forEach(el => el.textContent = fmtN(currentUser.credit || 0));
}
async function requireLogin() {
  const ok = await loadSession();
  if (!ok) { window.location.href = "login.html"; return false; }
  walletInit(); updateCurrencyDisplay();
  return true;
}

/* Logo mata uang — sama seperti Popit.html (kalau gagal dimuat, otomatis pakai SVG bawaan) */
const SVG_MORA="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#e7b64a" stroke="#fff3c4" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="none" stroke="#a8781c" stroke-width="3"/><path d="M22 41V24l10 10 10-10v17" fill="none" stroke="#7a520e" stroke-width="4" stroke-linejoin="round"/></svg>');
const SVG_CREDIT="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#1c8f9c" stroke="#b8fff8" stroke-width="3"/><path d="M32 12l14 20-14 20-14-20z" fill="#5afff0" stroke="#e6fffd" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 12v40M18 32h28" stroke="#1c8f9c" stroke-width="2" opacity=".6"/></svg>');
const CREDIT_LOGO = "https://static.wikia.nocookie.net/houkai-star-rail/images/d/d9/Item_Credit.png/revision/latest?cb=20230722075044";
const MORA_LOGO = "https://media.printables.com/media/prints/274692/images/2440991_fbc314d8-5e72-465c-b7f6-13397d418cc8/thumbs/inside/1280x960/png/icon_mora_274692.webp";
const ci = t => `<img class="cur-ico" src="${t==="mora"?MORA_LOGO:CREDIT_LOGO}" alt="${t}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${t==="mora"?SVG_MORA:SVG_CREDIT}'">`;
const CUR_NAME = { mora:"Mora", credit:"Credit" };

/* Saldo: perubahan langsung terlihat di layar (instan), lalu disinkronkan ke server di latar belakang.
   Kalau sinkronisasi gagal, selisihnya disimpan di perangkat & dicoba lagi otomatis (tidak hilang). */
const WAL = { base:{ mora:0, credit:0 }, busy:false, timer:0, fails:0 };
const PW_KEY = "forex.pendingWallet";
const walDiff = () => ({ mora:Math.round((currentUser.mora||0)-WAL.base.mora), credit:Math.round((currentUser.credit||0)-WAL.base.credit) });
function walPersist(extra){
  if (!currentUser) return;
  const d = walDiff();
  if (!d.mora && !d.credit && !(extra && extra.tgt)){ try{ localStorage.removeItem(PW_KEY); }catch(e){} return; }
  LS.set(PW_KEY, { u:currentUser.username, d, ...(extra||{}) });
}
function walletInit(){
  WAL.base = { mora:currentUser.mora||0, credit:currentUser.credit||0 };
  const pw = LS.get(PW_KEY, null);
  if (pw && pw.u === currentUser.username && pw.d){
    const landed = pw.tgt && pw.d0 && currentUser.mora===pw.tgt.mora && currentUser.credit===pw.tgt.credit;
    const rem = landed ? { mora:pw.d.mora-pw.d0.mora, credit:pw.d.credit-pw.d0.credit } : pw.d;
    currentUser.mora = Math.max(0, Math.round((currentUser.mora||0)+(rem.mora||0)));
    currentUser.credit = Math.max(0, Math.round((currentUser.credit||0)+(rem.credit||0)));
  }
  walPersist();
  const d = walDiff(); if (d.mora || d.credit) scheduleFlush(400);
}
function walletTry(delta){
  if (!currentUser) return { ok:false, msg:"Belum login" };
  for (const k in delta){ if ((currentUser[k]||0)+delta[k] < 0) return { ok:false, msg:"Saldo "+CUR_NAME[k]+" tidak cukup" }; }
  for (const k in delta) currentUser[k] = Math.round((currentUser[k]||0)+delta[k]);
  updateCurrencyDisplay(); walPersist(); scheduleFlush(350);
  return { ok:true };
}
function scheduleFlush(ms){ clearTimeout(WAL.timer); WAL.timer = setTimeout(flushWallet, ms); }
async function flushWallet(){
  if (WAL.busy || !currentUser) return;
  const d0 = walDiff(); if (!d0.mora && !d0.credit) return;
  WAL.busy = true;
  try{
    const g = await apiCall("getUser", { username:currentUser.username });
    if (!g || !g.success || !g.user) throw new Error("get");
    const tgt = { mora:Math.max(0,Math.round((g.user.mora||0)+d0.mora)), credit:Math.max(0,Math.round((g.user.credit||0)+d0.credit)) };
    walPersist({ d0, tgt });
    const r = await apiCall("updateUser", { username:currentUser.username, updates:tgt });
    if (!r || !r.success) throw new Error("upd");
    const extra = { mora:(currentUser.mora||0)-WAL.base.mora-d0.mora, credit:(currentUser.credit||0)-WAL.base.credit-d0.credit };
    WAL.base = { mora:tgt.mora, credit:tgt.credit };
    currentUser = Object.assign({}, r.user || currentUser, { mora:tgt.mora+extra.mora, credit:tgt.credit+extra.credit });
    WAL.fails = 0; walPersist(); updateCurrencyDisplay();
  }catch(e){
    WAL.fails++; scheduleFlush(Math.min(30000, 1500*Math.pow(2,Math.min(WAL.fails,5))));
    if (WAL.fails === 3) toast("Server lambat — saldo disinkronkan otomatis nanti","dn");
  }
  WAL.busy = false;
  const d = walDiff(); if ((d.mora || d.credit) && WAL.fails === 0) scheduleFlush(200);
}

/* =====================================================================
/* =====================================================================
   BAGIAN 2 — UTILITAS
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmtN = n => Math.round(n).toLocaleString("id-ID");
const fmtS = (n, d=2) => (n>=0?"+":"−") + Math.abs(n).toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d});
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const avatar = (n,p) => p || "https://api.dicebear.com/9.x/initials/svg?seed=" + encodeURIComponent(n||"?");
function rnd(){ try{ const a=new Uint32Array(2); crypto.getRandomValues(a); return (a[0]*2097152+(a[1]>>>11))/9007199254740992; }catch(e){ return Math.random(); } }
function randn(){ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }
function toast(msg, cls){ const el=document.createElement("div"); el.className="toast "+(cls||""); el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),3000); }
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
async function getJSON(url, ms=8000){
  const ac = new AbortController(), t = setTimeout(()=>ac.abort(), ms);
  try{ const r = await fetch(url,{signal:ac.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
const dayKey = () => new Date().toISOString().slice(0,10);
function setHtml(el,h){ if(el && el._h!==h){ el._h=h; el.innerHTML=h; } }

/* =====================================================================
   BAGIAN 3 — DAFTAR PASAR
   Forex   : kurs referensi ECB (Frankfurter) + simulasi tick tak terduga
   Kripto  : harga langsung Binance (WebSocket)
   Emas    : XAU/USD lewat PAXG (token emas) langsung Binance
   ===================================================================== */
const TFS = { "5s":5, "15s":15, "1m":60, "5m":300 };
const TF_LIST = ["5s","15s","1m","5m","1D"];
const INST = [];
function fx(s,l,n,g,a,b,dp,vol,spr){ INST.push({s,l,n,g,a,b,dp,vol,spr,live:false,maxLev:100}); }
function cx(s,l,n,bin,dp,vol,spr,fb,g="crypto",maxLev=25){ INST.push({s,l,n,g,bin,dp,vol,spr,fb,live:true,maxLev}); }
fx("EURUSD","EUR/USD","Euro / Dolar AS","major","EUR","USD",5,.075,.7);
fx("GBPUSD","GBP/USD","Pound Inggris / Dolar AS","major","GBP","USD",5,.085,.9);
fx("USDJPY","USD/JPY","Dolar AS / Yen Jepang","major","USD","JPY",3,.095,.9);
fx("USDCHF","USD/CHF","Dolar AS / Franc Swiss","major","USD","CHF",5,.08,1.1);

const BASE_RATES = { EUR:.92,GBP:.78,JPY:150,CHF:.88,AUD:1.53,CAD:1.37,NZD:1.65,IDR:16200,SGD:1.34,CNY:7.2,INR:84,MYR:4.45,THB:34,KRW:1380 };

/* harga simulasi selalu pakai kurs dasar tetap → grafik identik di semua perangkat */
const simRef = I => { const r=c=>c==="USD"?1:(BASE_RATES[c]||RATES[c]); return r(I.b)/r(I.a); };
const rateOf = c => c==="USD" ? 1 : RATES[c];
const refOf = I => I.live ? (Q[I.s].ref || I.fb) : rateOf(I.b) / rateOf(I.a);
const P = (s,v) => Number(v).toFixed(BY[s].dp);

/* ---------- MESIN HARGA DETERMINISTIK ----------
   Harga forex = fungsi dari (simbol, waktu). Tidak ada angka acak baru tiap muat ulang:
   kapan pun & di perangkat mana pun kamu buka, grafik untuk jam yang sama SELALU identik.
   Cara kerja: tiap hari UTC punya "jangkar" harga di 00:00 (acak berbenih), lalu jalur
   5-detik dibangun dengan seed tetap dan dijembatani ke jangkar hari berikutnya. */
const SIM_SPEED = 20, NODE = 5, NPD = 17280, YR = 31557600;
const HB = {}, ECBH = { done:false, ok:false };
function hash32(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } h^=h>>>13; h=Math.imul(h,0x85ebca6b)>>>0; h^=h>>>16; return h>>>0; }
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function gauss(g){ let u=g(); if(u<1e-12) u=1e-12; return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307179586*g()); }
function mix(a,b){ let h=(a^Math.imul(b|0,0x9E3779B1))>>>0; h=Math.imul(h^(h>>>16),0x85ebca6b)>>>0; h=Math.imul(h^(h>>>13),0xc2b2ae35)>>>0; h^=h>>>16; return (h>>>0)/4294967296; }
function anchorX(I,d){ const g=mulberry32(hash32(I.s+"|x|"+d)); g(); return gauss(g)*I.vol*.1414; }
function anchorLv(I,d){ const g=mulberry32(hash32(I.s+"|l|"+d)); g(); return clamp(gauss(g)*.25,-.9,1.3); }
function dayBlock(I,d,nocache){
  let b=I.blk[d]; if(b) return b;
  const g=mulberry32(hash32(I.s+"|d|"+d)); g();
  const X0=anchorX(I,d), X1=anchorX(I,d+1);
  const dtm=NODE*SIM_SPEED, y=dtm/YR, a=clamp(dtm/21600,0,1), sq=Math.sqrt(y), sa=.5*Math.sqrt(a);
  const spP=dtm/28800, spS=I.vol/Math.sqrt(252)*.55;
  const x=new Float64Array(NPD+1), lv=new Float32Array(NPD+1);
  let w=X0, l=anchorLv(I,d); x[0]=w; lv[0]=l;
  for(let i=1;i<=NPD;i++){
    l+=-l*a+sa*gauss(g); l=clamp(l,-.9,1.3);
    w+=I.vol*Math.exp(l)*sq*gauss(g);
    if(g()<spP){ w+=gauss(g)*spS; l=clamp(l+.6,-.9,1.3); }
    x[i]=w; lv[i]=l;
  }
  const corr=X1-w; for(let i=1;i<=NPD;i++) x[i]+=corr*i/NPD;   // jembatan ke jangkar besok → kontinu antar hari
  b={ x, lv };
  if(!nocache){ I.blk[d]=b; const today=Math.floor(Date.now()/864e5); for(const k in I.blk) if(+k<today-3) delete I.blk[k]; }
  return b;
}
function xAtT(I,t,nocache){
  const d=Math.floor(t/86400);
  if(I._d!==d || !I._b){ I._b=dayBlock(I,d,nocache); I._d=d; }
  const b=I._b, pos=(t-d*86400)/NODE; let i=Math.floor(pos); if(i>=NPD) i=NPD-1;
  I._lv=b.lv[i];
  return b.x[i]+(b.x[i+1]-b.x[i])*(pos-i);
}
const xSec = (I,s) => xAtT(I,s) + (mix(I.seed,s)-.5)*3.4641*I.mic*Math.exp(I._lv);
const simBase = q => q.ref*Math.exp(-q.x0);
function simOpen(I,q){ const d=Math.floor(Date.now()/864e5); q.openDay=d; return simBase(q)*Math.exp(xAtT(I,d*86400)); }
function simStep(I,q,t,silent,noCandle){
  const sc=Math.floor(t), base=simBase(q);
  const a=base*Math.exp(xSec(I,sc)); q.lv=I._lv;
  const b=base*Math.exp(xSec(I,sc+1));
  setQuote(I,q,a+(b-a)*(t-sc),t,silent,noCandle);
}
function sparkOf(I,q){
  if (I.live && isLive(I,q)) return q.spark;
  const now=Math.floor(Date.now()/1000), base=simBase(q), out=[];
  for(let k=39;k>=0;k--) out.push(base*Math.exp(xSec(I,now-k*3)));
  return out;
}

function initQuote(I){
  C[I.s] = { "5s":[], "15s":[], "1m":[], "5m":[], "1D":[] };
  I.seed = hash32("forex|"+I.s); I.blk = {}; I._d = null; I._b = null; I._lv = 0;
  I.mic = I.vol*Math.sqrt(NODE*SIM_SPEED/YR)*.3;
  const q = Q[I.s] = { mid:0, bid:0, ask:0, ref:0, x0:0, lv:0, open:0, openDay:-1, spark:[], liveAt:0, lb:0, la:0, lastSpark:0, dir:0, t:0, half:0 };
  q.ref = (I.live ? I.fb : simRef(I)) * (I.mult || 1);
  simStep(I,q,Date.now()/1000,true,true);
  q.open = simOpen(I,q);
}
function setQuote(I,q,mid,ts,silent,noCandle){
  const old = q.mid;
  q.mid = mid;
  const volMult = Math.exp(q.lv||0);
  const bps = I.spr * (.85 + .35*Math.min(volMult,3));
  let half = mid * bps / 2e4;
  if (I.live && q.lb && q.la && q.liveAt) half = Math.max(half, (q.la-q.lb)/2);
  q.half = half; q.bid = mid-half; q.ask = mid+half;
  if (!silent){ q.dir = mid>old ? 1 : mid<old ? -1 : q.dir; if(!noCandle) pushTick(I,q,ts); }
}
function pushPx(I,m,ts){
  const CS = C[I.s];
  for (const tf in TFS){
    const w = TFS[tf], b = Math.floor(ts/w)*w, a = CS[tf], l = a[a.length-1];
    if (l && l[0]===b){ if(m>l[2]) l[2]=m; if(m<l[3]) l[3]=m; l[4]=m; }
    else if (!l || b>l[0]){ const o = l?l[4]:m; a.push([b, o, Math.max(o,m), Math.min(o,m), m]); if (a.length>1600) a.splice(0,a.length-1500); }
  }
  const d = CS["1D"], dl = d[d.length-1];
  if (dl){ dl[4]=m; if(m>dl[2]) dl[2]=m; if(m<dl[3]) dl[3]=m; }
}
function pushTick(I,q,ts){
  pushPx(I,q.mid,ts);
  if (ts - q.lastSpark >= 3){ q.lastSpark = ts; q.spark.push(q.mid); if (q.spark.length>40) q.spark.shift(); }
  q.t = ts;
}
/* riwayat candle dibangun ulang dari fungsi harga → persis sama setiap kali */
function simBuild(I){
  const q=Q[I.s], end=Math.floor(Date.now()/1000), base=simBase(q), CS=C[I.s];
  const mk=(w,n)=>{ const out=[]; let cur=null;
    for(let s=Math.floor(end/w)*w-(n-1)*w; s<=end; s++){ const p=base*Math.exp(xSec(I,s)), b=Math.floor(s/w)*w;
      if(cur&&cur[0]===b){ if(p>cur[2])cur[2]=p; if(p<cur[3])cur[3]=p; cur[4]=p; }
      else{ const o=cur?cur[4]:p; cur=[b,o,Math.max(o,p),Math.min(o,p),p]; out.push(cur); } }
    return out; };
  CS["5s"]=mk(5,700); CS["15s"]=mk(15,300); CS["1m"]=mk(60,700); CS["5m"]=mk(300,400);
  const d=CS["1D"], dl=d[d.length-1]; if(dl){ dl[4]=q.mid; if(q.mid>dl[2])dl[2]=q.mid; if(q.mid<dl[3])dl[3]=q.mid; }
  HB[I.s]=end; markDirty();
}
function simSync(I){
  if (I.live && !I.simFallback) return;
  const q=Q[I.s]; if (I.live && isLive(I,q)) return;
  const now=Math.floor(Date.now()/1000), h=HB[I.s];
  if (h==null || now-h>600 || !C[I.s]["1m"].length) return simBuild(I);
  if (now>h){ const base=simBase(q); for(let s=h+1;s<=now;s++) pushPx(I,base*Math.exp(xSec(I,s)),s); HB[I.s]=now; }
}
function simDaily(I,n){
  const q=Q[I.s], base=simBase(q), nowS=Date.now()/1000, today=Math.floor(nowS/86400), out=[];
  for(let d=today-n; d<=today; d++){
    const b=dayBlock(I,d,d<today-3), last=d===today?Math.min(NPD,Math.floor((nowS-today*86400)/NODE)):NPD;
    let h=-Infinity,l=Infinity; for(let i=0;i<=last;i++){ const v=b.x[i]; if(v>h)h=v; if(v<l)l=v; }
    out.push([d*86400, base*Math.exp(b.x[0]), base*Math.exp(h), base*Math.exp(l), base*Math.exp(b.x[last])]);
  }
  return out;
}

const BIN_REST = ["https://data-api.binance.vision","https://api.binance.com"];
const BIN_WS = ["wss://data-stream.binance.vision","wss://stream.binance.com:9443"];
async function binJSON(path){

}
async function loadBinance24h(){

    });
    return true;
  }catch(e){ return false; }
}
function conv(rows){ return rows.map(k=>[Math.floor(k[0]/1000),+k[1],+k[2],+k[3],+k[4]]); }
const klDone = {};
async function loadKlines(sym){
  const I = BY[sym]; if (!I.live || klDone[sym]) return; klDone[sym] = 1;
  const jobs = [["1s",1000,"5s"],["1m",500,"1m"],["5m",300,"5m"],["1d",120,"1D"]];
  await Promise.all(jobs.map(async ([iv,lim,tf])=>{
    try{
      const rows = conv(await binJSON("/api/v3/klines?symbol="+I.bin+"&interval="+iv+"&limit="+lim));
      if (iv==="1s"){ C[sym]["5s"] = aggregate(rows,5); C[sym]["15s"] = aggregate(rows,15); }
      else C[sym][tf] = rows;
      if (iv==="1d"){ const o=rows[rows.length-1]; if(o) Q[sym].open = o[1]; }
    }catch(e){}
  }));
  if (!C[sym]["1m"].length){ I.simFallback=true; simBuild(I); setTimeout(()=>{ klDone[sym]=0; },20000); } else I.simFallback=false;
  if (S.sym===sym) markDirty();
}
function aggregate(rows,w){
  const out=[]; let cur=null;
  for (const r of rows){ const b=Math.floor(r[0]/w)*w;
    if (cur&&cur[0]===b){ cur[2]=Math.max(cur[2],r[2]); cur[3]=Math.min(cur[3],r[3]); cur[4]=r[4]; }
    else { cur=[b,r[1],r[2],r[3],r[4]]; out.push(cur); } }
  return out;
}
let ws=null, wsTry=0, wsIdx=0;
function connectWS(){
  const streams = INST.filter(i=>i.live).map(i=>i.bin.toLowerCase()+"@bookTicker").join("/");
  try{ ws = new WebSocket(BIN_WS[wsIdx%BIN_WS.length]+"/stream?streams="+streams); }catch(e){ return retryWS(); }
  ws.onopen = () => { wsTry = 0; };
  ws.onmessage = ev => {
    try{
      const d = JSON.parse(ev.data).data; if (!d||!d.s) return;
      const I = INST.find(i=>i.bin===d.s); if (!I) return;
      const q = Q[I.s]; q.lb=+d.b; q.la=+d.a; q.liveAt=Date.now();
    }catch(e){}
  };
  ws.onclose = ws.onerror = () => { try{ ws.close(); }catch(e){} retryWS(); };
}
function retryWS(){ if (retryWS.t) return; wsIdx++; wsTry++; retryWS.t=setTimeout(()=>{ retryWS.t=0; connectWS(); }, Math.min(15000, 1000*wsTry)); }
const isLive = (I,q) => I.live && q.liveAt && Date.now()-q.liveAt < 8000;
function liveLoop(){
  const now=Date.now()/1000;
  for (const I of INST){ if(!I.live) continue; const q=Q[I.s];
    if (isLive(I,q) && q.lb>0 && q.la>0){
      const m=(q.lb+q.la)/2;
      if (m!==q.mid || now-q.t>1){ q.ref=m; q.x0=xAtT(I,now); q.lv = clamp(q.lv*.98,-.9,1.3); setQuote(I,q,m,now); }
    }
  }
}

function ensureHistory(sym){
  const I=BY[sym];
  if (I.live){ loadKlines(sym); if (I.simFallback) simSync(I); }
  else { simSync(I); if (ECBH.done && !ECBH.ok && C[sym]["1D"].length<5) C[sym]["1D"] = simDaily(I,40); }
}

/* ---------- detak pasar: harga = f(waktu sekarang) ---------- */
let lastMk = 0;
function marketTick(t){
  if (SYNC.ready && !SYNC.busy && lastMk && t-lastMk>3 && POS.length) scanSim(lastMk,t);    // kejar TP/SL/likuidasi saat tab tidak aktif
  lastMk = t;
  for (const I of INST){
    const q=Q[I.s]; if (I.live && isLive(I,q)) continue;
    if (!I.live && q.openDay!==Math.floor(t/86400)) q.open = simOpen(I,q);
    simStep(I,q,t,false,(!I.live || I.simFallback));
  }
}
function scanSim(fromSec,toSec){
  let n=0;
  for (const p of POS.slice()){
    const I=BY[p.sym]; if (I.live) continue;
    const base=simBase(Q[p.sym]), from=Math.max(p.t0/1000, fromSec, toSec-3*86400);
    let hit=null;
    for (let t=Math.ceil(from/NODE)*NODE; t<=toSec; t+=NODE){
      const mid=base*Math.exp(xAtT(I,t)), half=mid*I.spr*(.85+.35*Math.min(Math.exp(I._lv),3))/2e4;
      const r=trigger(p,{ bid:mid-half, ask:mid+half }); if (r){ hit={ r, t }; break; }
    }
    if (hit){ n++; const px = hit.r==="tp"?p.tp : hit.r==="sl"?p.sl : liqPrice(p.side,p.entry,p.lev); closePosition(p,hit.r,{ px, t:hit.t*1000, batch:true }); }
  }
  if (n){ finishClose(); toast(n+" posisi ditutup otomatis (TP/SL/likuidasi)","dn"); }
}

  const pin=$("wlPin"); pin.classList.toggle("act",!!SET.wl); pin.title=SET.wl?"Lepas dari samping":"Sematkan di samping";
  saveSet(); resizeCanvas();
}
$("symh").addEventListener("click",e=>{ if(!e.target.closest("#wlTg")) return; if(SET.wl){ SET.wl=false; applyWl(); } else $("app").classList.toggle("wl-pop"); });
$("wlPin").onclick=()=>{ SET.wl=!SET.wl; applyWl(); };
document.addEventListener("pointerdown",e=>{ const a=$("app"); if(a.classList.contains("wl-pop") && !e.target.closest("#wl,#wlTg")) a.classList.remove("wl-pop"); },true);
$("srchBtn").onclick=()=>setSearch($("srchBox").hidden);
$("srchX").onclick=()=>setSearch(false);
$("wlist").addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");
  if(f){ e.stopPropagation(); const s=f.dataset.f, i=SET.fav.indexOf(s); i>=0?SET.fav.splice(i,1):SET.fav.push(s); saveSet(); renderWatch(); }
});
$("wlist").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ const r=e.target.closest(".wr[data-s]"); if(r){ e.preventDefault(); r.click(); } } });
$("tfs").innerHTML=TF_LIST.map(t=>`<button data-tf="${t}">${t}</button>`).join("");
function syncToolbar(){
  document.querySelectorAll("#tfs [data-tf]").forEach(b=>b.classList.toggle("on",b.dataset.tf===SET.tf));
  document.querySelectorAll("#ctype [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===SET.ctype));
  document.querySelectorAll("#inds [data-i]").forEach(b=>b.classList.toggle("on",!!SET[b.dataset.i]));
}
$("tfs").addEventListener("click",e=>{ const b=e.target.closest("[data-tf]"); if(!b) return; SET.tf=b.dataset.tf; view.off=0; saveState(false); syncToolbar(); markDirty(); });
$("ctype").addEventListener("click",e=>{ const b=e.target.closest("[data-t]"); if(!b) return; SET.ctype=b.dataset.t; saveState(false); syncToolbar(); markDirty(); });
$("inds").addEventListener("click",e=>{ const b=e.target.closest("[data-i]"); if(!b) return; SET[b.dataset.i]=!SET[b.dataset.i]; saveState(false); syncToolbar(); markDirty(); });
$("tk").addEventListener("click",e=>{
  const T=e.target.closest("[data-cur],[data-lev],[data-pc],[data-st]"); if(!T) return;
  if(T.dataset.cur){ SET.cur=T.dataset.cur; saveSet(); document.querySelectorAll("#tk [data-cur]").forEach(b=>b.classList.toggle("on",b.dataset.cur===SET.cur)); }
  else if(T.dataset.lev){ S.lev=+T.dataset.lev; saveSet(); document.querySelectorAll("#tk [data-lev]").forEach(b=>b.classList.toggle("on",+b.dataset.lev===S.lev)); }
  else if(T.dataset.pc){ const bal=currentUser?(currentUser[SET.cur]||0):0; S.stake=String(Math.floor(bal*(+T.dataset.pc)/100)||""); $("fStake").value=S.stake; saveSet(); }
  else if(T.dataset.st){ const cur=Math.floor(Number(S.stake)||0), step=Math.max(1,Math.pow(10,Math.max(0,String(cur).length-2))); S.stake=String(Math.max(0,cur+(+T.dataset.st)*step)); $("fStake").value=S.stake; saveSet(); }
  updateTicket(); updateQuick();
});
$("tk").addEventListener("change",e=>{ if(e.target.id==="cfm"){ SET.confirm=e.target.checked; saveSet(); } });
$("tk").addEventListener("input",e=>{
  if(e.target.id==="fStake"){ S.stake=e.target.value.replace(/[^\d]/g,""); if(e.target.value!==S.stake) e.target.value=S.stake; }
  else if(e.target.id==="fTp") S.tp=e.target.value; else if(e.target.id==="fSl") S.sl=e.target.value;
  $("terr").textContent=""; saveSet(); updateQuick(); updateTicket();
});
$("ptabs").addEventListener("click",e=>{ const b=e.target.closest("[data-p]"); if(b){ S.ptab=b.dataset.p; renderPositions(); } });
$("pbody").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed){ editPos(ed.dataset.edit); return; }
  const v=e.target.closest("[data-view-sym]"); if(v){ selectSym(v.dataset.viewSym); if(matchMedia("(max-width:1020px)").matches) setView("chart"); else scrollTo({top:0,behavior:"smooth"}); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
let _zt=0; function zs(){ clearTimeout(_zt); _zt=setTimeout(saveSet,600); }

/* ---------- sentuhan cepat: aksi jalan saat jari menyentuh-lalu-lepas, tanpa menunggu 'click' ---------- */
const FAST='#go,[data-go],[data-side],[data-close],#cclose,#okOrder,#closeAll,.wr[data-s]';
let tapS=null, lastFast=0;
function takeSnap(){ const o={ t:performance.now(), q:{} }; new Set([S.sym,...POS.map(p=>p.sym)]).forEach(k=>{ const q=Q[k]; o.q[k]={ bid:q.bid, ask:q.ask }; }); return o; }
function fastAct(el,snap){
  if(el.id==="go") return confirmOrder(S.side,snap);
  if(el.id==="okOrder"){ const na=$("noAsk"); if(na&&na.checked){ SET.confirm=false; const c=$("cfm"); if(c) c.checked=false; saveSet(); } closeModal(); return executeOrder(pendingSide,snap); }
  if(el.id==="cclose") return closeMany(POS.filter(p=>p.sym===S.sym),snap);
  if(el.id==="closeAll"){ if(confirm("Tutup semua posisi pada harga pasar saat ini?")) closeMany(POS.slice(),snap,"all"); return; }
  if(el.dataset.close){ const p=POS.find(x=>x.id===el.dataset.close); if(p) closePosition(p,"manual",{ snap }); return; }
  if(el.dataset.go) return quickTrade(el.dataset.go,snap);
  if(el.dataset.side){ S.side=el.dataset.side; syncSide(); updateTicket(); return; }
  if(el.classList.contains("wr")){ selectSym(el.dataset.s); if(matchMedia("(max-width:1020px)").matches) setView("chart"); }
}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest&&e.target.closest(FAST);
  if(!el || e.target.closest("[data-f]") || (e.pointerType==="mouse"&&e.button!==0)){ tapS=null; return; }
  tapS={ el, x:e.clientX, y:e.clientY, snap:takeSnap() };
  if(!el.classList.contains("wr")) el.classList.add("pressed");
},true);
document.addEventListener("pointerup",e=>{
  const s=tapS; if(!s) return; tapS=null; s.el.classList.remove("pressed");
  const el=e.target.closest&&e.target.closest(FAST);
  if(el!==s.el || Math.hypot(e.clientX-s.x,e.clientY-s.y)>14) return;
  lastFast=performance.now(); fastAct(s.el,s.snap);
},true);
document.addEventListener("pointercancel",()=>{ if(tapS) tapS.el.classList.remove("pressed"); tapS=null; },true);
document.addEventListener("click",e=>{
  if(e.target.closest("[data-f]")) return;
  const el=e.target.closest&&e.target.closest(FAST); if(!el) return;
  e.preventDefault(); e.stopImmediatePropagation();
  if(performance.now()-lastFast<800) return;                    // sudah dieksekusi lewat pointerup
  fastAct(el,takeSnap());                                       // keyboard (Enter/Spasi)
},true);

let _hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ _hiddenAt=Date.now(); saveState(false); pushState(); return; }
  syncCycle();
  const away=_hiddenAt?(Date.now()-_hiddenAt)/1000:0;
  if(away>15){ for(const k in klDone) delete klDone[k]; ensureHistory(S.sym); }   // tarik ulang data nyata agar tak ada celah
  if(currentUser){ const d=walDiff(); if(d.mora||d.credit) scheduleFlush(200); }
  uiLoop(); markDirty();
});
addEventListener("pagehide",()=>{ saveState(false); walPersist(); });

/* UI tick: 4× per detik */
function uiLoop(){
  liveLoop(); marketTick(Date.now()/1000); checkAll();
  if(document.hidden) return;
  simSync(BY[S.sym]);
  updateWatch(); updateSymHead(); updatePositions(); updateTicket(); markDirty();
}

/* =====================================================================
/* =====================================================================
   BAGIAN 8 — MULAI
   ===================================================================== */
async function init(){
  const ok = await requireLogin(); if (!ok) return;
  loadState();
  await pullState();   // ambil posisi & riwayat terbaru dari spreadsheet Forex
  await loadPriceConfig();   // pengali harga dari sheet "Harga" (harus sebelum initQuote)
  INST.forEach(initQuote);
  const av=$("wlAv"); if (av) av.src=avatar(currentUser.username,currentUser.profilePic);
  syncToolbar(); applyWl(); renderWatch(); renderSymHead(); renderTicket(true); renderPositions(); updateQuick(); resizeCanvas();
  ensureHistory(S.sym);
  if(SYNC.ready)scanSim(0, Date.now()/1000); lastMk = Date.now()/1000;       // posisi yang kena TP/SL/likuidasi selama kamu pergi
  requestAnimationFrame(frame);
  setInterval(uiLoop,250);
  if(SYNC.dirty)pushState();
  setInterval(syncCycle,10000);
  Promise.all([loadECB(), loadBinance24h()]).then(()=>{ if(!SRC.ecb) ECBH.done=true; ensureHistory(S.sym); updateWatch(); renderSymHead(); });
  connectWS();
  setInterval(()=>{ loadECB(); }, 30*60*1000);
  $("boot").classList.add("off"); setTimeout(()=>$("boot").remove(),500);
  if (POS.length) toast("Memulihkan "+POS.length+" posisi terbuka");
}
init().catch(e=>{
  console.error(e);
  const b=document.querySelector("#boot span");
  if(b) b.textContent="Gagal memuat: "+(e&&e.message||e)+" — muat ulang halaman";
});
</script>
