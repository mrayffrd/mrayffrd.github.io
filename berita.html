<!DOCTYPE html>
<html lang="id" data-theme="light" data-w="std">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="dns-prefetch" href="https://drive.google.com">
<meta name="description" content="Portal berita yang bisa dibaca oleh siapa saja.">
<title>Berita</title>
<style>
/* ============ WARNA & UKURAN (UBAH DI SINI) ============ */
:root{
  --fs:16px;--maxw:1280px;
  --serif:"Linux Libertine","Georgia","Times",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#fff;--fg:#202122;--link:#36c;--visit:#795cb2;--red:#d73333;--muted:#54595d;
  --line:#c8ccd1;--box:#f5faff;--boxline:#a9c5e0;--bh:linear-gradient(to right,#cfe3f7,rgba(207,227,247,0) 85%);
  --hover:#eaf3ff;--inp:#fff;--inpline:#a2a9b1;--btn:#f8f9fa;--chipon:#36c;--chipfg:#fff;
}
html[data-theme="dark"]{
  --bg:#101418;--fg:#eaecf0;--link:#88a3e8;--visit:#a98cdf;--red:#ff4242;--muted:#a2a9b1;
  --line:#54595d;--box:#101418;--boxline:#54595d;--bh:none;
  --hover:#1b2533;--inp:#101418;--inpline:#72777d;--btn:#1b1f23;--chipon:#88a3e8;--chipfg:#101418;
}
html[data-w="lebar"]{--maxw:none}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.6 var(--sans);overflow-wrap:break-word}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit}
.muted{color:var(--muted)}
.lnk{background:none;border:0;color:var(--link);cursor:pointer;padding:0;font-size:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* ---- Header ---- */
#top{background:var(--bg);z-index:40;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:14px;max-width:var(--maxw);margin:0 auto;padding:10px 16px}
.ib{width:44px;height:44px;border:0;background:none;color:var(--fg);border-radius:6px;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.ib:hover{background:var(--hover)}
.ib.lk{display:flex;align-items:center;gap:6px;width:auto;padding:0 10px;color:var(--link)}
.lbl{display:none;font-size:.95rem}
.brand{display:flex;align-items:center;gap:8px;color:var(--fg)!important;text-decoration:none!important;flex:none}
.brand img{width:46px;height:46px;object-fit:contain;border-radius:50%}
.wm b{display:block;font:400 1.6rem/1.05 var(--serif);font-variant:small-caps;letter-spacing:.03em}
.wm small{display:block;font:.68rem/1.3 var(--serif);letter-spacing:.09em;color:var(--muted)}
.search{flex:1;max-width:520px;margin:0 auto;display:flex}
.sbx{flex:1;position:relative;min-width:0}
.sbx svg{position:absolute;left:11px;top:11px;color:var(--muted);pointer-events:none}
#q{width:100%;height:40px;padding:0 10px 0 36px;border:1px solid var(--inpline);border-right:0;border-radius:2px 0 0 2px;background:var(--inp);color:var(--fg);font-size:max(16px,1rem);font-family:inherit;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--muted)}
.search>button{height:40px;padding:0 14px;border:1px solid var(--inpline);border-radius:0 2px 2px 0;background:var(--btn);color:var(--fg);font-weight:700;cursor:pointer}
#sug{position:absolute;left:0;right:-1px;top:100%;background:var(--bg);border:1px solid var(--inpline);z-index:80;box-shadow:0 10px 26px rgba(0,0,0,.25);max-height:60vh;overflow:auto}
#sug[hidden]{display:none}
#sug a{display:flex;gap:10px;align-items:center;padding:9px 12px;color:var(--fg);text-decoration:none;min-height:52px;border-bottom:1px solid var(--line)}
#sug a:hover{background:var(--hover)}
#sug img{width:48px;height:36px;object-fit:cover;flex:none;border:1px solid var(--line)}
#sug b{display:block;font-size:.95rem;line-height:1.3}#sug small{color:var(--muted)}
#sug .none{padding:12px;color:var(--muted)}
.links{display:flex;gap:2px;margin-left:auto;align-items:center}

/* ---- Halaman ---- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin:8px 0 14px;font-size:.88rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs div{display:flex;gap:2px;white-space:nowrap}
.tabs a{display:block;padding:11px 9px 9px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--link)}
.tabs a.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr)}

/* ---- Selamat datang ---- */
.welcome{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;border:1px solid var(--boxline);background:var(--box);padding:12px 18px 14px;margin-bottom:14px}
.wl{flex:1 1 380px;text-align:center}
.wl h1{margin:0;font:400 2rem/1.3 var(--sans)}
.wl h1 a{color:var(--visit)}
.wl p{margin:.3em 0}
.portals a{display:inline-block;padding:3px 2px}
.portals .semua{font-weight:700}
.wr{flex:0 1 300px;text-align:right;font-size:.95rem}

/* ---- Kotak ---- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{border:1px solid var(--boxline);background:var(--box);border-radius:2px;min-width:0}
.bh{display:flex;align-items:center;gap:10px;margin:0;padding:4px 12px 4px 4px;font:700 1.08rem/1.3 var(--sans);background:var(--bh)}
.bh .ico{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:1.25rem;flex:none}
.bb{padding:10px 16px 14px}
.bb::after{content:"";display:block;clear:both}
.bb p{margin:.4em 0 .7em}
.pic{float:left;width:min(42%,180px);margin:4px 14px 8px 0;border:1px solid var(--line);padding:3px;background:var(--bg)}
.pic img{display:block;width:100%;height:auto;max-height:220px;object-fit:cover}
.prevn{font-size:.85rem;color:var(--muted)}
.bl{margin:0;padding-left:1.25em}.bl li{margin:.55em 0;line-height:1.4}
.bl small{display:block;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gal a{display:block;text-decoration:none}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--line);background:var(--hover)}
.gal span{display:block;font-size:.82rem;line-height:1.3;margin-top:4px}

/* ---- Semua berita ---- */
#semua{margin-top:14px;scroll-margin-top:10px}
.ctl{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--boxline)}
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;flex:1;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border:1px solid var(--inpline);border-radius:99px;background:var(--btn);color:var(--fg);font-size:.92rem;cursor:pointer;scroll-snap-align:start;white-space:nowrap}
.chip small{color:var(--muted)}
.chip.on{background:var(--chipon);border-color:var(--chipon);color:var(--chipfg)}
.chip.on small{color:inherit;opacity:.85}
.info{padding:10px 16px;border-bottom:1px solid var(--boxline);font-size:.92rem}
.grp{margin:0;padding:7px 16px;font:700 .85rem var(--sans);color:var(--muted);background:var(--hover);border-bottom:1px solid var(--boxline)}
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--boxline);color:var(--fg)!important;text-decoration:none!important;min-height:64px}
.row:hover{background:var(--hover)}
.row img{width:96px;height:72px;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--hover)}
.row div{min-width:0}
.row b{display:block;color:var(--link);font-size:1.03rem;line-height:1.3}
.row small{color:var(--muted)}
.row p{margin:.2em 0 0;font-size:.9rem;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{padding:14px;text-align:center}

/* ---- Artikel ---- */
.art h1{font:400 1.95rem/1.25 var(--serif);margin:0 0 .2em;border-bottom:1px solid var(--line);padding-bottom:.2em}
.sub{font-size:.85rem;color:var(--muted);margin:.4em 0 .8em}
.tgl{display:inline-block;background:var(--hover);padding:2px 12px;border-radius:99px;font-size:.82rem}
.fig{margin:.9em 0 1em;border:1px solid var(--line);background:var(--box);padding:4px}
.fig img{display:block;width:100%;height:auto}
.vid{display:block;clear:both;width:100%;max-width:100%;aspect-ratio:16/9;border:0;background:#000;margin:.8em 0}
.txt{font-size:1.04rem;line-height:1.75}.txt p{margin:.5em 0 1em}
.prev{display:flex;gap:14px;clear:both;border:1px solid var(--boxline);background:var(--box);color:var(--fg)!important;text-decoration:none!important;margin:18px 0;overflow:hidden}
.prev:hover{background:var(--hover)}
.prev img{width:140px;object-fit:cover;flex:none}
.prev div{padding:12px 14px;font-size:.88rem;color:var(--muted)}
.prev b{display:block;margin-bottom:4px;color:var(--link);font-size:1rem}
.prev small{color:var(--link)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;clear:both;margin:22px 0 10px}
.pn a{display:block;padding:12px 14px;min-height:56px;border:1px solid var(--boxline);background:var(--box);border-radius:2px;color:var(--fg)}
.pn a:hover{background:var(--hover);text-decoration:none}
.pn small{display:block;color:var(--muted);font-size:.78rem}
.pn b{color:var(--link);font-size:.95rem;line-height:1.3;display:block}
.pn .n{text-align:right}
.foot{border-top:1px solid var(--line);margin-top:24px;padding-top:12px;color:var(--muted);font-size:.82rem}

/* ---- Panel Tampilan ---- */
.panel{display:none;position:fixed;z-index:70;right:16px;top:70px;width:250px;background:var(--bg);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.3);padding:12px 16px 14px;border-radius:6px;font-size:.92rem}
.panel.open{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph b{font-size:1rem}
.pill{background:var(--btn);border:0;color:var(--fg);padding:6px 10px;border-radius:2px;font-size:.8rem;cursor:pointer}
.panel h4{margin:14px 0 2px;font-weight:400;font-size:.92rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 2px;cursor:pointer;min-height:40px}
.opt input{width:18px;height:18px;margin:0;accent-color:var(--chipon)}

/* ---- Menu samping, scrim, toast ---- */
#drawer{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s;z-index:70;padding:12px 8px;overflow:auto;visibility:hidden}
#drawer.open{transform:none;visibility:visible}
#drawer h2{margin:6px 12px 8px;font:700 .95rem var(--sans);color:var(--muted)}
#drawer a{display:flex;align-items:center;gap:12px;padding:13px 12px;color:var(--fg);border-radius:8px;font-size:1rem}
#drawer a:hover{background:var(--hover);text-decoration:none}
#drawer hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:65}
#scrim.show{opacity:1;pointer-events:auto}
#note{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#202122;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
#note.show{opacity:1;transform:translate(-50%,0)}
.totop{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:1px solid var(--inpline);background:var(--btn);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:none;z-index:50;place-items:center}
.totop.show{display:grid}

/* ---- Layar lebar: panel Tampilan disematkan di kanan ---- */
@media(min-width:900px){.lbl{display:inline}.ib.lk svg{display:none}}
@media(min-width:1100px){
  body.pin .layout{grid-template-columns:minmax(0,1fr) 230px;gap:24px}
  body.pin .panel{display:block;position:sticky;top:12px;right:auto;width:auto;box-shadow:none;border:0;border-radius:0;padding:0;align-self:start;background:none}
}

/* ---- HP / layar sempit ---- */
@media(max-width:900px){
  #top{position:sticky;top:0;transition:transform .22s;border-bottom:1px solid var(--line)}
  #top.hide{transform:translateY(-100%)}
}
@media(max-width:760px){
  .bar{flex-wrap:wrap;gap:4px 6px;padding:6px 8px 8px}
  .brand{margin-right:auto}
  .brand img{width:40px;height:40px}
  .wm b{font-size:1.4rem}
  .links{margin-left:0}
  .ib.lk{color:var(--fg)}
  .search{order:5;flex:1 1 100%;max-width:none;margin:0}
  .wrap{padding:0 10px 40px}
  .cols{display:flex;flex-direction:column}
  .col{display:contents}
  .b-pil{order:1}.b-new{order:2}.b-gal{order:3}.b-vid{order:4}
  .wl h1{font-size:1.6rem}
  .wr{text-align:center;flex-basis:100%}
  .pic{float:none;width:100%;margin:0 0 10px}
  .pic img{max-height:240px}
  .gal{grid-template-columns:repeat(2,1fr)}
  .row img{width:84px;height:64px}
  .art h1{font-size:1.65rem}
  .prev{flex-direction:column}.prev img{width:100%;height:160px}
  .pn{grid-template-columns:1fr}
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
}
@media(min-width:800px){.fig{float:right;width:340px;margin:.4em 0 1em 1.4em}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ============ TAMPILAN LANJUTAN ============ */
#main>.box,#main>.cols,#main>.hero,#main>.welcome{margin-bottom:16px}
.cols .box{margin:0}
.cols.one{grid-template-columns:1fr}
#semua{margin-top:0}
.box{border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden}
html[data-theme="dark"] .box{box-shadow:none}
.welcome{border-radius:10px;background:linear-gradient(135deg,var(--box),var(--bg))}
.bh{padding:10px 16px;border-bottom:1px solid var(--boxline)}
.bh .ico{box-shadow:0 1px 3px rgba(0,0,0,.14)}
.row img,.gal img{border-radius:6px}
.row:hover b{text-decoration:underline}
.chip:hover{border-color:var(--link)}

/* hero berita utama */
.hero{position:relative;display:flex;align-items:flex-end;min-height:340px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#1e3a8a,#3366cc 60%,#5b8def);color:#fff!important;text-decoration:none!important;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.hero:hover img{transform:scale(1.04)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.12) 70%)}
.hc{position:relative;z-index:1;padding:24px 26px;max-width:760px}
.hb{display:inline-block;background:#36c;color:#fff;font-size:.78rem;font-weight:700;padding:3px 12px;border-radius:99px;margin-bottom:10px}
.hc h2{margin:0 0 6px;font:400 clamp(1.5rem,3.2vw,2.3rem)/1.2 var(--serif);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hm{font-size:.86rem;opacity:.9}
.hc p{margin:.5em 0 .9em;font-size:.95rem;line-height:1.5;opacity:.95}
.hbtn{display:inline-block;background:#fff;color:#202122;font-weight:700;font-size:.9rem;padding:8px 18px;border-radius:99px}

/* kartu berita terbaru */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:14px 16px 16px}
.card{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:var(--fg)!important;text-decoration:none!important;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.2);border-color:var(--link)}
.card .im{position:relative;aspect-ratio:16/10;background:var(--hover);overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-size:.74rem;padding:2px 9px;border-radius:99px}
.card .ct{padding:10px 13px 13px}
.card b{display:block;line-height:1.3;color:var(--link);margin-bottom:2px}
.card small{color:var(--muted)}
.card p{margin:.35em 0 0;font-size:.88rem;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(min-width:761px) and (max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .hero{min-height:300px}
  .hc{padding:18px 16px}
  .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:12px;scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 78%;scroll-snap-align:start}
}

/* performa: lewati render baris di luar layar, cegah layout bergeser */
.row{content-visibility:auto;contain-intrinsic-size:auto 96px}
.row img{aspect-ratio:4/3}
.hero{min-height:clamp(260px,38vw,340px)}
.cards,.gal{contain:layout}
.card .im{background:linear-gradient(135deg,var(--hover),var(--line))}
.row,.chip,.card,.ib{-webkit-tap-highlight-color:transparent}
@media(max-width:760px){.card{scroll-snap-stop:always}}

/* pop-out berita */
body.lock{overflow:hidden}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(10,14,22,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .18s}
.modal[hidden]{display:none}
.mdl{position:relative;width:min(780px,100%);max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;background:var(--bg);color:var(--fg);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.5);animation:pop .24s cubic-bezier(.2,.9,.3,1.1);overscroll-behavior:contain;outline:0}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes sheet{from{opacity:0;transform:translateY(40%)}}
.mx{position:sticky;top:10px;z-index:3;display:grid;place-items:center;width:42px;height:42px;margin:10px 10px -52px auto;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:1.1rem;cursor:pointer}
.mx:hover{background:rgba(0,0,0,.85)}
.mhero img{display:block;width:100%;max-height:380px;object-fit:cover}
.mpad{padding:18px 24px 24px}
.mdl h1{font:400 1.9rem/1.25 var(--serif);margin:.1em 0 .35em}
.msub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:.9em}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#note{z-index:120}
@media(max-width:700px){
  .modal{padding:0;place-items:end center}
  .mdl{width:100%;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0;animation:sheet .26s ease}
  .mpad{padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  .mdl h1{font-size:1.6rem}
}

/* ============ TEMA BARU: NEVE ============ */
:root{--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:var(--sans);--maxw:1680px;
 --bg:#f3f4fb;--fg:#11132b;--link:#4650e6;--visit:#4650e6;--muted:#646a8d;--line:#e0e3f3;--box:#fff;--boxline:#e3e6f5;--hover:#eef0fc;--inp:#fff;--inpline:#d3d8ee;--btn:#fff;--chipon:#4650e6;--chipfg:#fff;
 --ac1:#6d7bff;--ac2:#b06bff;--sh:0 1px 2px rgba(20,24,70,.05),0 10px 26px -10px rgba(20,24,70,.14)}
html[data-theme="dark"]{--bg:#070914;--fg:#e9ecff;--link:#9aa6ff;--visit:#9aa6ff;--muted:#8d95c3;--line:#1c2142;--box:#0e1122;--boxline:#1d2347;--hover:#151a34;--inp:#0e1122;--inpline:#2a3166;--btn:#121631;--chipon:#8491ff;--chipfg:#080a18;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -12px rgba(0,0,0,.65)}
body{font-family:var(--sans);letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 46% at 10% -6%,rgba(109,123,255,.24),transparent 70%),radial-gradient(44% 38% at 96% 2%,rgba(176,107,255,.18),transparent 70%)}
/* tampilan (setting) disembunyikan */
.tabs,.panel,#panel{display:none!important}
.layout,body.pin .layout{grid-template-columns:minmax(0,1fr)!important;gap:0!important}
/* header */
#top{position:sticky;top:0;background:var(--bg);background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line)}
.brand img{width:40px;height:40px;border-radius:12px;object-fit:contain}
.wm b{font:800 1.5rem/1 var(--sans);font-variant:normal;letter-spacing:-.045em;text-transform:lowercase;background:linear-gradient(90deg,var(--link),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wm small{font:700 .6rem/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase}
#q{border-radius:99px 0 0 99px;background:var(--box);border-color:var(--boxline);padding-left:38px}
.search>button{border-radius:0 99px 99px 0;background:var(--chipon);border-color:var(--chipon);color:var(--chipfg);padding:0 18px}
.ib{border-radius:12px}
.wrap{padding-top:4px}
/* masthead */
.mast{padding:34px 0 28px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 .7rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--link);background:rgba(109,123,255,.13);padding:8px 13px;border-radius:99px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(109,123,255,.7)}70%,100%{box-shadow:0 0 0 9px rgba(109,123,255,0)}}
.mast h1{margin:16px 0 12px;font:800 clamp(2.1rem,5.6vw,3.8rem)/1.04 var(--sans);letter-spacing:-.04em}
.mast h1 em{font-style:normal;background:linear-gradient(90deg,var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mast p{margin:0;color:var(--muted);font-size:1.05rem;max-width:46ch}
.stat{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.stat a{display:inline-flex;gap:6px;align-items:baseline;padding:9px 16px;border-radius:99px;background:var(--box);border:1px solid var(--boxline);color:var(--muted);font-size:.9rem;text-decoration:none!important;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.stat a b{color:var(--fg);font-weight:800}
.stat a:hover{transform:translateY(-2px);border-color:var(--link)}
/* hero + sedang hangat */
.top{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:18px;margin-bottom:38px}
.top .hero{min-height:clamp(380px,46vw,500px);height:100%;border-radius:26px;background:linear-gradient(135deg,#312e81,#6d28d9 55%,#c026d3);box-shadow:var(--sh)}
.hero::after{background:linear-gradient(to top,rgba(5,7,20,.93),rgba(5,7,20,.3) 62%,rgba(5,7,20,.04))}
.hc{padding:30px 32px}
.hb{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);color:#fff;font:700 .72rem/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;margin-bottom:14px}
.hb i{width:7px;height:7px;border-radius:50%;background:#ffd166}
.hc h2{font:800 clamp(1.6rem,3.4vw,2.6rem)/1.1 var(--sans);letter-spacing:-.03em;margin-bottom:8px}
.hbtn{background:#fff;color:#11132b;font-weight:800;padding:11px 22px}
.hbtn::after{content:" →"}
.hot{display:flex;flex-direction:column;background:var(--box);border:1px solid var(--boxline);border-radius:26px;padding:20px 16px 8px;box-shadow:var(--sh)}
.hot h2{margin:0 6px 8px;font:800 1.1rem var(--sans);letter-spacing:-.02em}
.hi{display:flex;align-items:center;gap:12px;padding:12px 6px;flex:1;border-top:1px solid var(--line);color:var(--fg)!important;text-decoration:none!important}
.hi .no{flex:none;width:28px;font:800 2rem/1 var(--sans);background:linear-gradient(var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hi .ht{flex:1;min-width:0}
.hi b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:.95rem;line-height:1.3;font-weight:700}
.hi small{color:var(--muted);font-size:.78rem}
.hi img{flex:none;width:68px;height:68px;border-radius:16px;object-fit:cover;background:var(--hover)}
.hi:hover b{color:var(--link)}
/* judul bagian */
.box,html[data-theme="dark"] .box{background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible}
.bh{display:flex;align-items:center;gap:12px;padding:0 2px 14px;border:0;background:none;font:800 1.4rem/1.2 var(--sans);letter-spacing:-.025em}
.bh::before{content:"";width:6px;height:1.15em;border-radius:4px;background:linear-gradient(var(--ac1),var(--ac2))}
.bb{padding:0}
#main>.box,#main>.cols{margin-bottom:40px}
.cols{gap:30px 22px}
.cards{padding:0 0 4px;gap:18px}
.card{background:var(--box);border-color:var(--boxline);border-radius:22px;box-shadow:var(--sh)}
.card:hover{transform:translateY(-4px)}
.card b{color:var(--fg);font-weight:700;font-size:1.02rem}
.card:hover b{color:var(--link)}
.card .tag{background:rgba(10,12,30,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gal{gap:14px}
.gal a{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.gal img{border:0;border-radius:0;transition:transform .5s}
.gal a:hover img{transform:scale(1.07)}
.gal a::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(5,7,20,.88));pointer-events:none}
.gal span{position:absolute;z-index:1;left:0;right:0;bottom:10px;margin:0;padding:0 12px;color:#fff;font-weight:700;font-size:.8rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-vid .bb{background:var(--box);border:1px solid var(--boxline);border-radius:22px;padding:14px 22px 8px;box-shadow:var(--sh)}
.bl li{padding-bottom:.4em;border-bottom:1px solid var(--line)}.bl li:last-child{border:0}
.bl a{color:var(--fg);font-weight:700}.bl a:hover{color:var(--link)}
/* semua berita */
#semua{background:var(--box);border:1px solid var(--boxline);border-radius:26px;padding:22px 10px 10px;box-shadow:var(--sh)}
#semua .bh{padding:0 12px 12px}
.ctl{border:0;padding:2px 12px 12px}
.info{border:0;padding:4px 16px 10px}
.chip{border-radius:99px;font-weight:600}
.chip.on{box-shadow:0 6px 16px -6px var(--chipon)}
.grp{background:none;border:0;padding:18px 16px 6px;font:800 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase}
.row{margin:2px 4px;padding:12px;gap:16px;border:0;border-radius:18px;transition:background .15s}
.row img{width:128px;height:88px;border:0;border-radius:14px}
.row b{color:var(--fg);font-weight:700}
.row:hover b{color:var(--link);text-decoration:none}
.more{padding:14px 14px 18px}
/* modal & artikel */
.mdl{border-radius:26px}
.mdl h1,.art h1{font:800 clamp(1.5rem,3.4vw,2.1rem)/1.15 var(--sans);letter-spacing:-.03em;border:0}
.tgl{background:rgba(109,123,255,.14);color:var(--link);font-weight:700}
.prev,.pn a{border-radius:16px}
.foot{text-align:center;border:0}
@media(max-width:900px){.top{grid-template-columns:1fr}.hot .hi{flex:none}.row img{width:112px;height:80px}}
@media(max-width:760px){
  .mast{padding:22px 0 20px}
  .top{margin-bottom:30px}
  .top .hero{min-height:360px;border-radius:22px}
  .hc{padding:20px 18px}
  .cards{padding:2px 2px 12px}
  .card{border-radius:20px}
  .row img{width:88px;height:68px}
  .row{padding:10px 6px;margin:0}
  #semua{padding:18px 4px 6px;border-radius:22px}
  .mdl{border-radius:22px 22px 0 0}
}
/* desktop: konten lebih mepet ke kiri-kanan layar */
@media(min-width:900px){.bar,.wrap{padding-left:clamp(16px,2vw,32px);padding-right:clamp(16px,2vw,32px)}}
/* header: hanya logo besar */
.brand img{width:auto;height:56px;max-width:min(240px,60vw);border-radius:0;object-fit:contain}
.mast{padding:26px 0 22px}
.mast h1{margin:0;font:800 clamp(2rem,5vw,3rem)/1.1 var(--sans);letter-spacing:-.035em}
@media(max-width:760px){.brand img{height:46px}.mast{padding:16px 0 16px}}
@media(prefers-reduced-motion:reduce){.eyebrow i{animation:none}}
</style>
</head>
<body class="pin">
<header id="top">
  <div class="bar">
    <button class="ib" data-act="menu" aria-label="Menu utama" title="Menu utama"><svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M1 3h18v2H1zm0 6h18v2H1zm0 6h18v2H1z"/></svg></button>
    <a class="brand" href="#/"><img id="logo" src="logo.png" alt="Beranda"></a>
    <div class="links">
    </div>
    <form id="sf" class="search" role="search">
      <div class="sbx">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M12.2 13.6a7 7 0 1 1 1.4-1.4l5.4 5.4-1.4 1.4zM3 8a5 5 0 1 0 10 0A5 5 0 0 0 3 8z"/></svg>
        <input id="q" type="search" placeholder="Telusuri berita" aria-label="Telusuri berita" autocomplete="off" enterkeyhint="search">
        <div id="sug" hidden></div>
      </div>
      <button type="submit">Cari</button>
    </form>
  </div>
</header>

<div id="scrim" data-act="scrim"></div>
<nav id="drawer" aria-label="Menu utama">
  <h2>Menu utama</h2>
  <a href="#/">Halaman Utama</a>
  <a href="#/" data-f="all">Berita terbaru</a>
  <a href="#/" data-f="foto">Berita bergambar</a>
  <a href="#/" data-f="video">Berita bervideo</a>
  <a href="#/" data-f="link">Berita bertautan</a>
  <hr>
  <a href="#/" data-act="random">Berita acak</a>
</nav>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="layout">
    <main id="main"></main>
    <aside class="panel" id="panel" aria-label="Tampilan">
      <div class="ph"><b>Tampilan</b><button class="pill" data-act="hide" type="button">sembunyikan</button></div>
      <h4>Teks</h4>
      <label class="opt"><input type="radio" name="teks" value="kecil"> Kecil</label>
      <label class="opt"><input type="radio" name="teks" value="std"> Standar</label>
      <label class="opt"><input type="radio" name="teks" value="besar"> Besar</label>
      <h4>Lebar</h4>
      <label class="opt"><input type="radio" name="lebar" value="std"> Standar</label>
      <label class="opt"><input type="radio" name="lebar" value="lebar"> Lebar</label>
      <h4>Warna</h4>
      <label class="opt"><input type="radio" name="warna" value="auto"> Otomatis</label>
      <label class="opt"><input type="radio" name="warna" value="terang"> Terang</label>
      <label class="opt"><input type="radio" name="warna" value="gelap"> Gelap</label>
    </aside>
  </div>
  <div class="foot" id="foot"></div>
</div>
<button class="totop" data-act="top" aria-label="Ke atas"><svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M10 4 3 11l1.4 1.4L9 7.8V17h2V7.8l4.6 4.6L17 11z"/></svg></button>
<div id="modal" class="modal" data-act="closem" hidden>
  <div class="mdl" role="dialog" aria-modal="true" aria-label="Berita" tabindex="-1">
    <button class="mx" data-act="closem" type="button" aria-label="Tutup">&#10005;</button>
    <div id="mbody"></div>
  </div>
</div>
<div id="note" role="status"></div>

<script>
/* ============ KONFIGURASI ============ */
// 1) URL Web App Google Apps Script yang berisi daftar berita.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymMQiiQiZrnnhyxA03mP5_9IlwZAq5wNsDbU7rXQgZbOK9EF78XiTqQ_TjB8-DqAL4/exec";
// 2) Logo di pojok kiri atas (file logo.png di folder yang sama)
const LOGO = "logo.png";
// 3) Nama situs, tagline, dan kalimat sambutan di Halaman Utama
const SITUS = {nama:"Berita", tagline:""};
const BERANDA = {sub:"portal berita yang bisa dibaca oleh siapa saja"};
// 4) Refresh otomatis data (ms). 0 = mati
const REFRESH_MS = 60000;
// 5) Jumlah berita yang ditampilkan per "halaman" di daftar Semua berita
const PER_HALAMAN = 30;

/* ============ KODE PROGRAM ============ */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root=document.documentElement,qi=$("#q");
$("#logo").src=LOGO;
history.scrollRestoration="manual";

const svgIcon=(e,c)=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='${c}'/></svg>`);
const COL=["#2563eb","#dc2626","#059669","#d97706","#7c3aed"];
const driveId=u=>(u.match(/[-\w]{25,}/)||[])[0];
function imgUrl(u,w){if(!u)return"";if(/drive\.google\.com/.test(u)){const id=driveId(u);if(id)return`https://drive.google.com/thumbnail?id=${id}&sz=w${w||1200}`}return u}
const thumb=n=>n.foto?imgUrl(n.foto,400):(n.icon?imgUrl(n.icon,300):svgIcon("",COL[n.i%5]));
function videoHtml(u){
  if(!u)return"";
  const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  if(m)return`<iframe class="vid" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`;
  if(/drive\.google\.com/.test(u)&&driveId(u))return`<iframe class="vid" src="https://drive.google.com/file/d/${driveId(u)}/preview" allowfullscreen loading="lazy"></iframe>`;
  return`<video class="vid" src="${esc(u)}" controls playsinline></video>`;
}
function previewHtml(n){
  if(!n.link)return"";
  const p=n.preview||{};
  return`<a class="prev" href="${esc(n.link)}" target="_blank" rel="noopener">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:""}<div><b>${esc(p.title||n.link)}</b>${esc(p.description||"")}<br><small>${esc(p.site||n.link)}</small></div></a>`;
}
const lk=t=>t.replace(/(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const ex=(n,l)=>{const s=String(n.artikel||"").replace(/\s+/g," ").trim();return esc(s.length>l?s.slice(0,l).replace(/\s+\S*$/,"")+"…":s)};
function fmt(n){
  if(n.t===null)return n.tanggal||"";
  const only=/^\d{4}-\d{2}-\d{2}$/.test(String(n.tanggal));
  return new Date(n.t).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric",timeZone:only?"UTC":undefined});
}
function mkey(n){
  if(n.t===null)return"Tanpa tanggal";
  const only=/^\d{4}-\d{2}-\d{2}$/.test(String(n.tanggal));
  return new Date(n.t).toLocaleDateString("id-ID",{month:"long",year:"numeric",timeZone:only?"UTC":undefined});
}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)}

/* ---- data ---- */
let DATA=[],ready=false,sig="",view="home",homeY=0,pend=false,updated=null;
const F={f:"all",q:"",asc:false,lim:PER_HALAMAN};
function prep(list){
  const seen={};
  const a=list.map((n,i)=>{
    const t=Date.parse(n.tanggal);
    let id=hash(String(n.judul)+"|"+String(n.tanggal));
    if(seen[id]){seen[id]++;id+="-"+seen[id]}else seen[id]=1;
    return Object.assign({},n,{id,i,t:isNaN(t)?null:t,hay:(String(n.judul)+" "+String(n.artikel||"")+" "+String(n.tanggal||"")).toLowerCase()});
  });
  a.sort((x,y)=>{
    if(x.t===null&&y.t===null)return y.i-x.i;
    if(x.t===null)return 1;if(y.t===null)return -1;
    return y.t-x.t||y.i-x.i;
  });
  return a;
}
function filtered(){
  let r=DATA.filter(n=>F.f==="all"||(F.f==="foto"&&n.foto)||(F.f==="video"&&n.video)||(F.f==="link"&&n.link));
  const tk=F.q.toLowerCase().split(/\s+/).filter(Boolean);
  if(tk.length)r=r.filter(n=>tk.every(k=>n.hay.includes(k)));
  return F.asc?r.slice().reverse():r;
}

/* ---- tampilan: teks, lebar, warna ---- */
const DEFS={teks:"std",lebar:"std",warna:"auto",pin:true};
let S=Object.assign({},DEFS);
try{
  const sv=localStorage.getItem("berita.tampilan");
  if(sv)S=Object.assign(S,JSON.parse(sv));
}catch(e){}
/* setting Tampilan disembunyikan: selalu otomatis (ikut tema perangkat) */
S.warna="auto";S.teks="std";S.lebar="std";S.pin=false;
const saveS=()=>{try{localStorage.setItem("berita.tampilan",JSON.stringify(S))}catch(e){}};
const mq=matchMedia("(prefers-color-scheme: dark)");
const wide=()=>matchMedia("(min-width:1100px)").matches;
function applyLook(){
  const dark=S.warna==="gelap"||(S.warna==="auto"&&mq.matches);
  root.dataset.theme=dark?"dark":"light";
  root.style.colorScheme=dark?"dark":"light";
  root.style.setProperty("--fs",{kecil:"14.5px",std:"16px",besar:"18.5px"}[S.teks]||"16px");
  root.dataset.w=S.lebar;
  document.body.classList.toggle("pin",!!S.pin);
  document.querySelector('meta[name="theme-color"]').content=dark?"#101418":"#ffffff";
  document.querySelectorAll("#panel input").forEach(i=>{i.checked=S[i.name]===i.value});
}
mq.addEventListener&&mq.addEventListener("change",applyLook);
$("#panel").addEventListener("change",e=>{const i=e.target;if(i.name){S[i.name]=i.value;saveS();applyLook()}});
function togglePanel(){
  if(wide()){S.pin=!S.pin;saveS();applyLook()}
  else{const o=$("#panel").classList.toggle("open");$("#drawer").classList.remove("open");$("#scrim").classList.toggle("show",o)}
}
function hidePanel(){if(wide()){S.pin=false;saveS();applyLook()}else closeAll()}
function closeAll(){$("#drawer").classList.remove("open");$("#panel").classList.remove("open");$("#scrim").classList.remove("show");hideSug()}
function openDrawer(){$("#panel").classList.remove("open");$("#drawer").classList.add("open");$("#scrim").classList.add("show")}

let _nt;function note(m){const n=$("#note");n.textContent=m;n.classList.add("show");clearTimeout(_nt);_nt=setTimeout(()=>n.classList.remove("show"),2400)}

/* ---- potongan HTML ---- */
const box=(ico,title,inner,cls,id)=>`<section class="box ${cls||""}"${id?` id="${id}"`:""}><h2 class="bh">${title}</h2>${inner}</section>`;
const aN=n=>`<a href="#/b/${n.id}">${esc(n.judul)}</a>`;
function setTabs(){
  $("#tabs").innerHTML="";
}
function rowHtml(n){
  return`<a class="row" href="#/b/${n.id}"><img loading="lazy" decoding="async" src="${esc(thumb(n))}" alt=""><div><b>${esc(n.judul)}</b><small>${esc(fmt(n))}${n.video?" · Video":""}${n.link?" · Tautan":""}</small><p>${ex(n,160)}</p></div></a>`;
}
function cardHtml(n){
  return`<a class="card" href="#/b/${n.id}"><div class="im"><img loading="lazy" decoding="async" src="${esc(thumb(n))}" alt="">${n.video?`<span class="tag">Video</span>`:""}</div><div class="ct"><b>${esc(n.judul)}</b><small>${esc(fmt(n))}</small><p>${ex(n,110)}</p></div></a>`;
}

/* ---- Halaman Utama ---- */
function homeHtml(){
  const L=DATA,n=L.length,nv=L.filter(x=>x.video).length,nf=L.filter(x=>x.foto).length;
  const num=x=>x.toLocaleString("id-ID");
  const sub=String(BERANDA.sub||"");
  let h=`<section class="mast"><h1>${esc(SITUS.nama)}</h1></section>`;
  if(!n)return h+box("","Berita","<div class='bb'>Belum ada berita.</div>");
  const f=L[0],hot=L.slice(1,4);
  const hero=`<a class="hero" href="#/b/${f.id}">${f.foto?`<img src="${esc(imgUrl(f.foto,1200))}" alt="" fetchpriority="high" decoding="async">`:""}<div class="hc"><span class="hb"><i></i>Berita pilihan</span><h2>${esc(f.judul)}</h2><div class="hm">${esc(fmt(f))}${f.video?" · Video":""}</div><p>${ex(f,200)}</p><span class="hbtn">Baca berita</span></div></a>`;
  const side=hot.length?`<aside class="hot"><h2>Sedang hangat</h2>${hot.map((x,i)=>`<a class="hi" href="#/b/${x.id}"><span class="no">${i+1}</span><span class="ht"><b>${esc(x.judul)}</b><small>${esc(fmt(x))}${x.video?" · Video":""}</small></span><img loading="lazy" decoding="async" src="${esc(thumb(x))}" alt=""></a>`).join("")}</aside>`:"";
  h+=`<div class="top">${hero}${side}</div>`;
  const rest=L.slice(4,10);
  if(rest.length)h+=box("","Berita terbaru",`<div class="cards">${rest.map(cardHtml).join("")}</div>`,"b-new");
  const bx=[];
  const fo=L.filter(x=>x.foto).slice(0,6);
  if(fo.length)bx.push(box("","Berita bergambar",`<div class="bb"><div class="gal">${fo.map(x=>`<a href="#/b/${x.id}"><img loading="lazy" decoding="async" src="${esc(imgUrl(x.foto,400))}" alt=""><span>${esc(x.judul)}</span></a>`).join("")}</div></div>`,"b-gal"));
  const vi=L.filter(x=>x.video).slice(0,6);
  if(vi.length)bx.push(box("","Berita bervideo",`<div class="bb"><ul class="bl">${vi.map(x=>`<li>${aN(x)}<small>${esc(fmt(x))}</small></li>`).join("")}</ul><p><a href="#/" data-f="video"><b>Semua yang bervideo →</b></a></p></div>`,"b-vid"));
  if(bx.length)h+=`<div class="cols${bx.length===1?" one":""}">${bx.join("")}</div>`;
  h+=box("","Semua berita",`<div id="semuaBody"></div>`,"","semua");
  return h;
}
function renderList(){
  const el=$("#semuaBody");if(!el)return;
  const r=filtered();
  const cnt={all:DATA.length,foto:DATA.filter(x=>x.foto).length,video:DATA.filter(x=>x.video).length,link:DATA.filter(x=>x.link).length};
  let h=`<div class="ctl"><div class="chips">${[["all","Semua"],["foto","Bergambar"],["video","Bervideo"],["link","Bertautan"]].map(([f,t])=>`<button type="button" class="chip${F.f===f?" on":""}" data-f="${f}">${t} <small>${cnt[f]}</small></button>`).join("")}</div><button type="button" class="chip" data-act="sort">${F.asc?"Terlama":"Terbaru"}</button></div>`;
  if(F.q)h+=`<div class="info">${r.length} hasil untuk “<b>${esc(F.q)}</b>” · <button type="button" class="lnk" data-act="clearq">Hapus pencarian</button></div>`;
  if(!r.length)h+=`<div class="bb">Tidak ada berita yang cocok.</div>`;
  else{
    let last=null;
    r.slice(0,F.lim).forEach(n=>{const g=mkey(n);if(g!==last){h+=`<h3 class="grp">${esc(g)}</h3>`;last=g}h+=rowHtml(n)});
    if(r.length>F.lim)h+=`<div class="more"><button type="button" class="chip" data-act="more">Tampilkan lebih banyak (${r.length-F.lim})</button></div>`;
  }
  el.innerHTML=h;
}
function showHome(){
  setTabs();
  $("#main").innerHTML=ready?homeHtml():`<div class="box"><div class="bb">Memuat berita…</div></div>`;
  renderList();
}

/* ---- Pop-out berita ---- */
let curId=null,modalOpen=false,homeDrawn=false;
function hideModal(){
  $("#modal").hidden=true;document.body.classList.remove("lock");
  modalOpen=false;curId=null;document.title=SITUS.nama;
}
function closeModalUser(){
  history.replaceState(null,"",location.pathname+location.search+"#/");
  hideModal();
}
function openArt(id){
  const dlg=$(".mdl"),k=DATA.findIndex(x=>x.id===id),n=DATA[k];
  const st=curId===id?dlg.scrollTop:0,was=modalOpen;
  let h;
  if(!ready)h=`<div class="mpad"><p>Memuat berita…</p></div>`;
  else if(!n)h=`<div class="mpad"><h1>Berita tidak ditemukan</h1><p>Mungkin sudah dihapus atau tautannya salah.</p><button class="chip" data-act="closem" type="button">Tutup</button></div>`;
  else{
    const nw=DATA[k-1],ol=DATA[k+1];
    const paras=String(n.artikel||"").split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${lk(esc(p))}</p>`).join("");
    h=`${n.foto?`<a class="mhero" href="${esc(imgUrl(n.foto,1600))}" target="_blank" rel="noopener"><img src="${esc(imgUrl(n.foto,1200))}" alt=""></a>`:""}
    <div class="mpad"><h1>${esc(n.judul)}</h1><div class="msub"><span class="tgl">${esc(fmt(n))}</span></div>
    ${videoHtml(n.video)}<div class="txt">${paras}</div>${previewHtml(n)}
    <nav class="pn" aria-label="Berita lain">${nw?`<a href="#/b/${nw.id}"><small>Lebih baru</small><b>${esc(nw.judul)}</b></a>`:"<span></span>"}${ol?`<a class="n" href="#/b/${ol.id}"><small>Lebih lama</small><b>${esc(ol.judul)}</b></a>`:"<span></span>"}</nav>
    <div class="mact"><button class="chip" data-act="share" type="button">Bagikan</button><button class="chip" data-act="random" type="button">Berita acak</button></div></div>`;
    document.title=n.judul+" – "+SITUS.nama;
  }
  $("#mbody").innerHTML=h;curId=id;modalOpen=true;
  $("#modal").hidden=false;document.body.classList.add("lock");
  dlg.scrollTop=st;if(!was)dlg.focus({preventScroll:true});
}

/* ---- router ---- */
function route(){
  if(!homeDrawn){showHome();homeDrawn=true}
  const m=location.hash.match(/^#\/b\/([^/]+)$/);
  closeAll();
  if(m)openArt(decodeURIComponent(m[1]));else if(modalOpen)hideModal();
}
addEventListener("hashchange",route);

/* ---- muat data ---- */
function apply(list){
  const s=JSON.stringify(list);
  if(ready&&s===sig)return;
  sig=s;ready=true;DATA=prep(list);updated=new Date();
  $("#foot").innerHTML=`${DATA.length} berita · terakhir dimuat ${esc(updated.toLocaleString("id-ID",{dateStyle:"long",timeStyle:"short"}))}`;
  const y=scrollY;showHome();homeDrawn=true;scrollTo(0,y);
  const m=location.hash.match(/^#\/b\/([^/]+)$/);
  if(m)openArt(decodeURIComponent(m[1]));
}
function showErr(e){
  const m=e&&e.name==="AbortError"?"Server terlalu lama merespons.":String((e&&e.message)||e||"Tidak diketahui");
  $("#main").innerHTML=`<section class="mast"><h1 style="font-size:1.8rem">Berita belum bisa dimuat</h1><p>${esc(m)}</p><p style="margin-top:8px;font-size:.92rem">Pastikan Web App Google Apps Script di-deploy dengan akses <b>Anyone</b> dan URL di SCRIPT_URL benar.</p><div class="stat"><a href="#/" data-act="refresh">Coba lagi</a></div></section>`;
}
let loading=false,lastLoad=0,loadStart=0;
const CACHE_KEY="berita.cache";
function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");return Array.isArray(c)?c:null}catch(e){return null}}
function writeCache(l){try{localStorage.setItem(CACHE_KEY,JSON.stringify(l))}catch(e){}}
async function load(manual){
  if(loading&&Date.now()-loadStart<95000)return;
  loading=true;loadStart=Date.now();
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),90000);
  try{
    let list=[];
    if(SCRIPT_URL){const r=await fetch(SCRIPT_URL,{signal:ac.signal});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();list=d.berita||d}
    if(!Array.isArray(list))throw new Error("format data");
    apply(list);writeCache(list);lastLoad=Date.now();
    if(manual)note("Berita disegarkan");
  }catch(e){
    console.error(e);
    if(!ready)showErr(e);
    if(manual||!ready)note(ready&&DATA.length?"Gagal menyegarkan. Menampilkan berita tersimpan.":"Gagal memuat berita. Coba lagi.");
  }finally{clearTimeout(to);loading=false}
}

/* ---- pencarian & saran ---- */
function hideSug(){$("#sug").hidden=true}
function showSug(){
  const t=qi.value.trim().toLowerCase(),s=$("#sug");
  if(!t||!ready){s.hidden=true;return}
  const tk=t.split(/\s+/);
  const r=DATA.filter(n=>tk.every(k=>n.hay.includes(k))).slice(0,6);
  s.innerHTML=r.length?r.map(n=>`<a href="#/b/${n.id}"><img src="${esc(thumb(n))}" alt=""><span><b>${esc(n.judul)}</b><small>${esc(fmt(n))}</small></span></a>`).join(""):`<div class="none">Tidak ada berita yang cocok</div>`;
  s.hidden=false;
}
let tq;
qi.addEventListener("input",()=>{F.q=qi.value.trim();F.lim=PER_HALAMAN;showSug();if(view==="home"){clearTimeout(tq);tq=setTimeout(renderList,160)}});
qi.addEventListener("focus",showSug);
$("#sf").addEventListener("submit",e=>{
  e.preventDefault();F.q=qi.value.trim();F.lim=PER_HALAMAN;hideSug();qi.blur();
  if(view!=="home"){pend=true;location.hash="#/"}
  else{renderList();const s=$("#semua");if(s)s.scrollIntoView({behavior:"smooth"})}
});

/* ---- klik: filter, tombol aksi ---- */
function share(){
  const d=DATA.find(x=>x.id===decodeURIComponent((location.hash.match(/^#\/b\/([^/]+)$/)||[])[1]||""))||null;
  const data={title:d?d.judul:SITUS.nama,url:location.href};
  if(navigator.share)navigator.share(data).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>note("Tautan disalin"),()=>note("Tidak bisa menyalin tautan"));
  else note("Salin tautan dari bilah alamat");
}
document.addEventListener("click",e=>{
  const T=e.target;
  if(!T.closest(".sbx"))hideSug();
  if(T.closest("#sug a"))hideSug();
  const fb=T.closest("[data-f]");
  if(fb){
    e.preventDefault();F.f=fb.dataset.f;F.lim=PER_HALAMAN;
    const inList=!!fb.closest("#semuaBody");closeAll();
    if(view!=="home"){pend=true;location.hash="#/"}
    else{renderList();if(!inList){const s=$("#semua");if(s)s.scrollIntoView({behavior:"smooth"})}}
    return;
  }
  const a=T.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case"sort":F.asc=!F.asc;F.lim=PER_HALAMAN;renderList();break;
    case"more":F.lim+=PER_HALAMAN;renderList();break;
    case"clearq":F.q="";qi.value="";renderList();break;
    case"refresh":e.preventDefault();closeAll();load(true);break;
    case"menu":openDrawer();break;
    case"tampil":e.preventDefault();togglePanel();break;
    case"hide":hidePanel();break;
    case"random":e.preventDefault();closeAll();if(DATA.length)location.hash="#/b/"+DATA[Math.floor(Math.random()*DATA.length)].id;break;
    case"arsip":e.preventDefault();closeAll();if(view!=="home"){pend=true;location.hash="#/"}else{const s=$("#semua");if(s)s.scrollIntoView({behavior:"smooth"})}break;
    case"share":e.preventDefault();share();break;
    case"top":scrollTo({top:0,behavior:"smooth"});break;
    case"scrim":closeAll();break;
    case"closem":if(e.target===a||T.closest(".mx"))closeModalUser();break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(modalOpen)closeModalUser();else closeAll()}});
/* gambar gagal dimuat: ganti placeholder (logo disembunyikan) */
document.addEventListener("error",e=>{
  const t=e.target;if(!t||t.tagName!=="IMG"||t.dataset.x)return;t.dataset.x=1;
  if(t.id==="logo")t.style.display="none";else t.src=svgIcon("","#64748b");
},true);

/* ---- header hilang saat gulir turun, muncul saat gulir naik (HP) ---- */
let ay=0;
addEventListener("scroll",()=>{
  const y=scrollY,top=$("#top");
  if(y<80){top.classList.remove("hide");ay=y}
  else if(y-ay>14){if(document.activeElement!==qi)top.classList.add("hide");ay=y}
  else if(ay-y>14){top.classList.remove("hide");ay=y}
  document.querySelector(".totop").classList.toggle("show",y>700);
},{passive:true});

applyLook();
route();
/* tampilkan berita tersimpan lebih dulu (instan), lalu segarkan dari server */
{const c=readCache();if(c&&c.length)apply(c)}
load();
/* segarkan otomatis hanya saat tab terlihat; hemat baterai & kuota */
if(REFRESH_MS)setInterval(()=>{if(!document.hidden)load()},REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&REFRESH_MS&&Date.now()-lastLoad>REFRESH_MS)load()});
</script>
</body>
</html>
