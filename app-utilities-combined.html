<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Complete</title>
    
    <!-- ===== SEMUA CSS DALAM 1 FILE ===== -->
    <style>
        :root {
            /* WARNA & TEMA */
            --ac-rgb: 148,168,255;
            --ac: rgb(var(--ac-rgb));
            --gold-rgb: 255,220,150;
            --gold: rgb(var(--gold-rgb));
            --credit-rgb: 90,255,240;
            --credit: rgb(var(--credit-rgb));
            --ok-rgb: 87,224,168;
            --bad-rgb: 255,110,120;
            --bg: #03030a;
            --panel: rgba(5,7,18,.86);
            --panel-2: rgba(12,15,36,.78);
            --line: rgba(110,125,215,.32);
            --line-hi: rgba(var(--ac-rgb),.75);
            --tx: #dfe4ff;
            --tx-2: #9aa4d8;
            --tx-3: #6f79b4;
            --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            min-height: 100vh;
            color: var(--tx);
            font-size: 14px;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        img { max-width: 100%; }

        ::selection {
            background: rgba(var(--ac-rgb), .35);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(110, 125, 215, .35);
            border-radius: 9px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ===== BACKGROUND ANIMATION ===== */
        body::before {
            content: "";
            position: fixed;
            inset: -10%;
            z-index: -3;
            pointer-events: none;
            background:
                radial-gradient(38% 34% at 18% 22%, rgba(var(--ac-rgb), .20), transparent 70%),
                radial-gradient(34% 30% at 82% 30%, rgba(160, 90, 255, .13), transparent 70%),
                radial-gradient(46% 38% at 60% 92%, rgba(var(--ac-rgb), .14), transparent 72%);
            animation: nebDrift 46s ease-in-out infinite alternate;
        }

        @keyframes nebDrift {
            from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
            to { transform: translate3d(2%, 1.5%, 0) scale(1.08); }
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(5, 7, 18, .72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--line);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(var(--ac-rgb), .15);
            border: 2px solid var(--line-hi);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 20px;
            color: var(--ac);
        }

        .profile-btn:hover {
            box-shadow: 0 0 20px rgba(var(--ac-rgb), .4);
            transform: scale(1.05);
        }

        .profile-btn img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* ===== NAV TABS ===== */
        .nav-tabs {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .nav-tabs::-webkit-scrollbar {
            height: 6px;
        }

        .nav-tabs::-webkit-scrollbar-thumb {
            background: rgba(110, 125, 215, .35);
            border-radius: 3px;
        }

        .nav-tab {
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(18, 22, 48, .85);
            border: 1px solid rgba(96, 110, 190, .4);
            color: var(--tx-2);
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab:hover {
            color: #fff;
            border-color: var(--line-hi);
            box-shadow: 0 0 14px rgba(var(--ac-rgb), .3);
        }

        .nav-tab.active {
            color: #fff;
            background: rgba(var(--ac-rgb), .25);
            border-color: var(--line-hi);
            box-shadow: 0 0 16px rgba(var(--ac-rgb), .35);
        }

        /* ===== CARD / PANEL ===== */
        .card {
            background: var(--panel);
            border-radius: 16px;
            padding: 22px;
            margin: 16px auto;
            max-width: 520px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--ac), rgba(var(--ac-rgb), .6));
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 0 16px rgba(var(--ac-rgb), .5);
        }

        .btn-success {
            background: rgba(var(--ok-rgb), .15);
            color: var(--ok-rgb);
            border: 1px solid var(--ok-rgb);
        }

        .btn-success:hover {
            background: rgba(var(--ok-rgb), .25);
        }

        .btn-danger {
            background: rgba(var(--bad-rgb), .15);
            color: var(--bad-rgb);
            border: 1px solid var(--bad-rgb);
        }

        .btn-danger:hover {
            background: rgba(var(--bad-rgb), .25);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 11px;
        }

        /* ===== INPUT ===== */
        .input-field {
            background: rgba(18, 22, 48, .85);
            border: 1px solid rgba(96, 110, 190, .4);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--tx);
            font-family: var(--sans);
            font-size: 13px;
            transition: all 0.2s;
            width: 100%;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--line-hi);
            box-shadow: 0 0 12px rgba(var(--ac-rgb), .2);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 80px;
            max-height: 200px;
        }

        /* ===== CURRENCY DISPLAY ===== */
        .currency-display {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .currency-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(var(--ac-rgb), .1);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            font-weight: 600;
            font-size: 13px;
        }

        .currency-item img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel);
            border: 1px solid var(--line-hi);
            border-radius: 16px;
            padding: 24px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }

        .modal-header h2 {
            font-size: 24px;
            color: #fff;
        }

        .modal-close {
            width: 35px;
            height: 35px;
            background: rgba(var(--bad-rgb), .15);
            border: none;
            border-radius: 8px;
            color: var(--bad-rgb);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(var(--bad-rgb), .25);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .85);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 3000;
            animation: fadeInOut 2.2s forwards;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ===== UTILITY CLASSES ===== */
        .text-center { text-align: center; }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .gap-10 { gap: 10px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
            }

            .card {
                margin: 12px;
                padding: 16px;
            }

            .nav-tabs {
                gap: 6px;
                padding: 8px 10px;
            }

            .nav-tab {
                padding: 6px 12px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 16px;
            }

            .currency-display {
                width: 100%;
                gap: 8px;
            }

            .currency-item {
                flex: 1;
                justify-content: center;
                font-size: 12px;
            }

            .modal-content {
                max-width: 95%;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== SEMUA JAVASCRIPT DALAM 1 FILE ===== -->
    <script>
        /* ===== GLOBAL CONFIG ===== */
        const API_CONFIG = {
            SECRET: "popit_secret_2026",
            // GANTI URL INI DENGAN DEPLOYMENT ID ANDA
            API_URL: "https://script.google.com/macros/d/{DEPLOY_ID}/usercurrent/execute"
        };

        /* ===== CURRENCY PRICES (EDIT DI SINI) ===== */
        const PRICES = {
            banner: 5,          // Harga jual 1 banner (Mora)
            petMultiplier: 1    // Harga pet = earnAmount × angka ini
        };

        /* ===== GLOBAL STATE ===== */
        let currentUser = null;
        let autoRefreshInterval = null;

        /* ===== API CALL ===== */
        async function apiCall(action, data = {}) {
            try {
                const response = await fetch(API_CONFIG.API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        secret: API_CONFIG.SECRET,
                        action,
                        ...data
                    })
                });
                return await response.json();
            } catch (err) {
                console.error("API Error:", err);
                return {
                    success: false,
                    message: "Gagal terhubung ke server"
                };
            }
        }

        /* ===== AUTH FUNCTIONS ===== */
        async function login(username, password) {
            const res = await apiCall("login", { username, password });
            if (res.success) {
                currentUser = res.user;
                localStorage.setItem("popit_user", JSON.stringify(currentUser));
                localStorage.setItem("popit_session", JSON.stringify({ username }));
            }
            return res;
        }

        async function register(username, password) {
            const res = await apiCall("register", { username, password });
            if (res.success) {
                currentUser = res.user;
                localStorage.setItem("popit_user", JSON.stringify(currentUser));
                localStorage.setItem("popit_session", JSON.stringify({ username }));
            }
            return res;
        }

        async function loadSession() {
            const session = localStorage.getItem("popit_session");
            if (!session) return false;
            try {
                const { username } = JSON.parse(session);
                const res = await apiCall("getUser", { username });
                if (res.success) {
                    currentUser = res.user;
                    localStorage.setItem("popit_user", JSON.stringify(currentUser));
                    return true;
                }
            } catch (e) {
                console.error("Load session error:", e);
            }
            return false;
        }

        function logout() {
            localStorage.removeItem("popit_session");
            localStorage.removeItem("popit_user");
            currentUser = null;
            window.location.href = "login.html";
        }

        /* ===== USER UPDATE ===== */
        async function updateUser(updates) {
            if (!currentUser) return { success: false };
            const res = await apiCall("updateUser", {
                username: currentUser.username,
                updates
            });
            if (res.success) {
                currentUser = res.user;
                localStorage.setItem("popit_user", JSON.stringify(currentUser));
            }
            return res;
        }

        /* ===== CURRENCY ===== */
        function updateCurrencyDisplay() {
            if (!currentUser) return;
            document.querySelectorAll(".mora-count").forEach(el => {
                el.textContent = (currentUser.mora || 0).toLocaleString();
            });
            document.querySelectorAll(".credit-count").forEach(el => {
                el.textContent = (currentUser.credit || 0).toLocaleString();
            });
        }

        async function addCurrency(type, amount) {
            if (!currentUser) return;
            const updates = {};
            if (type === "mora") updates.mora = (currentUser.mora || 0) + amount;
            if (type === "credit") updates.credit = (currentUser.credit || 0) + amount;
            await updateUser(updates);
            updateCurrencyDisplay();
        }

        /* ===== REDEEM ===== */
        async function redeemCode(code) {
            if (!currentUser) return { success: false, message: "Belum login" };
            const res = await apiCall("redeem", {
                username: currentUser.username,
                code: code.trim().toUpperCase()
            });
            if (res.success) {
                currentUser = res.user;
                localStorage.setItem("popit_user", JSON.stringify(currentUser));
                updateCurrencyDisplay();
            }
            return res;
        }

        /* ===== GACHA ===== */
        async function getGachaConfig(type) {
            return await apiCall("getGacha", { type });
        }

        async function doGacha(type, times = 1) {
            if (!currentUser) return { success: false, message: "Belum login" };
            const res = await apiCall("doGacha", {
                username: currentUser.username,
                type,
                times
            });
            if (res.success) {
                currentUser = res.user;
                localStorage.setItem("popit_user", JSON.stringify(currentUser));
                updateCurrencyDisplay();
            }
            return res;
        }

        /* ===== PET CLAIMING ===== */
        async function claimPetEarnings() {
            if (!currentUser) return;
            const res = await apiCall("claimPets", { username: currentUser.username });
            if (res.success && (res.earnedMora > 0 || res.earnedCredit > 0)) {
                currentUser = res.user;
                localStorage.setItem("popit_user", JSON.stringify(currentUser));
                updateCurrencyDisplay();
                showToast(`🐾 Pet earning: +${res.earnedMora} Mora, +${res.earnedCredit} Credit!`);
            }
        }

        /* ===== CHAT ===== */
        async function getChats() {
            const res = await apiCall("getChats");
            return res.chats || [];
        }

        async function sendChat(message) {
            if (!currentUser || !message.trim()) return;
            return await apiCall("sendChat", {
                username: currentUser.username,
                message: message.trim(),
                profilePic: currentUser.profilePic || ""
            });
        }

        /* ===== FRIENDS ===== */
        async function sendFriendRequest(to) {
            if (!currentUser) return;
            return await apiCall("sendFriendRequest", {
                from: currentUser.username,
                to
            });
        }

        async function getFriends() {
            if (!currentUser) return [];
            const res = await apiCall("getFriends", { username: currentUser.username });
            return res.friends || [];
        }

        async function acceptFriend(friendUsername) {
            if (!currentUser) return;
            return await apiCall("acceptFriend", {
                username: currentUser.username,
                friendUsername
            });
        }

        /* ===== MESSAGE BOX ===== */
        async function getMessageBox() {
            if (!currentUser) return [];
            const res = await apiCall("getMessageBox", { username: currentUser.username });
            return res.messages || [];
        }

        /* ===== SEARCH USERS ===== */
        async function searchUsers(query) {
            const res = await apiCall("searchUsers", { query });
            return res.users || [];
        }

        /* ===== INVENTORY ===== */
        async function getInventoryItems() {
            const res = await apiCall("getInventoryItems");
            return res.items || [];
        }

        /* ===== UI HELPERS ===== */
        function showToast(msg) {
            const el = document.createElement("div");
            el.className = "toast";
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2300);
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.add("active");
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove("active");
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (hours === 0) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            return date.toLocaleDateString();
        }

        /* ===== INIT ===== */
        async function requireLogin() {
            const ok = await loadSession();
            if (!ok) {
                window.location.href = "login.html";
                return false;
            }
            updateCurrencyDisplay();
            setTimeout(claimPetEarnings, 500);
            return true;
        }

        /* ===== AUTO REFRESH (untuk chat, messages, dll) ===== */
        function startAutoRefresh(callback, intervalMs = 3000) {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(callback, intervalMs);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        /* ===== CLEANUP ===== */
        window.addEventListener("beforeunload", () => {
            stopAutoRefresh();
        });

        /* ===== CONSOLE LOG ===== */
        console.log("🎮 App utilities loaded! API_URL:", API_CONFIG.API_URL);
    </script>
</body>
</html>
