<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03030a">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#03030a">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Profile</title>
  <style>
/* =====================================================================
   TEMA BERSAMA — diselaraskan dengan index.html (EMU Joki)
   Ruang gelap #03030a, aksen indigo, font Inter, panel kaca.
   ===================================================================== */
:root{
  color-scheme: dark;
  --ac-rgb: 148,168,255;
  --ac: rgb(var(--ac-rgb));
  --gold-rgb: 255,220,150;
  --gold: rgb(var(--gold-rgb));
  --credit-rgb: 90,255,240;
  --credit: rgb(var(--credit-rgb));
  --ok-rgb: 87,224,168;
  --bad-rgb: 255,110,120;
  --bg: #03030a;
  --panel: rgba(5,7,18,.86);
  --panel-2: rgba(12,15,36,.78);
  --line: rgba(110,125,215,.32);
  --line-hi: rgba(var(--ac-rgb),.75);
  --tx: #dfe4ff;
  --tx-2: #9aa4d8;
  --tx-3: #6f79b4;
  --success: rgb(var(--ok-rgb));
  --danger: rgb(var(--bad-rgb));
  --mono: Consolas, "DejaVu Sans Mono", "Courier New", ui-monospace, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 16px; --r-md: 11px; --r-sm: 8px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  font-family:var(--sans); background:var(--bg); min-height:100vh; color:var(--tx);
  font-size:14px; line-height:1.6; overflow-x:hidden; position:relative;
  -webkit-tap-highlight-color:transparent;
}
img{ max-width:100%; }
::selection{ background:rgba(var(--ac-rgb),.35); color:#fff; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:rgba(110,125,215,.35); border-radius:9px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---------- latar nebula (versi ringan dari index.html) ---------- */
body::before{
  content:""; position:fixed; inset:-10%; z-index:-3; pointer-events:none;
  background:
    radial-gradient(38% 34% at 18% 22%, rgba(var(--ac-rgb),.20), transparent 70%),
    radial-gradient(34% 30% at 82% 30%, rgba(160,90,255,.13), transparent 70%),
    radial-gradient(46% 38% at 60% 92%, rgba(var(--ac-rgb),.14), transparent 72%);
  animation: nebDrift 46s ease-in-out infinite alternate;
}
@keyframes nebDrift{ from{ transform:translate3d(-1.5%,-1%,0) scale(1); } to{ transform:translate3d(2%,1.5%,0) scale(1.08); } }
body::after{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(3,3,10,.78) 100%),
             linear-gradient(180deg, rgba(3,3,10,.55), rgba(3,3,10,.25) 30%, rgba(3,3,10,.6));
}

/* ---------- boot screen ---------- */
#emu-boot{ position:fixed; inset:0; z-index:9000; background:#03030a; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; letter-spacing:3px; font-size:13px; color:#9aa4d8;
  font-family:var(--mono); transition:opacity .45s ease; }
#emu-boot.off{ opacity:0; pointer-events:none; }
#emu-boot b{ font-size:18px; letter-spacing:6px; color:#e6ecff; text-shadow:0 0 22px rgba(var(--ac-rgb),.7); }
#emu-boot i{ display:block; width:150px; height:2px; overflow:hidden; border-radius:2px; background:rgba(120,140,220,.18); }
#emu-boot i::after{ content:""; display:block; width:40%; height:100%; background:linear-gradient(90deg,transparent,var(--ac),transparent); animation:bootbar 1.1s ease-in-out infinite; }
@keyframes bootbar{ from{ transform:translateX(-100%); } to{ transform:translateX(260%); } }

/* ---------- nav (header) ---------- */
.nav{
  display:flex; justify-content:center; flex-wrap:wrap; gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;
  background:rgba(5,7,18,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  position:sticky; top:0; z-index:100; border-bottom:1px solid var(--line);
}
.nav a{
  color:var(--tx-2); text-decoration:none; padding:9px 16px; border-radius:99px;
  background:rgba(18,22,48,.85); border:1px solid rgba(96,110,190,.4);
  font-weight:600; font-size:12px; letter-spacing:1px; transition:background .2s,border-color .2s,box-shadow .2s,transform .2s;
}
.nav a:hover{ color:#fff; border-color:var(--line-hi); box-shadow:0 0 14px rgba(var(--ac-rgb),.3); transform:translateY(-1px); }
.nav a.active{ color:#fff; background:rgba(var(--ac-rgb),.25); border-color:var(--line-hi); box-shadow:0 0 16px rgba(var(--ac-rgb),.35); }

/* ---------- kartu / panel ---------- */
.card{
  background:var(--panel); border-radius:var(--r-lg); padding:22px; margin:16px auto; max-width:520px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line); box-shadow:0 10px 40px rgba(0,0,0,.45);
}
.card h1,.card h2{ text-align:center; margin-bottom:12px; color:#eef1ff; letter-spacing:1px; }

/* ---------- tombol ---------- */
.btn{
  appearance:none; font:inherit; font-size:13px; font-weight:700; letter-spacing:.5px; text-decoration:none;
  color:#dfe4ff; background:rgba(18,22,48,.85); border:1px solid rgba(96,110,190,.5);
  padding:11px 20px; border-radius:var(--r-md); cursor:pointer;
  transition:background .2s,border-color .2s,box-shadow .2s,transform .2s;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  touch-action:manipulation; user-select:none;
}
.btn:hover{ background:rgba(70,90,190,.45); border-color:var(--line-hi); box-shadow:0 0 16px rgba(var(--ac-rgb),.3); transform:translateY(-1px); }
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.btn-gold{ background:linear-gradient(180deg,rgba(var(--gold-rgb),.42),rgba(var(--gold-rgb),.2)); border-color:rgba(var(--gold-rgb),.9); color:#fff8e6; }
.btn-gold:hover{ background:linear-gradient(180deg,rgba(var(--gold-rgb),.6),rgba(var(--gold-rgb),.32)); box-shadow:0 0 18px rgba(var(--gold-rgb),.4); }
.btn-credit{ background:linear-gradient(180deg,rgba(var(--credit-rgb),.42),rgba(var(--credit-rgb),.2)); border-color:rgba(var(--credit-rgb),.9); color:#eafffe; }
.btn-credit:hover{ background:linear-gradient(180deg,rgba(var(--credit-rgb),.6),rgba(var(--credit-rgb),.32)); box-shadow:0 0 18px rgba(var(--credit-rgb),.4); }
.btn-outline{ background:transparent; border:1px solid var(--line-hi); }
.btn-outline:hover{ background:rgba(var(--ac-rgb),.15); }
.btn-sell{ background:rgba(var(--bad-rgb),.18); border-color:rgba(var(--bad-rgb),.7); color:#ffd1d5; padding:5px 10px; font-size:11px; margin-top:6px; }
.btn-sell:hover{ background:rgba(var(--bad-rgb),.32); box-shadow:0 0 14px rgba(var(--bad-rgb),.3); }
.btn-use{ padding:5px 10px; font-size:11px; margin-top:6px; }

/* ---------- mata uang ---------- */
.currency{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; font-size:14px; margin:12px 0; }
.currency span{ background:rgba(9,12,30,.85); border:1px solid rgba(96,110,190,.35); padding:7px 14px; border-radius:99px; display:flex; align-items:center; gap:6px; }
.mora{ color:var(--gold); }
.credit{ color:var(--credit); }

/* ---------- popup / modal ---------- */
.popup-overlay{ position:fixed; inset:0; background:rgba(2,2,8,.74); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:none; justify-content:center; align-items:center; z-index:1000; padding:16px; }
.popup-overlay.show{ display:flex; }
.popup{
  background:rgba(6,8,22,.97); padding:26px 22px; border-radius:18px; width:100%; max-width:380px; text-align:center;
  border:1px solid rgba(var(--ac-rgb),.55); box-shadow:0 0 40px rgba(var(--ac-rgb),.22), 0 20px 60px rgba(0,0,0,.6);
  animation:popIn .28s cubic-bezier(.3,.9,.3,1); position:relative;
}
@keyframes popIn{ from{ transform:translateY(14px) scale(.95); opacity:0; } to{ transform:none; opacity:1; } }
.popup h2{ margin-bottom:16px; color:#eef1ff; letter-spacing:1px; }
.popup input{
  width:100%; padding:11px 14px; border-radius:var(--r-md); border:1px solid rgba(96,110,190,.4);
  background:rgba(9,12,30,.92); color:var(--tx); font-size:15px; margin-bottom:14px; outline:none; transition:.2s;
}
.popup input:focus{ border-color:var(--line-hi); box-shadow:0 0 0 3px rgba(var(--ac-rgb),.18); }
.popup .close-btn{ position:absolute; top:12px; right:16px; background:none; border:none; color:var(--tx-3); font-size:22px; cursor:pointer; }
.popup .close-btn:hover{ color:#fff; }

/* ---------- login ---------- */
.login-box{ max-width:380px; margin:60px auto; text-align:center; }
.login-box input{
  width:100%; padding:12px 14px; margin:8px 0; border-radius:var(--r-md); border:1px solid rgba(96,110,190,.4);
  background:rgba(9,12,30,.92); color:var(--tx); font-size:15px; outline:none; transition:.2s;
}
.login-box input:focus{ border-color:var(--line-hi); box-shadow:0 0 0 3px rgba(var(--ac-rgb),.18); }

/* ---------- grid item ---------- */
.item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; margin-top:14px; }
.item-card{ background:var(--panel-2); border-radius:var(--r-md); padding:12px 8px; text-align:center; border:1px solid rgba(96,110,190,.28); transition:border-color .2s, transform .2s, box-shadow .2s; }
.item-card:hover{ border-color:var(--line-hi); transform:translateY(-3px); box-shadow:0 0 16px rgba(var(--ac-rgb),.2); }
.item-card img{ width:64px; height:64px; object-fit:cover; border-radius:10px; margin-bottom:6px; }
.item-card .name{ font-size:12.5px; font-weight:600; color:#eef1ff; }

/* ---------- gacha ---------- */
.gacha-box{ text-align:center; margin-bottom:24px; }
.gacha-buttons{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
.gacha-box.disabled{ opacity:.55; pointer-events:none; }

/* ---------- profil ---------- */
.profile-header{ text-align:center; position:relative; padding:20px 0; border-radius:var(--r-lg); overflow:hidden; margin-bottom:16px; }
.profile-header .banner-bg{ position:absolute; inset:0; background-size:cover; background-position:center; opacity:.55; z-index:0; }
.profile-header .content{ position:relative; z-index:1; }
.profile-pic-wrap{
  width:100px; height:100px; border-radius:50%; overflow:hidden; margin:0 auto 10px;
  border:2px solid var(--line-hi); background:#0c0f24; flex-shrink:0; box-shadow:0 0 18px rgba(var(--ac-rgb),.3);
}
.profile-pic-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }

/* ---------- padang rumput pet ---------- */
.pet-area{
  position:relative; overflow:hidden; margin-top:12px; height:clamp(380px,112vw,520px);
  border-radius:var(--r-lg); border:1px solid rgba(255,255,255,.18); isolation:isolate;
  background:linear-gradient(180deg,#90d67f 0 30%,#84cf70 30% 62%,#76c862 62% 100%);
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
.pet-area .deco{ position:absolute; pointer-events:none; }
.pet-area .tree{ width:0; height:0; }
.pet-area .tree i{ position:absolute; border-radius:50%; }
.pet-area .tree .tr{ left:-9px; top:0; width:18px; height:var(--th,50px); border-radius:6px; background:#9b6447; }
.pet-area .tree .l1{ background:#57c46a; }
.pet-area .tree .l2{ background:#4db862; }
.pet-area .tree .l3{ background:#3fae59; }
.pet-area .tree .sh{ background:rgba(0,0,0,.09); }
.pet-area .tuft{ width:22px; height:13px; opacity:.85; }
.pet-area .dot{ border-radius:50%; animation:dotTw 3.2s ease-in-out infinite; }
@keyframes dotTw{ 0%,100%{ opacity:.35; transform:scale(.85);} 50%{ opacity:1; transform:scale(1.15);} }
.pet-area .blobL{ right:-14%; bottom:-22%; width:64%; aspect-ratio:1; border-radius:50%; background:rgba(210,245,170,.42); }
.pet-area .blobO{ left:-10%; bottom:-14%; width:38%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,#ecc55a 0 55%,rgba(236,197,90,0) 72%); }
.pet-area .empty{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; width:max-content; max-width:86%;
  background:rgba(255,255,255,.92); color:#2b3a2f; padding:8px 16px; border-radius:99px; font-size:13px; font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.12); text-align:center;
}
.pet{ position:absolute; left:0; top:0; width:0; height:0; will-change:transform; }
.pet-in{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
.pet-sprite{ width:74px; height:74px; display:block; transition:transform .25s; }
.pet-sprite img{ width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; -webkit-user-drag:none; image-rendering:auto; filter:none; border-radius:0; margin:0; }
.pet-sprite.idle{ animation:petBreath 2.6s ease-in-out infinite; transform-origin:50% 100%; }
.pet-sprite.walk{ animation:petWalk .5s ease-in-out infinite; transform-origin:50% 100%; }
.pet-sprite.hop{ animation:petHop .55s ease-out 1; }
.pet.ready .pet-sprite{ animation:petHop 1.1s ease-out infinite; }
@keyframes petBreath{ 0%,100%{ transform:scale(1,1);} 50%{ transform:scale(1.03,.97);} }
@keyframes petWalk{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-6px) rotate(2deg);} }
@keyframes petHop{ 0%{ transform:translateY(0) scale(1,1);} 35%{ transform:translateY(-14px) scale(.97,1.05);} 65%{ transform:translateY(0) scale(1.06,.94);} 100%{ transform:translateY(0) scale(1,1);} }
.pill{
  display:flex; align-items:center; gap:6px; white-space:nowrap; background:rgba(255,255,255,.94); color:#26332b;
  border-radius:99px; padding:3px 10px; font-size:12px; font-weight:700; box-shadow:0 3px 10px rgba(30,70,30,.18);
}
.pill .cur-ico{ width:15px!important; height:15px!important; margin:0!important; }
.pill .pet-timer{ font-size:12px; color:#26332b; margin:0; font-variant-numeric:tabular-nums; }
.pill.tm.ready .pet-timer{ color:#c27a00; font-weight:800; }
.pill.tm.ready{ box-shadow:0 0 0 2px rgba(255,205,80,.9),0 3px 12px rgba(200,140,0,.35); }
.pill.nm{ padding:2px 10px 2px 3px; }
.pill .rb{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:11px; font-weight:800; background:#8a95a5; }
.pill .rb.r3{ background:#1e90d6; } .pill .rb.r4{ background:#8f5be0; } .pill .rb.r5{ background:#e0a020; }
.pill.nm.norb{ padding:2px 10px; }
.pet-menu{
  position:absolute; left:0; top:64px; transform:translateX(-50%); z-index:9999; display:none; min-width:150px;
  background:rgba(255,255,255,.97); color:#26332b; border-radius:14px; padding:9px; text-align:center;
  box-shadow:0 8px 22px rgba(20,60,20,.3); font-size:12px;
}
.pet-menu.up{ top:auto; bottom:64px; }
.pet.open .pet-menu{ display:block; }
.pet-menu .inf{ display:flex; justify-content:center; align-items:center; gap:4px; font-weight:600; margin-bottom:7px; }
.pet-menu .acts{ display:flex; gap:6px; justify-content:center; }
.pet-menu button{ border:0; cursor:pointer; border-radius:99px; padding:5px 12px; font-size:12px; font-weight:700; font-family:inherit; }
.pet-menu .b-claim{ background:#f4b93a; color:#3d2a00; }
.pet-menu .b-sell{ background:#ffdcdc; color:#a3222c; }
@media (prefers-reduced-motion:reduce){ .pet-sprite, .pet-area .dot{ animation:none!important; } }

.chat-box{ height:280px; overflow-y:auto; background:rgba(9,12,30,.7); border-radius:var(--r-lg); padding:12px; margin-bottom:12px; text-align:left; font-size:13px; border:1px solid var(--line); }
.chat-msg{ margin-bottom:8px; padding:6px 10px; background:rgba(255,255,255,.04); border-radius:10px; }
.chat-msg .user{ color:var(--ac); font-weight:700; margin-right:6px; }
.chat-msg .time{ font-size:10px; color:var(--tx-3); margin-left:6px; }

.text-center{ text-align:center; }
.mt-10{ margin-top:10px; }
.hidden{ display:none !important; }

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:rgba(5,7,18,.96); color:#eef1ff; padding:11px 22px; border-radius:12px;
  border:1px solid rgba(var(--ac-rgb),.7); box-shadow:0 0 22px rgba(var(--ac-rgb),.3), 0 10px 30px rgba(0,0,0,.5);
  z-index:2000; font-size:13px; animation:fadeInOut 2.3s forwards; pointer-events:none; text-align:center;
}
@keyframes fadeInOut{
  0%{ opacity:0; transform:translateX(-50%) translateY(20px); }
  15%{ opacity:1; transform:translateX(-50%) translateY(0); }
  85%{ opacity:1; }
  100%{ opacity:0; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important; }
}
@media (max-width:480px){
  .nav a{ padding:7px 12px; font-size:11px; }
  .card{ margin:12px; padding:16px; }
}

</style>
<style>

.cur-ico,img.cur-ico{width:16px!important;height:16px!important;min-width:0;object-fit:contain!important;border-radius:0!important;margin:0 1px!important;vertical-align:-3px;display:inline-block;flex:none}
body:not([data-tab="Profile.html"]) .currency{display:none}
#top{position:sticky;top:0;z-index:100;background:rgba(5,7,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;min-height:60px}
.bar,.tabs{display:flex;align-items:center;gap:8px;max-width:1000px;margin:auto}
.brand{font-family:var(--mono);letter-spacing:4px;font-weight:700;font-size:13px;color:#e6ecff;margin-right:auto}
.chip{display:flex;align-items:center;gap:6px;background:rgba(9,12,30,.85);border:1px solid rgba(96,110,190,.35);padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--line-hi);background:#0c0f24;cursor:pointer;display:block;flex:none}
.tabs{margin-top:8px}
.tabs a{flex:1;text-align:center;position:relative;color:var(--tx-2);text-decoration:none;padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:600;border:1px solid transparent;transition:.2s}
.tabs a:hover{color:#fff}.tabs a.on{color:#fff;background:rgba(var(--ac-rgb),.2);border-color:var(--line-hi)}
.bdg{position:absolute;top:0;right:4px;min-width:16px;height:16px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:700}
.wrap{max-width:1000px;margin:14px auto;padding:0 12px}
.ttl{font-size:20px;margin:6px 2px 12px;color:#eef1ff}
.empty{color:var(--tx-3);text-align:center;padding:24px 8px;grid-column:1/-1}
/* profil popup */
.popup.pc{padding:0;overflow:hidden}
.pbn{height:96px;background:linear-gradient(135deg,#1b2350,#3a2a6a) center/cover}
.pav{width:88px;height:88px;margin:-44px auto 8px;border-width:3px}
.pc .in{padding:0 20px 22px}.pc .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pc small{color:var(--tx-3)}
/* GAME HUB */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s}
.gc:hover{border-color:var(--line-hi);transform:translateY(-3px);box-shadow:0 0 22px rgba(var(--ac-rgb),.22)}
.gc .pv{height:150px;background:#0c0f24 center/cover;display:grid;place-items:center}.gc .pv img{width:96px;height:96px;border-radius:50%}
.gc .bd{padding:14px}.gc h3{color:#eef1ff}.gc p{color:var(--tx-2);font-size:12.5px;margin:4px 0 12px}
/* INVENTORI */
.inv{display:grid;grid-template-columns:68px 1fr 310px;gap:12px;align-items:start}
.side{display:flex;flex-direction:column;gap:8px;position:sticky;top:112px}
.cat{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;font-size:26px;cursor:pointer;transition:.2s}
.cat img{width:34px;height:34px;object-fit:contain}.cat.on{border-color:var(--line-hi);box-shadow:0 0 16px rgba(var(--ac-rgb),.35);background:rgba(var(--ac-rgb),.16)}
.mainp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:340px}

const API_URL = "https://script.google.com/macros/s/AKfycbz7gHt-Pc5dRyKYwejO7VpMH_nmBR8Cxsk1pVt3y4h9rcXx4KtgF2vBqkOQ4ENz10MJkQ/exec";
// ↑ Pastikan ini URL Web App kamu yang benar

const SECRET = "popit_secret_2026";

// ========== HARGA JUAL (GANTI DI SINI SAJA) ==========
const SELL_PRICE = {
  banner: 5,          // Harga jual 1 banner (Mora)
  petMultiplier: 1    // Harga pet = earnAmount × angka ini
};

let currentUser = null;

async function apiCall(action, data = {}) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, secret: SECRET, ...data })
    });
    return await res.json();
  } catch (err) {
    console.error("API Error:", err);
    return { success: false, message: "Gagal terhubung ke server" };
  }
}

async function login(username, password) {
  const res = await apiCall("login", { username, password });
  if (res.success) {
    currentUser = res.user;
    localStorage.setItem("popit_session", JSON.stringify({ username }));
  }
  return res;
}

async function register(username, password) {
  const res = await apiCall("register", { username, password });
  if (res.success) {
    currentUser = res.user;
    localStorage.setItem("popit_session", JSON.stringify({ username }));
  }
  return res;
}

async function loadSession() {
  const session = localStorage.getItem("popit_session");
  if (!session) return false;
  try {
    const { username } = JSON.parse(session);
    const res = await apiCall("getUser", { username });
    if (res.success) {
      currentUser = res.user;
      return true;
    }
  } catch (e) {}
  return false;
}

function logout() {
  localStorage.removeItem("popit_session");
  currentUser = null;
  window.location.href = "login.html";
}

async function updateUser(updates) {
  if (!currentUser) return { success: false };
  const res = await apiCall("updateUser", {
    username: currentUser.username,
    updates
  });
  if (res.success) currentUser = res.user;
  return res;
}

function updateCurrencyDisplay() {
  if (!currentUser) return;
  document.querySelectorAll(".mora-count").forEach(el => el.textContent = currentUser.mora || 0);
  document.querySelectorAll(".credit-count").forEach(el => el.textContent = currentUser.credit || 0);
}

async function addCurrency(type, amount) {
  if (!currentUser) return;
  const updates = {};
  if (type === "mora") updates.mora = (currentUser.mora || 0) + amount;
  if (type === "credit") updates.credit = (currentUser.credit || 0) + amount;
  await updateUser(updates);
  updateCurrencyDisplay();
}

async function redeemCode(code) {
  if (!currentUser) return { success: false, message: "Belum login" };
  const res = await apiCall("redeem", {
    username: currentUser.username,
    code: code.trim().toUpperCase()
  });
  if (res.success) {
    currentUser = res.user;
    updateCurrencyDisplay();
  }
  return res;
}

async function getGachaConfig(type) {
  return await apiCall("getGacha", { type });
}

async function doGacha(type, times = 1) {
  if (!currentUser) return { success: false, message: "Belum login" };
  const res = await apiCall("doGacha", {
    username: currentUser.username,
    type,
    times
  });
  if (res.success) {
    currentUser = res.user;
    updateCurrencyDisplay();
  }
  return res;
}

async function claimPetEarnings() {
  if (!currentUser) return;
  const res = await apiCall("claimPets", { username: currentUser.username });
  if (res.success && (res.earnedMora > 0 || res.earnedCredit > 0)) {
    currentUser = res.user;
    updateCurrencyDisplay();
    showToast(`🐾 Pet menghasilkan: ${res.earnedMora} Mora & ${res.earnedCredit} Credit!`);
  }
}

async function getChats() {
  const res = await apiCall("getChats");
  return res.chats || [];
}

async function sendChat(message) {
  if (!currentUser || !message.trim()) return;
  return await apiCall("sendChat", {
    username: currentUser.username,
    message: message.trim()
  });
}

function showToast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2300);
}

async function requireLogin() {
  const ok = await loadSession();
  if (!ok) {
    window.location.href = "login.html";
    return false;
  }
  updateCurrencyDisplay();
  claimPetEarnings();
  return true;
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return "baru saja";
  if (m < 60) return m + " mnt lalu";
  return Math.floor(m / 60) + " jam lalu";
}

      <div class="deco tree" style="left:88%;top:8%;--th:60px"><i class="sh" style="left:-70px;top:-46px;width:150px;height:110px"></i><i class="l3" style="left:-24px;top:-90px;width:110px;height:110px"></i><i class="l2" style="left:-72px;top:-74px;width:104px;height:104px"></i><i class="l1" style="left:-46px;top:-118px;width:104px;height:104px"></i><i class="tr"></i></div>
      <div class="deco tree" style="left:15%;top:31%;--th:44px"><i class="sh" style="left:-56px;top:-38px;width:120px;height:90px"></i><i class="l3" style="left:-14px;top:-70px;width:92px;height:92px"></i><i class="l2" style="left:-62px;top:-58px;width:88px;height:88px"></i><i class="l1" style="left:-40px;top:-92px;width:84px;height:84px"></i><i class="tr"></i></div>
      <div class="deco tree" style="left:66%;top:29%;--th:32px"><i class="sh" style="left:-36px;top:-26px;width:80px;height:64px"></i><i class="l3" style="left:-4px;top:-44px;width:60px;height:60px"></i><i class="l2" style="left:-38px;top:-36px;width:58px;height:58px"></i><i class="l1" style="left:-26px;top:-58px;width:54px;height:54px"></i><i class="tr" style="width:14px;left:-7px"></i></div>
      ${[[9,52],[38,36],[58,14],[86,42],[22,18],[74,68],[47,78],[12,84],[90,88]].map(([x,y])=>`<svg class="deco tuft" style="left:${x}%;top:${y}%" viewBox="0 0 24 14"><path d="M4 13 2 3M12 13V1M20 13l2-9" stroke="#3f9a55" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>`).join("")}
      ${[[60,8,'#f4a6c1',9],[70,18,'#fff',8],[47,20,'#fff',7],[78,10,'#f7e08a',6],[54,30,'#f4a6c1',8],[33,44,'#f7e08a',6],[84,50,'#fff',8],[64,42,'#f4a6c1',7],[26,60,'#fff',6],[42,52,'#f7e08a',7],[92,24,'#f7e08a',6]].map(([x,y,c,z],i)=>`<i class="deco dot" style="left:${x}%;top:${y}%;width:${z}px;height:${z}px;background:${c};animation-delay:${(i*.37).toFixed(2)}s"></i>`).join("")}
      <div id="pet-layer"></div>`;

    let meadowReady = false, petSig = "", petNodes = [], petPos = [], wanderOn = true, openPet = -1;

    function ensureMeadow() {
      const area = document.getElementById("pet-area");
      if (!meadowReady) { area.innerHTML = MEADOW_HTML; meadowReady = true; }
      return area;
    }

    function rarityBadge(p) {
      const v = p.rarity ?? p.rar ?? p.tier;
      if (v === undefined || v === null || v === "") return null;
      const n = parseInt(v);
      if (!isNaN(n)) return n >= 5 ? ["L", 5] : n === 4 ? ["E", 4] : n === 3 ? ["R", 3] : ["N", 2];
      const ch = String(v).trim().charAt(0).toUpperCase();
      return [ch, ch === "R" ? 3 : ch === "E" ? 4 : (ch === "L" || ch === "S") ? 5 : 2];
    }

    function arenaSize() {
      const a = document.getElementById("pet-area");
      return { w: a.clientWidth, h: a.clientHeight };
    }
    const rnd = (a, b) => a + Math.random() * (b - a);

    function randomSpot() {
      const { w, h } = arenaSize();
      return { x: rnd(58, Math.max(60, w - 58)), y: rnd(84, Math.max(86, h - 62)) };
    }

    function placePet(i, x, y, dur) {
      const n = petNodes[i]; if (!n) return;
      petPos[i] = { x, y };
      n.el.style.transition = dur ? `transform ${dur}s linear` : "none";
      n.el.style.transform = `translate3d(${x}px,${y}px,0)`;
      n.el.style.zIndex = Math.round(y);
    }

    function wander(i) {
      const n = petNodes[i]; if (!n) return;
      clearTimeout(n.t);
      if (!wanderOn || openPet === i) { n.t = setTimeout(() => wander(i), 1500); return; }
      const roll = Math.random();
      if (roll < .3) {                                   // diam sebentar / lompat kecil
        if (roll < .12) { n.spr.classList.remove("idle"); n.spr.classList.add("hop"); setTimeout(() => { n.spr.classList.remove("hop"); n.spr.classList.add("idle"); }, 600); }
        n.t = setTimeout(() => wander(i), rnd(1500, 3800));
        return;
      }
      const cur = petPos[i], { w, h } = arenaSize();
      const tx = Math.min(w - 58, Math.max(58, cur.x + rnd(-150, 150)));
      const ty = Math.min(h - 62, Math.max(84, cur.y + rnd(-90, 90)));
      const dist = Math.hypot(tx - cur.x, ty - cur.y);
      if (dist < 20) { n.t = setTimeout(() => wander(i), 900); return; }
      const dur = dist / rnd(22, 36);
      n.face = tx >= cur.x ? 1 : -1;
      n.spr.style.setProperty("--fx", n.face);
      n.img.style.transform = `scaleX(${n.face})`;
      n.spr.classList.remove("idle"); n.spr.classList.add("walk");
      placePet(i, tx, ty, dur);
      n.t = setTimeout(() => {
        n.spr.classList.remove("walk"); n.spr.classList.add("idle");
        n.t = setTimeout(() => wander(i), rnd(1200, 4200));
      }, dur * 1000);
    }

    function freezePet(i) {                              // hentikan gerak di posisi sekarang
      const n = petNodes[i]; if (!n) return;
      clearTimeout(n.t);
      const m = new DOMMatrixReadOnly(getComputedStyle(n.el).transform);
      placePet(i, m.m41, m.m42, 0);
      n.spr.classList.remove("walk"); n.spr.classList.add("idle");
    }

    function closeMenus() {
      if (openPet < 0) return;
      const n = petNodes[openPet];
      if (n) n.el.classList.remove("open");
      const i = openPet; openPet = -1;
      if (n) n.t = setTimeout(() => wander(i), 800);
    }

    function togglePet(i, ev) {
      ev.stopPropagation();
      if (openPet === i) { closeMenus(); return; }
      closeMenus();
      openPet = i;
      freezePet(i);
      const n = petNodes[i];
      const { h } = arenaSize();
      n.menu.classList.toggle("up", petPos[i].y > h * .55);
      updatePetMenu(i);
      n.el.classList.add("open");
      n.el.style.zIndex = 9999;
    }

    function updatePetMenu(i) {
      const p = currentUser?.pets?.[i], n = petNodes[i];
      if (!p || !n) return;
      const ready = getPetRemaining(p) <= 0;
      n.menu.querySelector(".b-claim").style.display = ready ? "" : "none";
      n.menu.querySelector(".inf").innerHTML = `${esc(p.earnAmount)} ${ci(p.earnType)} / ${esc(p.intervalMinutes)}m`;
    }

    document.addEventListener("click", closeMenus);
    addEventListener("resize", () => {
      const { w, h } = arenaSize();
      petPos.forEach((pos, i) => { if (pos) placePet(i, Math.min(w - 58, Math.max(58, pos.x)), Math.min(h - 62, Math.max(84, pos.y)), 0); });
    });
    document.addEventListener("visibilitychange", () => { wanderOn = !document.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches; });

    function renderPets() {
      const area = ensureMeadow();
      const layer = area.querySelector("#pet-layer");
      const pets = currentUser.pets || [];

      area.querySelectorAll(".empty").forEach(e => e.remove());
      if (pets.length === 0) {
        petNodes.forEach(n => clearTimeout(n.t));
        petNodes = []; petPos = []; petSig = ""; layer.innerHTML = "";
        area.insertAdjacentHTML("beforeend", '<div class="empty">Belum ada pet. Dapatkan dari Gacha!</div>');
        return;
      }

      // data pet tidak berubah -> cukup segarkan timer, jangan reset posisi pet
      const sig = pets.map(p => [p.name, p.imageUrl, p.earnAmount, p.earnType, p.intervalMinutes].join("|")).join("~");
      if (sig === petSig) { refreshPetTimers(); return; }
      petSig = sig;

      const oldNames = petNodes.map(n => n.name), oldPos = petPos.slice();
      petNodes.forEach(n => clearTimeout(n.t));
      openPet = -1;
      layer.innerHTML = pets.map((p, i) => {
        const remain = getPetRemaining(p), ready = remain <= 0, rb = rarityBadge(p);
        return `
          <div class="pet${ready ? " ready" : ""}" data-i="${i}">
            <div class="pet-in" onclick="togglePet(${i}, event)">
              <div class="pill tm${ready ? " ready" : ""}">${ci(p.earnType)}<span class="pet-timer ${ready ? "ready" : ""}" data-index="${i}">${formatTime(remain)}</span></div>
              <div class="pet-sprite idle"><img src="${esc(p.imageUrl || PET_FALLBACK)}" alt="" referrerpolicy="no-referrer"
                   onerror="this.onerror=null;this.src=PET_FALLBACK"></div>
              <div class="pill nm${rb ? "" : " norb"}">${rb ? `<span class="rb r${rb[1]}">${esc(rb[0])}</span>` : ""}${esc(p.name)}</div>
            </div>
            <div class="pet-menu" onclick="event.stopPropagation()">
              <div class="inf"></div>
              <div class="acts">
                <button class="b-claim" onclick="claimFromMenu()">Klaim</button>
                <button class="b-sell" onclick="closeMenus();sellPet(${i})">Jual</button>
              </div>
            </div>
          </div>`;
      }).join("");

      petNodes = [...layer.querySelectorAll(".pet")].map((el, i) => ({
        el, name: pets[i].name, face: 1, t: 0,
        spr: el.querySelector(".pet-sprite"), img: el.querySelector(".pet-sprite img"), menu: el.querySelector(".pet-menu")
      }));
      petPos = [];
      petNodes.forEach((n, i) => {
        const keep = oldNames[i] === n.name && oldPos[i];
        const sp = keep ? oldPos[i] : randomSpot();
        placePet(i, sp.x, sp.y, 0);
        n.t = setTimeout(() => wander(i), rnd(400, 2500));
      });
      wanderOn = !document.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function refreshPetTimers() {
      (currentUser?.pets || []).forEach((p, i) => {
        const n = petNodes[i]; if (!n) return;
        const ready = getPetRemaining(p) <= 0;
        n.el.classList.toggle("ready", ready);
        const t = n.el.querySelector(".pet-timer");
        t.textContent = formatTime(getPetRemaining(p));
        t.classList.toggle("ready", ready);
        n.el.querySelector(".pill.tm").classList.toggle("ready", ready);
        if (openPet === i) updatePetMenu(i);
      });
    }

    async function claimFromMenu() {
      closeMenus();
      await manualClaimPets();
    }

    function startPetTimers() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(refreshPetTimers, 1000);
    }

    async function sellPet(index) {
      if (!currentUser?.pets?.[index]) return;
      const pet = currentUser.pets[index];
      const sellPrice = Math.max(20, (pet.earnAmount || 5) * (SELL_PRICE?.petMultiplier || 10));
      if (!confirm(`Jual ${pet.name} seharga ${sellPrice} Mora?`)) return;

      const newPets = currentUser.pets.filter((_, i) => i !== index);
      const res = await updateUser({
        pets: newPets,
        mora: (currentUser.mora || 0) + sellPrice
      });
      if (res.success) {
        showToast(`Berhasil jual ${pet.name} (+${sellPrice} Mora)`);
        renderPets();
        updateCurrencyDisplay();
      }
    }

    async function changePhoto(e) {
      const file = e.target.files[0];
      if (!file) return;

      // Limit praktis untuk Google Sheets (base64)
      if (file.size > 800 * 1024) {
        showToast("Foto terlalu besar! Maksimal ~800KB. Lebih baik pakai Paste Link.");
        return;
      }

      const reader = new FileReader();
      reader.onload = async (ev) => {
        showToast("Menyimpan foto...");
        const res = await updateUser({ profilePic: ev.target.result });
        if (res.success) {
          document.getElementById("profile-pic").src = ev.target.result;
          showToast("Foto berhasil diganti!");
        } else {
          showToast("Gagal menyimpan. Coba foto lebih kecil atau pakai Paste Link");
        }
      };
      reader.readAsDataURL(file);
    }

    function openUrlPhoto() {
      document.getElementById("photo-url").value = "";
      document.getElementById("url-photo-popup").classList.add("show");
    }
    function closeUrlPhoto() {
      document.getElementById("url-photo-popup").classList.remove("show");
    }

    async function saveUrlPhoto() {
      const url = document.getElementById("photo-url").value.trim();
      if (!url) {
        showToast("Masukkan link dulu");
        return;
      }
      const res = await updateUser({ profilePic: url });
      if (res.success) {
        document.getElementById("profile-pic").src = url;
        showToast("Foto dari link berhasil disimpan!");
        closeUrlPhoto();
      } else {
        showToast("Gagal menyimpan link");
      }
    }

    async function removeBanner() {
      const res = await updateUser({ activeBanner: null });
      if (res.success) {
        document.getElementById("banner-bg").style.backgroundImage = "none";
        showToast("Banner dilepas");
      }
    }

    async function manualClaimPets() {
      await claimPetEarnings();
      renderPets();
    }

    async function loadChats() {
      const chats = await getChats();
      const box = document.getElementById("chat-box");
      if (!chats?.length) {
        box.innerHTML = '<p style="color:#666;text-align:center;">Belum ada pesan</p>';
        return;
      }
      box.innerHTML = chats.map(c => `
        <div class="chat-msg">
          <span class="user">${c.username}</span>
          <span>${escapeHtml(c.message)}</span>
          <span class="time">${timeAgo(c.time)}</span>
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t;
      return d.innerHTML;
    }

    async function doSendChat() {
      const input = document.getElementById("chat-input");
      const msg = input.value.trim();
      if (!msg) return;
      input.value = "";
      const res = await sendChat(msg);
      if (res.success) loadChats();
      else showToast(res.message || "Gagal kirim");
    }

    

    (async () => {
      const ok = await requireLogin();
      if (ok) {
        renderProfile();
        startPetTimers();
        
      }
    })();
  </script>
<script>
async function changePhoto(e){const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=async()=>{const c=document.createElement("canvas"),s=Math.min(im.width,im.height);c.width=c.height=160;
  c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);const d=c.toDataURL("image/jpeg",.8);
  const r=await updateUser({profilePic:d});if(r.success){$("profile-pic").src=d;showToast("Foto diganti!")}else showToast("Gagal menyimpan foto")};
 im.src=URL.createObjectURL(f)}
</script></body>
