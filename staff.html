<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff — mrayffrd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06070d;
    --text: #ffffff;
    --muted: #8a8ea8;
    --d: 160px; /* ukuran tile — diatur otomatis oleh JS sesuai layar */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Chakra Petch', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }

  /* latar: gradasi gelap lembut + belah ketupat besar tipis senada tombol */
  #sky {
    position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(900px 600px at 85% 15%, rgba(255,255,255,.045), transparent 70%),
      linear-gradient(165deg, #0e1019 0%, #07080d 60%, #050609 100%);
  }
  #sky::before, #sky::after {
    content: ""; position: absolute; aspect-ratio: 1; transform: rotate(45deg);
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 0 0 26px transparent, 0 0 0 27px rgba(255,255,255,.04), 0 0 0 54px transparent, 0 0 0 55px rgba(255,255,255,.025);
  }
  #sky::before { width: 52vmin; right: -14vmin; top: 14vh; }
  #sky::after  { width: 42vmin; left: -16vmin; bottom: 6vh; }

  /* ===== Judul (kiri) + aksen pojok ===== */
  header {
    position: relative; text-align: left;
    padding: 40px 20px 0 clamp(46px, 6vw, 84px);
  }
  /* aksen siku di pojok kiri atas */
  header::before, header::after { content: ""; position: absolute; top: 20px; left: 20px; }
  /* garis atas: segmen tebal, jeda, lalu garis tipis yang memudar */
  header::before {
    width: min(62vw, 520px); height: 2px;
    background: linear-gradient(90deg, #fff 0 48px, transparent 48px 58px, rgba(255,255,255,.4) 58px, transparent);
  }
  /* garis kiri: pola sama ke arah bawah */
  header::after {
    width: 2px; height: 120px;
    background: linear-gradient(180deg, #fff 0 48px, transparent 48px 58px, rgba(255,255,255,.4) 58px, transparent);
  }

  .brand {
    font-size: 12px; font-weight: 600; letter-spacing: 8px; text-transform: uppercase; color: var(--muted);
  }
  h1 {
    margin-top: 8px; font-size: clamp(34px, 7vw, 54px); font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; line-height: 1; color: #fff;
  }

  /* ===== Kisi belah ketupat (posisi diatur JS) ===== */
  .lattice {
    position: relative; margin: calc(var(--d) * .25) auto calc(var(--d) * .7);
    width: min(100% - 32px, 1200px);
  }

  .tile {
    position: absolute; width: var(--d); height: var(--d);
    display: block; text-decoration: none; color: inherit; outline: none;
    pointer-events: none;                /* hanya bentuk belah ketupat yang peka sentuh */
    -webkit-tap-highlight-color: transparent;
    scale: 1; z-index: 1;
    transition: scale .65s cubic-bezier(.2,.8,.2,1);
    opacity: 0; animation: in .7s forwards; animation-delay: var(--delay, 0s);
  }
  @keyframes in { to { opacity: 1; } }

  /* bayangan belah ketupat di belakang saat dibuka */
  .tile::before {
    content: ""; position: absolute; inset: 0; margin: auto; z-index: -1;
    width: calc(var(--d) * .707); aspect-ratio: 1; border-radius: 2%;
    background: #fff; opacity: 0;
    transform: translate(15%, -13%) rotate(45deg) scale(.9);
    transition: opacity .6s, transform .7s cubic-bezier(.2,.8,.2,1);
  }

  .dia {
    position: absolute; inset: 0; margin: auto; overflow: hidden; pointer-events: auto;
    width: calc(var(--d) * .707); aspect-ratio: 1; border-radius: 2%;
    transform: rotate(45deg);
    border: 1.5px solid #2a2d40; background: #0b0c14;
    transition: border-color .5s, box-shadow .6s, opacity .6s;
  }

  /* isi ditegakkan kembali agar tidak ikut miring */
  .face {
    position: absolute; left: 50%; top: 50%; width: 142%; height: 142%;
    transform: translate(-50%, -50%) rotate(-45deg);
  }
  .bg {
    position: absolute; inset: 0;
    background-image: var(--img, none), linear-gradient(150deg, #2b2e42, #13141f 95%);
    background-size: cover, cover; background-position: center, center;
    transform: scale(1.12); transition: transform 1s cubic-bezier(.2,.8,.2,1);
  }
  .shade {
    position: absolute; inset: 0; opacity: 0; transition: opacity .6s;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.7));
  }
  .sil {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 42%, #181a27, #0b0c14 72%);
    transition: opacity .55s ease;
  }

  /* nama besar di bagian bawah */
  .nm {
    position: absolute; left: 50%; bottom: calc(var(--d) * .1);
    transform: translate(-50%, 10px); white-space: nowrap; pointer-events: none;
    font-size: max(14px, calc(var(--d) * .125)); font-weight: 700; font-style: italic;
    letter-spacing: .12em; text-transform: uppercase; color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,.85);
    opacity: 0; transition: opacity .5s .15s, transform .65s .15s cubic-bezier(.2,.8,.2,1);
  }

  /* ===== Tile pengisi (hiasan) ===== */
  .tile.filler { animation-delay: .4s; }
  .tile.filler .dia { pointer-events: none; background: transparent; border-color: #13151f; }
  .tile.filler .face { display: none; }

  /* ===== Dibuka: hover, fokus, atau ketukan pertama ===== */
  .tile:hover, .tile:focus-visible, .tile.reveal { scale: 1.32; z-index: 10; }
  .tile:hover::before, .tile:focus-visible::before, .tile.reveal::before {
    opacity: .14; transform: translate(15%, -13%) rotate(45deg) scale(1);
  }
  .tile:hover .dia, .tile:focus-visible .dia, .tile.reveal .dia {
    border-color: #fff; box-shadow: 0 0 40px -14px #fff;
  }
  .tile:hover .sil, .tile:focus-visible .sil, .tile.reveal .sil { opacity: 0; }
  .tile:hover .bg, .tile:focus-visible .bg, .tile.reveal .bg { transform: scale(1); }
  .tile:hover .shade, .tile:focus-visible .shade, .tile.reveal .shade { opacity: 1; }
  .tile:hover .nm, .tile:focus-visible .nm, .tile.reveal .nm { opacity: 1; transform: translate(-50%, 0); }

  /* tile lain menyempit & meredup */
  .lattice:has(.tile:hover) .tile:not(:hover),
  .lattice:has(.tile:focus-visible) .tile:not(:focus-visible),
  .lattice:has(.tile.reveal) .tile:not(.reveal) { scale: .86; }
  .lattice:has(.tile:hover) .tile:not(:hover) .dia,
  .lattice:has(.tile:focus-visible) .tile:not(:focus-visible) .dia,
  .lattice:has(.tile.reveal) .tile:not(.reveal) .dia { opacity: .45; }
</style>
</head>
<body>

<div id="sky"></div>

<header>
  <div class="brand">list staff</div>
  <h1>Staff</h1>
</header>

<main class="lattice" id="lattice"></main>

<script>
  /* ============================================================
     DATA STAFF — edit di sini.
     name : nama staff
     img  : foto latar tombol (kosongkan "" jika belum ada),
            contoh: "foto/owner.jpg"
     page : file HTML masing-masing staff
     ============================================================ */
  const STAFF = [
    { name: "emurice",     img: "pp.jpg", page: "staff.emu.rice.html" },
    { name: "###",   img: "", page: "staff.###.html" },
    { name: "###",   img: "", page: "staff.###.html" },
    { name: "###", img: "", page: "staff.###.html" },
    { name: "###",  img: "", page: "staff.###.html" },
    { name: "###", img: "", page: "staff.###.html" },
    { name: "###",   img: "", page: "staff.###.html" }
  ];

  const lattice = document.getElementById('lattice');
  const tiles = [];

  /* Buat tile staff */
  STAFF.forEach((s, i) => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = s.page;
    a.setAttribute('aria-label', s.name);
    a.style.setProperty('--delay', (i * 0.08) + 's');
    if (s.img) a.style.setProperty('--img', `url("${s.img}")`);
    a.innerHTML = `
      <div class="dia">
        <div class="face">
          <div class="bg"></div>
          <div class="shade"></div>
          <div class="sil"></div>
        </div>
      </div>
      <div class="nm"></div>`;
    a.querySelector('.nm').textContent = s.name;
    lattice.appendChild(a);
    tiles.push(a);
  });

  /* Susun kisi: belah ketupat saling mengunci, tile pengisi melengkapi baris terakhir */
  let fillers = [];
  function layout() {
    const vw = innerWidth, vh = innerHeight;
    const d = Math.max(120, Math.min(230, Math.min(vw * .4, vh * .42)));
    document.documentElement.style.setProperty('--d', d + 'px');

    const W = lattice.clientWidth;
    const px = d * 1.08;                 /* jarak antar tile dalam satu baris */
    const n = STAFF.length;

    /* jumlah tile per baris; baris ganjil lebih sedikit & bergeser setengah (susunan bata) */
    let k = Math.floor((W - d) / px) + 1;
    k = Math.max(1, Math.min(k, Math.max(2, Math.ceil((n + 1) / 2))));
    const py = k === 1 ? d * 1.08 : d * .54;   /* jarak antar baris */

    const rowsCap = [];
    let placed = 0, r = 0;
    while (placed < n) {
      const cap = k === 1 ? 1 : (r % 2 === 0 ? k : k - 1);
      rowsCap.push(cap); placed += cap; r++;
    }

    /* tile pengisi melengkapi baris terakhir */
    fillers.forEach(f => f.remove());
    fillers = [];
    for (let i = n; i < placed; i++) {
      const f = document.createElement('div');
      f.className = 'tile filler';
      f.innerHTML = '<div class="dia"></div>';
      lattice.appendChild(f);
      fillers.push(f);
    }

    const all = [...tiles, ...fillers];
    let idx = 0;
    rowsCap.forEach((cap, row) => {
      const x0 = (W - ((cap - 1) * px + d)) / 2;   /* tiap baris berada di tengah */
      for (let c = 0; c < cap; c++) {
        const t = all[idx++];
        t.style.left = (x0 + c * px) + 'px';
        t.style.top = (row * py) + 'px';
      }
    });
    lattice.style.height = ((rowsCap.length - 1) * py + d) + 'px';
  }
  layout();
  addEventListener('resize', layout);

  /* Perangkat sentuh: ketukan pertama membuka siluet, ketukan kedua pindah halaman */
  if (window.matchMedia('(hover: none)').matches) {
    tiles.forEach(t => {
      t.addEventListener('click', e => {
        if (!t.classList.contains('reveal')) {
          e.preventDefault();
          tiles.forEach(x => x.classList.remove('reveal'));
          t.classList.add('reveal');
        }
      });
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.tile')) tiles.forEach(x => x.classList.remove('reveal'));
    });
  }
</script>
</body>
</html>
