<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pecahan Kaca di Ruang Hampa</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.035);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);

// Lampu bergerak untuk kilau realistis
const lights = [
  new THREE.PointLight(0x9fd8ff, 300, 60),
  new THREE.PointLight(0xffd6a0, 250, 60),
  new THREE.PointLight(0xffffff, 200, 60),
];
lights.forEach(l => scene.add(l));
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(5, 10, 8);
scene.add(dir);

// Geometri pecahan kaca: poligon tak beraturan yang diekstrusi tipis
function shardGeometry() {
  const n = 3 + Math.floor(Math.random() * 3);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.9;
    const r = 0.6 + Math.random() * 1.6;
    pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r * (0.4 + Math.random())));
  }
  const shape = new THREE.Shape(pts);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: 0.06 + Math.random() * 0.05,
    bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.02, bevelSegments: 1,
  });
  g.center();
  return g;
}

const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.03,
  transmission: 1,
  thickness: 0.4,
  ior: 1.52,
  clearcoat: 1,
  clearcoatRoughness: 0.02,
  specularIntensity: 1,
  iridescence: 0.25,
  iridescenceIOR: 1.3,
  attenuationColor: new THREE.Color(0xcfeee8),
  attenuationDistance: 2.5,
  envMapIntensity: 1.4,
  side: THREE.DoubleSide,
});

const shards = [];
const COUNT = 70;
for (let i = 0; i < COUNT; i++) {
  const m = new THREE.Mesh(shardGeometry(), glass);
  const s = 0.4 + Math.random() * 0.9;
  m.scale.setScalar(s);
  m.userData = {
    radius: 3 + Math.random() * 9,
    speed: (0.08 + Math.random() * 0.15) * (Math.random() < 0.5 ? 1 : 1),
    phase: Math.random() * Math.PI * 2,
    tilt: (Math.random() - 0.5) * 1.2,
    yAmp: 0.5 + Math.random() * 2.5,
    spin: new THREE.Vector3((Math.random() - .5) * .8, (Math.random() - .5) * .8, (Math.random() - .5) * .8),
  };
  m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
  scene.add(m);
  shards.push(m);
}

// Debu bintang halus di kejauhan
const dustGeo = new THREE.BufferGeometry();
const dp = new Float32Array(1500 * 3);
for (let i = 0; i < dp.length; i++) dp[i] = (Math.random() - 0.5) * 120;
dustGeo.setAttribute("position", new THREE.BufferAttribute(dp, 3));
scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x8899aa, size: 0.06, transparent: true, opacity: 0.5 })));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82));
composer.addPass(new OutputPass());

// Geser 3D
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 45;
controls.enablePan = false;

// 4 kaca berlabel yang bisa dipencet
const LINKS = [
  { label: "Subar", url: "subar.html" },
  { label: "", url: "segera.html" },
  { label: "emurice", url: "emu.rice.html" },
  { label: "", url: "segera.html" },
];
function labelSprite(text) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.font = "600 56px 'Segoe UI', Arial, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = "rgba(160,220,255,0.9)"; g.shadowBlur = 18;
  g.fillStyle = "#ffffff"; g.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  sp.scale.set(3.2, 0.8, 1); sp.renderOrder = 10;
  return sp;
}
const linkShards = [];
LINKS.forEach((L, i) => {
  const group = new THREE.Group();
  const geo = shardGeometry();
  const mesh = new THREE.Mesh(geo, glass);
  mesh.scale.setScalar(1.4);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo, 20),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
  );
  mesh.add(edges);
  group.add(mesh);
  const sp = labelSprite(L.label); sp.position.y = 2.6; group.add(sp);
  group.userData = { url: L.url, mesh, edges, phase: (i / 4) * Math.PI * 2, radius: 7, speed: 0.07 };
  mesh.userData.link = group;
  scene.add(group);
  linkShards.push(group);
});

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let hovered = null, downPos = null;
function pick(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(linkShards.map(g => g.userData.mesh), false)[0];
  return hit ? hit.object.userData.link : null;
}
renderer.domElement.addEventListener("pointermove", e => {
  hovered = pick(e);
  renderer.domElement.style.cursor = hovered ? "pointer" : "grab";
});
renderer.domElement.addEventListener("pointerdown", e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 6) return;
  const g = pick(e);
  if (g) (window.top || window).location.href = "/" + g.userData.url;
});

const clock = new THREE.Clock();
function loop() {
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();
  shards.forEach(m => {
    const u = m.userData;
    const a = u.phase + t * u.speed;
    const x = Math.cos(a) * u.radius;
    const z = Math.sin(a) * u.radius;
    const y = Math.sin(a * 2 + u.phase) * u.yAmp;
    m.position.set(x, y * Math.cos(u.tilt) + z * Math.sin(u.tilt) * 0.3, z);
    m.rotation.x += u.spin.x * 0.01;
    m.rotation.y += u.spin.y * 0.01;
    m.rotation.z += u.spin.z * 0.01;
  });
  lights[0].position.set(Math.cos(t * 0.4) * 10, Math.sin(t * 0.3) * 6, Math.sin(t * 0.4) * 10);
  lights[1].position.set(Math.cos(-t * 0.3 + 2) * 12, Math.cos(t * 0.5) * 5, Math.sin(-t * 0.3 + 2) * 12);
  lights[2].position.set(Math.sin(t * 0.2) * 4, 8, 6);

  linkShards.forEach(g => {
    const u = g.userData;
    const a = u.phase + t * u.speed;
    g.position.set(Math.cos(a) * u.radius, Math.sin(a * 1.5 + u.phase) * 1.2, Math.sin(a) * u.radius);
    u.mesh.rotation.y = t * 0.3 + u.phase;
    u.mesh.rotation.x = Math.sin(t * 0.4 + u.phase) * 0.4;
    const on = g === hovered;
    u.edges.material.opacity = on ? 1 : 0.85;
    const s = THREE.MathUtils.lerp(u.mesh.scale.x, on ? 1.65 : 1.4, 0.15);
    u.mesh.scale.setScalar(s);
  });
  controls.update();

  composer.render();
  requestAnimationFrame(loop);
}
loop();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
