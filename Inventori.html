<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#191c2b"><link rel="icon" href="icon.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Inventori | neve Enterprise</title>
<script>
/* Tema (Sistem / Gelap / Terang) dipasang sebelum halaman tampil, sama seperti index.html */
(function(){function ap(){try{var p=localStorage.getItem('emu.theme')||'dark';var l=p==='light'||(p==='system'&&matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.dataset.theme=l?'light':'dark';var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=l?'#ffffff':'#191c2b';}catch(e){}}
ap();try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',ap)}catch(e){}})();
</script>
<style>
/* =====================================================================
   TEMA BERSAMA — sama dengan index.html (EMU Joki)
   Token warna, font Inter, kartu rata, tab bergaris, tombol pil.
   Mendukung tema Gelap / Terang / Sistem (pilihan disimpan di 'emu.theme').
   ===================================================================== */
:root{
  color-scheme:dark;
  --bg:#0f111b; --nav:#191c2b; --card:#1a1d2c; --card2:#252a3d; --line:rgba(255,255,255,.08);
  --tx:#eef0fb; --tx2:#a9aecb; --tx3:#7c82a3;
  --ac:#4f5ff0; --ac-tx:#9aa6ff; --ac-soft:rgba(99,112,255,.18); --ac-rgb:99,112,255;
  --ok:#3ddc97; --gold:#ffc861; --credit:#5fe0ee; --bad:#ff6b7a;
  --ok-rgb:61,220,151; --gold-rgb:255,200,97; --credit-rgb:95,224,238; --bad-rgb:255,107,122;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:Consolas,"DejaVu Sans Mono","Courier New",ui-monospace,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  /* nama lama, supaya kode lama tetap jalan */
  --panel:var(--card); --panel-2:var(--card2); --tx-2:var(--tx2); --tx-3:var(--tx3);
  --line-hi:var(--ac); --success:var(--ok); --danger:var(--bad);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f2f8; --nav:#ffffff; --card:#ffffff; --card2:#f0f1f9; --line:rgba(25,30,60,.09);
  --tx:#1b1f33; --tx2:#585e7c; --tx3:#8a8fa9;
  --ac:#5461f0; --ac-tx:#4452dd; --ac-soft:#e7e9ff; --ac-rgb:84,97,240;
  --ok:#12a56b; --gold:#b9770e; --credit:#0e8a9a; --bad:#d93a4c;
  --ok-rgb:18,165,107; --gold-rgb:185,119,14; --credit-rgb:14,138,154; --bad-rgb:217,58,76;
  --shadow:0 8px 24px rgba(30,40,90,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font-family:inherit}
[hidden]{display:none!important}
::selection{background:rgba(var(--ac-rgb),.35);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,134,170,.35);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--ac-tx);outline-offset:2px;border-radius:8px}

/* ---------- layar boot ---------- */
#emu-boot{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;letter-spacing:3px;font-size:13px;color:var(--tx3);font-family:var(--sans);font-weight:600;transition:opacity .45s ease}
#emu-boot.off{opacity:0;pointer-events:none}
#emu-boot b{font-size:20px;font-weight:800;letter-spacing:6px;background:linear-gradient(90deg,#8794ff,#5fb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#emu-boot i{display:block;width:150px;height:3px;overflow:hidden;border-radius:3px;background:var(--card2)}
#emu-boot i::after{content:"";display:block;width:40%;height:100%;background:var(--ac);border-radius:3px;animation:bootbar 1.1s ease-in-out infinite}
@keyframes bootbar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* ---------- header: sama seperti index (logo + chip + foto, tab bergaris) ---------- */
#top{position:sticky;top:0;z-index:100;background:var(--nav);border-bottom:1px solid var(--line);padding:calc(8px + var(--safe-t)) 12px 0}
.bar,.tabs{display:flex;align-items:center;max-width:1000px;margin:auto}
.bar{gap:8px;height:46px}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:6px;text-decoration:none;font-weight:800;font-size:24px;letter-spacing:-1px;background:linear-gradient(90deg,#8794ff,#5fb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-size:10.5px;font-weight:700;letter-spacing:2.5px;-webkit-text-fill-color:var(--tx3)}
.chip{display:flex;align-items:center;gap:6px;background:var(--card2);padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--card2);cursor:pointer;display:block;flex:none}
.tabs{gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:1;min-width:max-content;text-align:center;position:relative;color:var(--tx3);text-decoration:none;padding:13px 12px;font-size:14.5px;font-weight:700;transition:color .2s}
.tabs a:hover{color:var(--tx2)}
.tabs a.on{color:var(--tx)}
.tabs a.on::after{content:"";position:absolute;left:50%;bottom:0;width:20px;height:3px;border-radius:3px;background:var(--ac);transform:translateX(-50%)}
.bdg{position:absolute;top:6px;right:4px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:700}
.cur-ico,img.cur-ico{width:16px!important;height:16px!important;min-width:0;object-fit:contain!important;border-radius:0!important;margin:0 1px!important;vertical-align:-3px;display:inline-block;flex:none}
body:not([data-tab="Profile.html"]) .currency{display:none}

/* ---------- tata letak ---------- */
.wrap{max-width:1000px;margin:14px auto;padding:0 12px}
.ttl{font-size:20px;font-weight:800;margin:6px 2px 12px;color:var(--tx)}
.empty{color:var(--tx3);text-align:center;padding:24px 8px;grid-column:1/-1}
.text-center{text-align:center}.mt-10{margin-top:10px}.hidden{display:none!important}

/* ---------- kartu ---------- */
.card{background:var(--card);border-radius:var(--r-lg);padding:20px;margin:16px auto;max-width:520px;box-shadow:var(--shadow)}
.card h1,.card h2{text-align:center;margin-bottom:12px;color:var(--tx);font-weight:800;letter-spacing:-.2px}

/* ---------- tombol (utama = aksen, seperti .btn-ac di index) ---------- */
.btn{appearance:none;font:700 13.5px var(--sans);text-decoration:none;color:#fff;background:var(--ac);border:1px solid transparent;min-height:40px;padding:0 20px;border-radius:99px;cursor:pointer;transition:filter .2s,transform .15s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;user-select:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn-gold{background:rgba(var(--gold-rgb),.16);border-color:rgba(var(--gold-rgb),.55);color:var(--gold)}
.btn-credit{background:rgba(var(--credit-rgb),.14);border-color:rgba(var(--credit-rgb),.5);color:var(--credit)}
.btn-outline{background:var(--card2);color:var(--tx);border-color:var(--line)}
.btn-sell{background:rgba(var(--bad-rgb),.14);border-color:rgba(var(--bad-rgb),.5);color:var(--bad);min-height:30px;padding:0 12px;font-size:12px;margin-top:6px}
.btn-use{min-height:30px;padding:0 12px;font-size:12px;margin-top:6px}

/* ---------- mata uang ---------- */
.currency{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:14px;margin:12px 0}
.currency span{background:var(--card2);padding:6px 14px;border-radius:99px;display:flex;align-items:center;gap:6px;font-weight:700}
.mora{color:var(--gold)}.credit{color:var(--credit)}

/* ---------- popup ---------- */
.popup-overlay{position:fixed;inset:0;background:rgba(5,6,12,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;justify-content:center;align-items:center;z-index:1000;padding:16px}
.popup-overlay.show{display:flex}
.popup{background:var(--card);padding:26px 22px;border-radius:20px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:popIn .26s cubic-bezier(.3,.9,.3,1);position:relative;color:var(--tx)}
@keyframes popIn{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.popup h2{margin-bottom:14px;color:var(--tx);font-weight:800}
.popup input,.login-box input{width:100%;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:500 14px var(--sans);margin-bottom:14px;outline:none;transition:border-color .2s}
.popup input:focus,.login-box input:focus{border-color:var(--ac)}
.popup .close-btn{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--tx3);font-size:24px;cursor:pointer;line-height:1}
.popup .close-btn:hover{color:var(--tx)}
.popup p{color:var(--tx2)}
.login-box{max-width:380px;margin:60px auto;text-align:center}
.popup.pc{padding:0;overflow:hidden}
.pbn{height:96px;background:linear-gradient(135deg,#4452dd,#1b1f33) center/cover}
.pav{width:88px;height:88px;margin:-44px auto 8px;border:3px solid var(--card)}
.pc .in{padding:0 20px 22px}
.pc .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pc small{color:var(--tx3)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%);background:#232738;color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:2000;font-size:13px;animation:fadeInOut 2.3s forwards;pointer-events:none;text-align:center;max-width:min(420px,calc(100vw - 32px))}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(20px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1}100%{opacity:0}}

/* ---------- item ---------- */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:14px}
.item-card{background:var(--card2);border-radius:14px;padding:12px 8px;text-align:center;transition:transform .2s,box-shadow .2s}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.item-card img{width:64px;height:64px;object-fit:cover;border-radius:10px;margin-bottom:6px}
.item-card .name{font-size:12.5px;font-weight:600;color:var(--tx)}

/* ---------- profil ---------- */
.profile-header{text-align:center;position:relative;padding:20px 0;border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;background:linear-gradient(135deg,#4452dd,#1b1f33);isolation:isolate}
.profile-header .banner-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:1;z-index:0}
.profile-header::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(9,11,22,.18),rgba(9,11,22,.62));pointer-events:none}
.profile-header .content{position:relative;z-index:1}
.profile-header h2{color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.55)}
.profile-header .currency span{background:rgba(15,17,30,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
.profile-header .mora{color:#ffd77a}.profile-header .credit{color:#7fe8f3}
.profile-pic-wrap{width:100px;height:100px;border-radius:50%;overflow:hidden;margin:0 auto 10px;border:3px solid rgba(255,255,255,.9);background:var(--card2);flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.profile-pic-wrap img{width:100%;height:100%;object-fit:cover;display:block}
body[data-tab="Profile.html"] .profile-header{padding:40px 0 22px}
body[data-tab="Profile.html"] .profile-pic-wrap{width:112px;height:112px}
.pet-timer{font-size:11px;color:var(--ok);margin-top:4px}
.pet-timer.ready{color:var(--gold);font-weight:700}
.chat-box{height:280px;overflow-y:auto;background:var(--card2);border-radius:var(--r-lg);padding:12px;margin-bottom:12px;text-align:left;font-size:13px}
.chat-msg{margin-bottom:8px;padding:6px 10px;background:var(--card);border-radius:10px}
.chat-msg .user{color:var(--ac-tx);font-weight:700;margin-right:6px}
.chat-msg .time{font-size:10px;color:var(--tx3);margin-left:6px}

/* ---------- hub game ---------- */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gc{background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s}
.gc:hover{transform:translateY(-3px)}
.gc .pv{height:150px;background:var(--card2) center/cover;display:grid;place-items:center}
.gc .pv img{width:100%;height:100%;object-fit:cover;border-radius:0;transition:transform .5s}
.gc:hover .pv img{transform:scale(1.06)}
.gc .bd{padding:14px}.gc h3{color:var(--tx);font-size:17px;font-weight:700}.gc p{color:var(--tx2);font-size:13px;margin:4px 0 12px}

/* ---------- inventori ---------- */
.inv{display:grid;grid-template-columns:68px 1fr 310px;gap:12px;align-items:start}
.side{display:flex;flex-direction:column;gap:8px;position:sticky;top:112px}
.cat{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid transparent;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:26px;cursor:pointer;transition:.2s}
.cat img{width:34px;height:34px;object-fit:contain}
.cat.on{border-color:var(--ac);background:var(--ac-soft)}
.mainp{background:var(--card);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:14px;min-height:340px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}.mh b{color:var(--tx);font-size:16px;font-weight:800}
.gridm{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.slot{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid transparent;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;cursor:pointer;text-align:center;font-size:11.5px;font-weight:600;color:var(--tx);transition:.2s;overflow:hidden}
.slot:hover,.slot.on{border-color:var(--ac);background:var(--ac-soft)}
.slot .m{font-size:30px;line-height:1}.slot img{width:52px;height:52px;object-fit:cover;border-radius:50%}
.slot .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.prev{background:var(--card);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:18px;text-align:center;position:sticky;top:112px}
.prev .big{width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px}.prev .bm{font-size:56px}
.prev h3{color:var(--tx);margin:6px 0;font-weight:800}.prev .ds{color:var(--tx2);font-size:13px;margin-bottom:12px;word-break:break-word}
.prev .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.prev .x{display:none}
.veil{position:fixed;inset:0;background:rgba(5,6,12,.7);backdrop-filter:blur(4px);z-index:1000;display:none}.veil.on{display:block}
.stb{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.3px;border:1px solid}
.stb.ok{color:var(--ok);background:rgba(var(--ok-rgb),.14);border-color:rgba(var(--ok-rgb),.5)}
.stb.no{color:var(--bad);background:rgba(var(--bad-rgb),.14);border-color:rgba(var(--bad-rgb),.5)}
.stb.info{color:var(--ac-tx);background:var(--ac-soft);border-color:rgba(var(--ac-rgb),.5)}
@media(max-width:760px){.inv{grid-template-columns:56px 1fr}.side{top:108px}
.prev{position:fixed;left:50%;top:50%;width:min(88vw,340px);transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;z-index:1001;transition:.2s;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.prev.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}.prev .x{display:block;position:absolute;top:8px;right:12px;background:none;border:0;color:var(--tx3);font-size:24px}}

/* ---------- chat ---------- */
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;position:relative;font:700 13.5px var(--sans);padding:0 10px;min-height:40px;border-radius:99px;border:1px solid transparent;background:var(--card);color:var(--tx2);cursor:pointer;box-shadow:var(--shadow)}
.seg button.on{color:#fff;background:var(--ac)}
.panel{background:var(--card);box-shadow:var(--shadow);border-radius:var(--r-lg);height:calc(100dvh - 200px);min-height:380px;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:88%}.msg.me{margin-left:auto;flex-direction:row-reverse}.msg .av{width:34px;height:34px}
.bub{min-width:0;background:var(--card2);border-radius:4px 14px 14px 14px;padding:7px 12px}
.me .bub{background:var(--ac-soft);border-radius:14px 4px 14px 14px}
.bub b{font-size:11.5px;color:var(--ac-tx);display:block}
.bub p{word-break:break-word;overflow-wrap:anywhere;font-size:14px}
.bub i{font-size:10px;color:var(--tx3);font-style:normal}
.inp{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.inp input{flex:1;min-width:0;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:500 14px var(--sans);outline:none}
.inp input:focus{border-color:var(--ac)}
.tools{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx3)}
.tools button{background:none;border:0;color:var(--tx2);font:inherit;cursor:pointer}.tools button:hover{color:var(--bad)}
.pl{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.flist{border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.fi{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--line);position:relative}
.fi:hover,.fi.on{background:var(--ac-soft)}
.fi .t{min-width:0;flex:1}.fi b{display:block;color:var(--tx);font-size:13.5px}
.fi small{display:block;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .bdg{position:static}
.conv{display:flex;flex-direction:column;min-height:0;min-width:0}
.back{display:none}
@media(max-width:760px){.pl{grid-template-columns:1fr}.pl .conv{display:none}.pl.open .flist{display:none}.pl.open .conv{display:flex}.back{display:inline!important}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media (max-width:480px){.card{margin:12px;padding:16px}.brand{font-size:21px}}


/* ===== HEADER BERSAMA (sama dengan index) ===== */
:root{--hxn:60px}
#top{display:contents}
.wrap{max-width:1240px;padding:0 20px}
.hx-wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 20px}
.hx-nav{position:sticky;top:0;z-index:100;height:var(--hxn);background:var(--nav);border-bottom:1px solid var(--line)}
html[data-theme="light"] .hx-nav{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hx-nav .hx-wrap{height:100%;display:flex;align-items:center;gap:26px}
.hx-logo{display:flex;align-items:flex-end;gap:8px;text-decoration:none;color:var(--tx3)}
.hx-nv{display:block;height:26px;aspect-ratio:1755/340;background:url('logo.png') 48.15% 48.57%/123.08% auto no-repeat;flex:none}
.hx-logo small{font-size:11px;font-weight:700;letter-spacing:2.5px;line-height:1;margin-bottom:1px}
.hx-links{display:flex;gap:22px;flex:1}
.hx-links a{position:relative;text-decoration:none;font-weight:700;font-size:15px;color:var(--tx3);padding:18px 0}
.hx-links a.on{color:var(--tx)}
.hx-links a.on::after{content:"";position:absolute;left:50%;bottom:6px;width:20px;height:3px;border-radius:3px;background:var(--ac);transform:translateX(-50%)}
.hx-act{display:flex;align-items:center;gap:6px;margin-left:auto}

const API_URL = "https://script.google.com/macros/s/AKfycbwHtatQVaip_YspROYu7Rmtm1xWG_f69yBHoahG7DoPElB08sMmKgSCXgdgF7X9_14/exec";

  petMultiplier: 1    // Harga pet = earnAmount × angka ini
};

let currentUser = null;

async function apiCall(action, data = {}) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, secret: SECRET, ...data })
    });
    return await res.json();
  } catch (err) {
    console.error("API Error:", err);
    return { success: false, message: "Gagal terhubung ke server" };
  }
}

async function login(username, password) {
  const res = await apiCall("login", { username, password });
  if (res.success) {
    currentUser = res.user;
    localStorage.setItem("popit_session", JSON.stringify({ username }));
  }
  return res;
}

async function register(username, password) {
  const res = await apiCall("register", { username, password });
  if (res.success) {
    currentUser = res.user;
    localStorage.setItem("popit_session", JSON.stringify({ username }));
  }
  return res;
}

async function loadSession() {
  const session = localStorage.getItem("popit_session");
  if (!session) return false;
  try {
    const { username } = JSON.parse(session);
    const res = await apiCall("getUser", { username });
    if (res.success) {
      currentUser = res.user;
      return true;
    }
  } catch (e) {}
  return false;
}

function logout() {
  localStorage.removeItem("popit_session");
  currentUser = null;
  window.location.href = "login.html";
}

async function updateUser(updates) {
  if (!currentUser) return { success: false };
  const res = await apiCall("updateUser", {
    username: currentUser.username,
    updates
  });
  if (res.success) currentUser = res.user;
  return res;
}

function updateCurrencyDisplay() {
  if (!currentUser) return;
  document.querySelectorAll(".mora-count").forEach(el => el.textContent = currentUser.mora || 0);
  document.querySelectorAll(".credit-count").forEach(el => el.textContent = currentUser.credit || 0);
}

async function addCurrency(type, amount) {
  if (!currentUser) return;
  const updates = {};
  if (type === "mora") updates.mora = (currentUser.mora || 0) + amount;
  if (type === "credit") updates.credit = (currentUser.credit || 0) + amount;
  await updateUser(updates);
  updateCurrencyDisplay();
}

async function redeemCode(code) {
  if (!currentUser) return { success: false, message: "Belum login" };
  const res = await apiCall("redeem", {
    username: currentUser.username,
    code: code.trim().toUpperCase()
  });
  if (res.success) {
    currentUser = res.user;
    updateCurrencyDisplay();
  }
  return res;
}

async function getGachaConfig(type) {
  return await apiCall("getGacha", { type });
}

async function doGacha(type, times = 1) {
  if (!currentUser) return { success: false, message: "Belum login" };
  const res = await apiCall("doGacha", {
    username: currentUser.username,
    type,
    times
  });
  if (res.success) {
    currentUser = res.user;
    updateCurrencyDisplay();
  }
  return res;
}

async function claimPetEarnings() {
  if (!currentUser) return;
  const res = await apiCall("claimPets", { username: currentUser.username });
  if (res.success && (res.earnedMora > 0 || res.earnedCredit > 0)) {
    currentUser = res.user;
    updateCurrencyDisplay();
    showToast(`🐾 Pet menghasilkan: ${res.earnedMora} Mora & ${res.earnedCredit} Credit!`);
  }
}

async function getChats() {
  const res = await apiCall("getChats");
  return res.chats || [];
}

async function sendChat(message) {
  if (!currentUser || !message.trim()) return;
  return await apiCall("sendChat", {
    username: currentUser.username,
    message: message.trim()
  });
}

function showToast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2300);
}

async function requireLogin() {
  const ok = await loadSession();
  if (!ok) {
    window.location.href = "login.html";
    return false;
  }
  updateCurrencyDisplay();
  return true;
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return "baru saja";
  if (m < 60) return m + " mnt lalu";
  return Math.floor(m / 60) + " jam lalu";
}

      if (n) n.el.classList.remove("open");
      const i = openPet; openPet = -1;
      if (n) n.t = setTimeout(() => wander(i), 800);
    }

    function togglePet(i, ev) {
      ev.stopPropagation();
      if (openPet === i) { closeMenus(); return; }
      closeMenus();
      openPet = i;
      freezePet(i);
      const n = petNodes[i];
      const { h } = arenaSize();
      n.menu.classList.toggle("up", petPos[i].y > h * .55);
      updatePetMenu(i);
      n.el.classList.add("open");
      n.el.style.zIndex = 9999;
    }

    function updatePetMenu(i) {
      const p = currentUser?.pets?.[i], n = petNodes[i];
      if (!p || !n) return;
      const ready = getPetRemaining(p) <= 0;
      n.menu.querySelector(".b-claim").style.display = ready ? "" : "none";
      n.menu.querySelector(".inf").innerHTML = `${esc(p.earnAmount)} ${ci(p.earnType)} / ${esc(p.intervalMinutes)}m`;
    }

    document.addEventListener("click", closeMenus);
    addEventListener("resize", () => {
      const { w, h } = arenaSize();
      petPos.forEach((pos, i) => { if (pos) placePet(i, Math.min(w - 58, Math.max(58, pos.x)), Math.min(h - 62, Math.max(84, pos.y)), 0); });
    });
    document.addEventListener("visibilitychange", () => { wanderOn = !document.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches; });

    function renderPets() {
      const area = ensureMeadow();
      const layer = area.querySelector("#pet-layer");
      const pets = currentUser.pets || [];

      area.querySelectorAll(".empty").forEach(e => e.remove());
      if (pets.length === 0) {
        petNodes.forEach(n => clearTimeout(n.t));
        petNodes = []; petPos = []; petSig = ""; layer.innerHTML = "";
        area.insertAdjacentHTML("beforeend", '<div class="empty">Belum ada pet. Dapatkan dari Gacha!</div>');
        return;
      }

      // data pet tidak berubah -> cukup segarkan timer, jangan reset posisi pet
      const sig = pets.map(p => [p.name, p.imageUrl, p.earnAmount, p.earnType, p.intervalMinutes].join("|")).join("~");
      if (sig === petSig) { refreshPetTimers(); return; }
      petSig = sig;

      const oldNames = petNodes.map(n => n.name), oldPos = petPos.slice();
      petNodes.forEach(n => clearTimeout(n.t));
      openPet = -1;
      layer.innerHTML = pets.map((p, i) => {
        const remain = getPetRemaining(p), ready = remain <= 0, rb = rarityBadge(p);
        return `
          <div class="pet${ready ? " ready" : ""}" data-i="${i}">
            <div class="pet-in" onclick="togglePet(${i}, event)">
              <div class="pill tm${ready ? " ready" : ""}">${ci(p.earnType)}<span class="pet-timer ${ready ? "ready" : ""}" data-index="${i}">${formatTime(remain)}</span></div>
              <div class="pet-sprite idle"><img src="${esc(p.imageUrl || PET_FALLBACK)}" alt="" referrerpolicy="no-referrer"
                   onerror="this.onerror=null;this.src=PET_FALLBACK"></div>
              <div class="pill nm${rb ? "" : " norb"}">${rb ? `<span class="rb r${rb[1]}">${esc(rb[0])}</span>` : ""}${esc(p.name)}</div>
            </div>
            <div class="pet-menu" onclick="event.stopPropagation()">
              <div class="inf"></div>
              <div class="acts">
                <button class="b-claim" onclick="claimFromMenu()">Klaim</button>
                <button class="b-sell" onclick="closeMenus();sellP(${i})">Jual</button>
              </div>
            </div>
          </div>`;
      }).join("");

      petNodes = [...layer.querySelectorAll(".pet")].map((el, i) => ({
        el, name: pets[i].name, face: 1, t: 0,
        spr: el.querySelector(".pet-sprite"), img: el.querySelector(".pet-sprite img"), menu: el.querySelector(".pet-menu")
      }));
      petPos = [];
      petNodes.forEach((n, i) => {
        const keep = oldNames[i] === n.name && oldPos[i];
        const sp = keep ? oldPos[i] : randomSpot();
        placePet(i, sp.x, sp.y, 0);
        n.t = setTimeout(() => wander(i), rnd(400, 2500));
      });
      wanderOn = !document.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function refreshPetTimers() {
      (currentUser?.pets || []).forEach((p, i) => {
        const n = petNodes[i]; if (!n) return;
        const ready = getPetRemaining(p) <= 0;
        n.el.classList.toggle("ready", ready);
        const t = n.el.querySelector(".pet-timer");
        t.textContent = formatTime(getPetRemaining(p));
        t.classList.toggle("ready", ready);
        n.el.querySelector(".pill.tm").classList.toggle("ready", ready);
        if (openPet === i) updatePetMenu(i);
      });
    }

    async function claimFromMenu() {
      closeMenus();
      await manualClaimPets();
    }

    function startPetTimers() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(refreshPetTimers, 1000);
    }


    // Pet yang sudah habis cooldown TIDAK mulai hitung mundur lagi sampai diklaim manual.
    async function manualClaimPets() {
      const pets = currentUser?.pets || [];
      if (!pets.some(p => getPetRemaining(p) <= 0)) { showToast("Belum ada pet yang siap diklaim"); return; }
      await claimPetEarnings();
      renderPets();
    }
    function stopPets() {
      petNodes.forEach(n => clearTimeout(n.t));
      petNodes = []; petPos = []; petSig = ""; openPet = -1;
      const l = document.getElementById("pet-layer"); if (l) l.innerHTML = "";
    }
    const _render0 = render;
    render = function () {
      const pet = cat === "pet";
      $("petwrap").hidden = !pet; $("gm").hidden = pet;
      document.querySelector(".inv").classList.toggle("petmode", pet);
      _render0();
      if (pet) {
        $("ctl").innerHTML = '<button class="btn btn-gold" style="padding:6px 12px;font-size:12px" onclick="manualClaimPets()">Klaim Semua</button>';
        renderPets();
      } else stopPets();
    };
    startPetTimers();
(async()=>{if(await requireLogin()){render();loadMail()}})();
</script></body></html>
