<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#03030a"><link rel="icon" href="icon.png"><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><title>Chat</title><style>
/* =====================================================================
   TEMA BERSAMA — diselaraskan dengan index.html (EMU Joki)
   Ruang gelap #03030a, aksen indigo, font Inter, panel kaca.
   ===================================================================== */
:root{
  color-scheme: dark;
  --ac-rgb: 148,168,255;
  --ac: rgb(var(--ac-rgb));
  --gold-rgb: 255,220,150;
  --gold: rgb(var(--gold-rgb));
  --credit-rgb: 90,255,240;
  --credit: rgb(var(--credit-rgb));
  --ok-rgb: 87,224,168;
  --bad-rgb: 255,110,120;
  --bg: #03030a;
  --panel: rgba(5,7,18,.86);
  --panel-2: rgba(12,15,36,.78);
  --line: rgba(110,125,215,.32);
  --line-hi: rgba(var(--ac-rgb),.75);
  --tx: #dfe4ff;
  --tx-2: #9aa4d8;
  --tx-3: #6f79b4;
  --success: rgb(var(--ok-rgb));
  --danger: rgb(var(--bad-rgb));
  --mono: Consolas, "DejaVu Sans Mono", "Courier New", ui-monospace, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 16px; --r-md: 11px; --r-sm: 8px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  font-family:var(--sans); background:var(--bg); min-height:100vh; color:var(--tx);
  font-size:14px; line-height:1.6; overflow-x:hidden; position:relative;
  -webkit-tap-highlight-color:transparent;
}
img{ max-width:100%; }
::selection{ background:rgba(var(--ac-rgb),.35); color:#fff; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:rgba(110,125,215,.35); border-radius:9px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---------- latar nebula (versi ringan dari index.html) ---------- */
body::before{
  content:""; position:fixed; inset:-10%; z-index:-3; pointer-events:none;
  background:
    radial-gradient(38% 34% at 18% 22%, rgba(var(--ac-rgb),.20), transparent 70%),
    radial-gradient(34% 30% at 82% 30%, rgba(160,90,255,.13), transparent 70%),
    radial-gradient(46% 38% at 60% 92%, rgba(var(--ac-rgb),.14), transparent 72%);
  animation: nebDrift 46s ease-in-out infinite alternate;
}
@keyframes nebDrift{ from{ transform:translate3d(-1.5%,-1%,0) scale(1); } to{ transform:translate3d(2%,1.5%,0) scale(1.08); } }
body::after{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(3,3,10,.78) 100%),
             linear-gradient(180deg, rgba(3,3,10,.55), rgba(3,3,10,.25) 30%, rgba(3,3,10,.6));
}

/* ---------- boot screen ---------- */
#emu-boot{ position:fixed; inset:0; z-index:9000; background:#03030a; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; letter-spacing:3px; font-size:13px; color:#9aa4d8;
  font-family:var(--mono); transition:opacity .45s ease; }
#emu-boot.off{ opacity:0; pointer-events:none; }
#emu-boot b{ font-size:18px; letter-spacing:6px; color:#e6ecff; text-shadow:0 0 22px rgba(var(--ac-rgb),.7); }
#emu-boot i{ display:block; width:150px; height:2px; overflow:hidden; border-radius:2px; background:rgba(120,140,220,.18); }
#emu-boot i::after{ content:""; display:block; width:40%; height:100%; background:linear-gradient(90deg,transparent,var(--ac),transparent); animation:bootbar 1.1s ease-in-out infinite; }
@keyframes bootbar{ from{ transform:translateX(-100%); } to{ transform:translateX(260%); } }

/* ---------- nav (header) ---------- */
.nav{
  display:flex; justify-content:center; flex-wrap:wrap; gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;
  background:rgba(5,7,18,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  position:sticky; top:0; z-index:100; border-bottom:1px solid var(--line);
}
.nav a{
  color:var(--tx-2); text-decoration:none; padding:9px 16px; border-radius:99px;
  background:rgba(18,22,48,.85); border:1px solid rgba(96,110,190,.4);
  font-weight:600; font-size:12px; letter-spacing:1px; transition:background .2s,border-color .2s,box-shadow .2s,transform .2s;
}
.nav a:hover{ color:#fff; border-color:var(--line-hi); box-shadow:0 0 14px rgba(var(--ac-rgb),.3); transform:translateY(-1px); }
.nav a.active{ color:#fff; background:rgba(var(--ac-rgb),.25); border-color:var(--line-hi); box-shadow:0 0 16px rgba(var(--ac-rgb),.35); }

/* ---------- kartu / panel ---------- */
.card{
  background:var(--panel); border-radius:var(--r-lg); padding:22px; margin:16px auto; max-width:520px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line); box-shadow:0 10px 40px rgba(0,0,0,.45);
}
.card h1,.card h2{ text-align:center; margin-bottom:12px; color:#eef1ff; letter-spacing:1px; }

/* ---------- tombol ---------- */
.btn{
  appearance:none; font:inherit; font-size:13px; font-weight:700; letter-spacing:.5px; text-decoration:none;
  color:#dfe4ff; background:rgba(18,22,48,.85); border:1px solid rgba(96,110,190,.5);
  padding:11px 20px; border-radius:var(--r-md); cursor:pointer;
  transition:background .2s,border-color .2s,box-shadow .2s,transform .2s;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  touch-action:manipulation; user-select:none;
}
.btn:hover{ background:rgba(70,90,190,.45); border-color:var(--line-hi); box-shadow:0 0 16px rgba(var(--ac-rgb),.3); transform:translateY(-1px); }
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.btn-gold{ background:linear-gradient(180deg,rgba(var(--gold-rgb),.42),rgba(var(--gold-rgb),.2)); border-color:rgba(var(--gold-rgb),.9); color:#fff8e6; }
.btn-gold:hover{ background:linear-gradient(180deg,rgba(var(--gold-rgb),.6),rgba(var(--gold-rgb),.32)); box-shadow:0 0 18px rgba(var(--gold-rgb),.4); }
.btn-credit{ background:linear-gradient(180deg,rgba(var(--credit-rgb),.42),rgba(var(--credit-rgb),.2)); border-color:rgba(var(--credit-rgb),.9); color:#eafffe; }
.btn-credit:hover{ background:linear-gradient(180deg,rgba(var(--credit-rgb),.6),rgba(var(--credit-rgb),.32)); box-shadow:0 0 18px rgba(var(--credit-rgb),.4); }
.btn-outline{ background:transparent; border:1px solid var(--line-hi); }
.btn-outline:hover{ background:rgba(var(--ac-rgb),.15); }
.btn-sell{ background:rgba(var(--bad-rgb),.18); border-color:rgba(var(--bad-rgb),.7); color:#ffd1d5; padding:5px 10px; font-size:11px; margin-top:6px; }
.btn-sell:hover{ background:rgba(var(--bad-rgb),.32); box-shadow:0 0 14px rgba(var(--bad-rgb),.3); }
.btn-use{ padding:5px 10px; font-size:11px; margin-top:6px; }

/* ---------- mata uang ---------- */
.currency{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; font-size:14px; margin:12px 0; }
.currency span{ background:rgba(9,12,30,.85); border:1px solid rgba(96,110,190,.35); padding:7px 14px; border-radius:99px; display:flex; align-items:center; gap:6px; }
.mora{ color:var(--gold); }
.credit{ color:var(--credit); }

/* ---------- popup / modal ---------- */
.popup-overlay{ position:fixed; inset:0; background:rgba(2,2,8,.74); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:none; justify-content:center; align-items:center; z-index:1000; padding:16px; }
.popup-overlay.show{ display:flex; }
.popup{
  background:rgba(6,8,22,.97); padding:26px 22px; border-radius:18px; width:100%; max-width:380px; text-align:center;
  border:1px solid rgba(var(--ac-rgb),.55); box-shadow:0 0 40px rgba(var(--ac-rgb),.22), 0 20px 60px rgba(0,0,0,.6);
  animation:popIn .28s cubic-bezier(.3,.9,.3,1); position:relative;
}
@keyframes popIn{ from{ transform:translateY(14px) scale(.95); opacity:0; } to{ transform:none; opacity:1; } }
.popup h2{ margin-bottom:16px; color:#eef1ff; letter-spacing:1px; }
.popup input{
  width:100%; padding:11px 14px; border-radius:var(--r-md); border:1px solid rgba(96,110,190,.4);
  background:rgba(9,12,30,.92); color:var(--tx); font-size:15px; margin-bottom:14px; outline:none; transition:.2s;
}
.popup input:focus{ border-color:var(--line-hi); box-shadow:0 0 0 3px rgba(var(--ac-rgb),.18); }
.popup .close-btn{ position:absolute; top:12px; right:16px; background:none; border:none; color:var(--tx-3); font-size:22px; cursor:pointer; }
.popup .close-btn:hover{ color:#fff; }

/* ---------- login ---------- */
.login-box{ max-width:380px; margin:60px auto; text-align:center; }
.login-box input{
  width:100%; padding:12px 14px; margin:8px 0; border-radius:var(--r-md); border:1px solid rgba(96,110,190,.4);
  background:rgba(9,12,30,.92); color:var(--tx); font-size:15px; outline:none; transition:.2s;
}
.login-box input:focus{ border-color:var(--line-hi); box-shadow:0 0 0 3px rgba(var(--ac-rgb),.18); }

/* ---------- grid item ---------- */
.item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; margin-top:14px; }
.item-card{ background:var(--panel-2); border-radius:var(--r-md); padding:12px 8px; text-align:center; border:1px solid rgba(96,110,190,.28); transition:border-color .2s, transform .2s, box-shadow .2s; }
.item-card:hover{ border-color:var(--line-hi); transform:translateY(-3px); box-shadow:0 0 16px rgba(var(--ac-rgb),.2); }
.item-card img{ width:64px; height:64px; object-fit:cover; border-radius:10px; margin-bottom:6px; }
.item-card .name{ font-size:12.5px; font-weight:600; color:#eef1ff; }

/* ---------- gacha ---------- */
.gacha-box{ text-align:center; margin-bottom:24px; }
.gacha-buttons{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
.gacha-box.disabled{ opacity:.55; pointer-events:none; }

/* ---------- profil ---------- */
.profile-header{ text-align:center; position:relative; padding:20px 0; border-radius:var(--r-lg); overflow:hidden; margin-bottom:16px; }
.profile-header .banner-bg{ position:absolute; inset:0; background-size:cover; background-position:center; opacity:.55; z-index:0; }
.profile-header .content{ position:relative; z-index:1; }
.profile-pic-wrap{
  width:100px; height:100px; border-radius:50%; overflow:hidden; margin:0 auto 10px;
  border:2px solid var(--line-hi); background:#0c0f24; flex-shrink:0; box-shadow:0 0 18px rgba(var(--ac-rgb),.3);
}
.profile-pic-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }

.pet-area{ min-height:100px; border:1px dashed var(--line); border-radius:var(--r-lg); padding:14px; margin-top:12px; text-align:center; }
.pet-timer{ font-size:11px; color:var(--success); margin-top:4px; }
.pet-timer.ready{ color:var(--gold); font-weight:700; }

.chat-box{ height:280px; overflow-y:auto; background:rgba(9,12,30,.7); border-radius:var(--r-lg); padding:12px; margin-bottom:12px; text-align:left; font-size:13px; border:1px solid var(--line); }
.chat-msg{ margin-bottom:8px; padding:6px 10px; background:rgba(255,255,255,.04); border-radius:10px; }
.chat-msg .user{ color:var(--ac); font-weight:700; margin-right:6px; }
.chat-msg .time{ font-size:10px; color:var(--tx-3); margin-left:6px; }

.text-center{ text-align:center; }
.mt-10{ margin-top:10px; }
.hidden{ display:none !important; }

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:rgba(5,7,18,.96); color:#eef1ff; padding:11px 22px; border-radius:12px;
  border:1px solid rgba(var(--ac-rgb),.7); box-shadow:0 0 22px rgba(var(--ac-rgb),.3), 0 10px 30px rgba(0,0,0,.5);
  z-index:2000; font-size:13px; animation:fadeInOut 2.3s forwards; pointer-events:none; text-align:center;
}
@keyframes fadeInOut{
  0%{ opacity:0; transform:translateX(-50%) translateY(20px); }
  15%{ opacity:1; transform:translateX(-50%) translateY(0); }
  85%{ opacity:1; }
  100%{ opacity:0; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important; }
}
@media (max-width:480px){
  .nav a{ padding:7px 12px; font-size:11px; }
  .card{ margin:12px; padding:16px; }
}


/* ===== HEADER BARU ===== */
[hidden]{display:none!important}
.cur-ico,img.cur-ico{width:16px!important;height:16px!important;min-width:0;object-fit:contain!important;border-radius:0!important;margin:0 1px!important;vertical-align:-3px;display:inline-block;flex:none}
body:not([data-tab="Profile.html"]) .currency{display:none}
#top{position:sticky;top:0;z-index:100;background:rgba(5,7,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;min-height:60px}
.bar,.tabs{display:flex;align-items:center;gap:8px;max-width:1000px;margin:auto}
.brand{font-family:var(--mono);letter-spacing:4px;font-weight:700;font-size:13px;color:#e6ecff;margin-right:auto}
.chip{display:flex;align-items:center;gap:6px;background:rgba(9,12,30,.85);border:1px solid rgba(96,110,190,.35);padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--line-hi);background:#0c0f24;cursor:pointer;display:block;flex:none}
.tabs{margin-top:8px}
.tabs a{flex:1;text-align:center;position:relative;color:var(--tx-2);text-decoration:none;padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:600;border:1px solid transparent;transition:.2s}
.tabs a:hover{color:#fff}.tabs a.on{color:#fff;background:rgba(var(--ac-rgb),.2);border-color:var(--line-hi)}
.bdg{position:absolute;top:0;right:4px;min-width:16px;height:16px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:700}
.wrap{max-width:1000px;margin:14px auto;padding:0 12px}
.ttl{font-size:20px;margin:6px 2px 12px;color:#eef1ff}
.empty{color:var(--tx-3);text-align:center;padding:24px 8px;grid-column:1/-1}
/* profil popup */
.popup.pc{padding:0;overflow:hidden}
.pbn{height:96px;background:linear-gradient(135deg,#1b2350,#3a2a6a) center/cover}
.pav{width:88px;height:88px;margin:-44px auto 8px;border-width:3px}
.pc .in{padding:0 20px 22px}.pc .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pc small{color:var(--tx-3)}
/* GAME HUB */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s}
.gc:hover{border-color:var(--line-hi);transform:translateY(-3px);box-shadow:0 0 22px rgba(var(--ac-rgb),.22)}
.gc .pv{height:150px;background:#0c0f24 center/cover;display:grid;place-items:center}.gc .pv img{width:96px;height:96px;border-radius:50%}
.gc .bd{padding:14px}.gc h3{color:#eef1ff}.gc p{color:var(--tx-2);font-size:12.5px;margin:4px 0 12px}
/* INVENTORI */
.inv{display:grid;grid-template-columns:68px 1fr 310px;gap:12px;align-items:start}
.side{display:flex;flex-direction:column;gap:8px;position:sticky;top:112px}
.cat{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;font-size:26px;cursor:pointer;transition:.2s}
.cat img{width:34px;height:34px;object-fit:contain}.cat.on{border-color:var(--line-hi);box-shadow:0 0 16px rgba(var(--ac-rgb),.35);background:rgba(var(--ac-rgb),.16)}
.mainp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:340px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}.mh b{color:#eef1ff}
.gridm{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.slot{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid rgba(96,110,190,.28);background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;cursor:pointer;text-align:center;font-size:11.5px;font-weight:600;color:#eef1ff;transition:.2s;overflow:hidden}
.slot:hover,.slot.on{border-color:var(--line-hi);box-shadow:0 0 14px rgba(var(--ac-rgb),.3)}
.slot .m{font-size:30px;line-height:1}.slot img{width:52px;height:52px;object-fit:cover;border-radius:50%}
.slot .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--danger)}
.prev{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;position:sticky;top:112px}
.prev .big{width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px}.prev .bm{font-size:56px}
.prev h3{color:#eef1ff;margin:6px 0}.prev .ds{color:var(--tx-2);font-size:13px;margin-bottom:12px;word-break:break-word}
.prev .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.prev .x{display:none}
.veil{position:fixed;inset:0;background:rgba(2,2,8,.7);backdrop-filter:blur(4px);z-index:1000;display:none}.veil.on{display:block}
@media(max-width:760px){.inv{grid-template-columns:56px 1fr}.side{top:108px}
.prev{position:fixed;left:50%;top:50%;width:min(88vw,340px);transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;z-index:1001;transition:.2s;box-shadow:0 0 40px rgba(var(--ac-rgb),.25)}
.prev.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}.prev .x{display:block;position:absolute;top:8px;right:12px;background:none;border:0;color:var(--tx-3);font-size:24px}}
/* CHAT */
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;position:relative;font:inherit;font-weight:700;font-size:13px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--tx-2);cursor:pointer}
.seg button.on{color:#fff;background:rgba(var(--ac-rgb),.2);border-color:var(--line-hi)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;height:calc(100dvh - 200px);min-height:380px;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:88%}.msg.me{margin-left:auto;flex-direction:row-reverse}.msg .av{width:34px;height:34px}
.bub{min-width:0;background:rgba(255,255,255,.06);border-radius:4px 14px 14px 14px;padding:7px 12px}.me .bub{background:rgba(var(--ac-rgb),.22);border-radius:14px 4px 14px 14px}
.bub b{font-size:11.5px;color:var(--ac);display:block}.bub p{word-break:break-word;overflow-wrap:anywhere;font-size:14px}.bub i{font-size:10px;color:var(--tx-3);font-style:normal}
.inp{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.inp input{flex:1;min-width:0;padding:11px 15px;border-radius:99px;border:1px solid rgba(96,110,190,.4);background:rgba(9,12,30,.92);color:var(--tx);font-size:15px;outline:none}.inp input:focus{border-color:var(--line-hi)}
.tools{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx-3)}
.tools button{background:none;border:0;color:var(--tx-2);font:inherit;cursor:pointer}.tools button:hover{color:var(--danger)}
.pl{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.flist{border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.fi{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer;border-bottom:1px solid rgba(96,110,190,.15);position:relative}.fi:hover,.fi.on{background:rgba(var(--ac-rgb),.12)}
.fi .t{min-width:0;flex:1}.fi b{display:block;color:#eef1ff;font-size:13.5px}.fi small{display:block;color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .bdg{position:static}.conv{display:flex;flex-direction:column;min-height:0;min-width:0}
@media(max-width:760px){.pl{grid-template-columns:1fr}.pl .conv{display:none}.pl.open .flist{display:none}.pl.open .conv{display:flex}.back{display:inline!important}}
.back{display:none}
/* GACHA */
.gwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;max-width:1000px;margin:14px auto;padding:0 12px}

const API_URL = "https://script.google.com/macros/s/AKfycbwHtatQVaip_YspROYu7Rmtm1xWG_f69yBHoahG7DoPElB08sMmKgSCXgdgF7X9_14/exec";

let currentUser = null;

const READ_ACTIONS = /^(chatList|friends|privGet|notifs|getUser|profileOf)$/;
async function apiCall(action, data = {}) {
  for (let a = 0; a < 2; a++) {
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 15000);
    try {
      const res = await fetch(API_URL, {
        method: "POST", signal: ac.signal,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, secret: SECRET, ...data })
      });
      clearTimeout(to);
      return await res.json();
    } catch (err) {
      clearTimeout(to);
      if (a || !READ_ACTIONS.test(action)) return { success: false, message: "Gagal terhubung ke server" };
      await new Promise(r => setTimeout(r, 500));
    }
  }
}

async function login(username, password) {
  const res = await apiCall("login", { username, password });
  if (res.success) {
    currentUser = res.user;
    localStorage.setItem("popit_session", JSON.stringify({ username }));
  }
  return res;
}

async function register(username, password) {
  const res = await apiCall("register", { username, password });
  if (res.success) {
    currentUser = res.user;
    localStorage.setItem("popit_session", JSON.stringify({ username }));
  }
  return res;
}

async function loadSession() {
  const session = localStorage.getItem("popit_session");
  if (!session) return false;
  try {
    const { username } = JSON.parse(session);
    const res = await apiCall("getUser", { username });
    if (res.success) {
      currentUser = res.user;
      return true;
    }
  } catch (e) {}
  return false;
}

function logout() {
  localStorage.removeItem("popit_session");
  currentUser = null;
  window.location.href = "login.html";
}

async function updateUser(updates) {
  if (!currentUser) return { success: false };
  const res = await apiCall("updateUser", {
    username: currentUser.username,
    updates
  });
  if (res.success) currentUser = res.user;
  return res;
}

function updateCurrencyDisplay() {
  if (!currentUser) return;
  document.querySelectorAll(".mora-count").forEach(el => el.textContent = currentUser.mora || 0);
  document.querySelectorAll(".credit-count").forEach(el => el.textContent = currentUser.credit || 0);
}

async function addCurrency(type, amount) {
  if (!currentUser) return;
  const updates = {};
  if (type === "mora") updates.mora = (currentUser.mora || 0) + amount;
  if (type === "credit") updates.credit = (currentUser.credit || 0) + amount;
  await updateUser(updates);
  updateCurrencyDisplay();
}

async function redeemCode(code) {
  if (!currentUser) return { success: false, message: "Belum login" };
  const res = await apiCall("redeem", {
    username: currentUser.username,
    code: code.trim().toUpperCase()
  });
  if (res.success) {
    currentUser = res.user;
    updateCurrencyDisplay();
  }
  return res;
}

async function getGachaConfig(type) {
  return await apiCall("getGacha", { type });
}

async function doGacha(type, times = 1) {
  if (!currentUser) return { success: false, message: "Belum login" };
  const res = await apiCall("doGacha", {
    username: currentUser.username,
    type,
    times
  });
  if (res.success) {
    currentUser = res.user;
    updateCurrencyDisplay();
  }
  return res;
}

async function claimPetEarnings() {
  if (!currentUser) return;
  const res = await apiCall("claimPets", { username: currentUser.username });
  if (res.success && (res.earnedMora > 0 || res.earnedCredit > 0)) {
    currentUser = res.user;
    updateCurrencyDisplay();
    showToast(`🐾 Pet menghasilkan: ${res.earnedMora} Mora & ${res.earnedCredit} Credit!`);
  }
}

async function getChats() {
  const res = await apiCall("getChats");
  return res.chats || [];
}

async function sendChat(message) {
  if (!currentUser || !message.trim()) return;
  return await apiCall("sendChat", {
    username: currentUser.username,
    message: message.trim()
  });
}

function showToast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2300);
}

async function requireLogin() {
  const ok = await loadSession();
  if (!ok) {
    window.location.href = "login.html";
    return false;
  }
  updateCurrencyDisplay();
  claimPetEarnings();
  return true;
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return "baru saja";
  if (m < 60) return m + " mnt lalu";
  return Math.floor(m / 60) + " jam lalu";
}
