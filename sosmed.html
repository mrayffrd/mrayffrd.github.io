<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#03030a">
    <title>emurice - Social Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* EDIT DI SINI - Warna & Tema */
            --primary-color: #ff006e;
            --secondary-color: #8338ec;
            --accent-color: #ffbe0b;
            --dark-bg: #0f0f0f;
            --light-text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(131, 56, 236, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: moveGradient 15s ease infinite;
        }

        @keyframes moveGradient {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, 20px); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            z-index: 1;
        }

        /* Banner & Profile Section */
        .profile-section {
            position: relative;
            text-align: center;
            margin-bottom: 50px;
        }

        .banner {
            width: 100%;
            height: 250px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(255, 0, 111, 0);
            margin-bottom: -60px;
            background-size: cover;
            background-position: center;
        }

        .banner::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 0, 111, 0), rgba(131, 56, 236, 0));
            z-index: 1;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid var(--light-text);
            margin: 0 auto;
            position: relative;
            z-index: 2;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(255, 0, 111, 0);
            cursor: pointer;
            transition: transform 0.3s;
            background-size: cover;
            background-position: center;
        }

        .profile-image:hover {
            transform: scale(1.05);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--light-text);
            margin-top: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-bio {
            font-size: 14px;
            color: #999;
            margin-top: 8px;
        }

        /* Social Links Section */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 25px;
            border: 2px solid transparent;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: var(--light-text);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
            z-index: 0;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn i {
            font-size: 20px;
            z-index: 1;
        }

        .social-btn span {
            z-index: 1;
        }

        /* YouTube Button */
        .btn-youtube {
            border-color: #ff0000;
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.1), rgba(255, 0, 0, 0.05));
        }

        .btn-youtube:hover {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
            transform: translateY(-3px);
        }

        /* X/Twitter Button */
        .btn-x {
            border-color: #00aeff;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.05));
        }

        .btn-x:hover {
            background: linear-gradient(135deg, #000, #333);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(-3px);
        }

        /* Instagram Button */
        .btn-instagram {
            border-color: #e4405f;
            background: linear-gradient(135deg, rgba(228, 64, 95, 0.1), rgba(228, 64, 95, 0.05));
        }

        .btn-instagram:hover {
            background: linear-gradient(135deg, #e4405f, #c13584);
            box-shadow: 0 10px 30px rgba(228, 64, 95, 0.4);
            transform: translateY(-3px);
        }

        /* Threads Button */
        .btn-threads {
            border-color: #000;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.05));
        }

        .btn-threads:hover {
            background: linear-gradient(135deg, #000, #1a1a1a);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(-3px);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 12px;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: var(--accent-color);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .profile-name {
                font-size: 24px;
            }

            .banner {
                height: 200px;
            }

            .profile-image {
                width: 120px;
                height: 120px;
            }

            .social-btn {
                padding: 15px 20px;
                font-size: 14px;
            }
        }

        /* Animation on load */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-section {
            animation: fadeInUp 0.6s ease;
        }

        .social-btn {
            animation: fadeInUp 0.6s ease;
        }

        .social-btn:nth-child(1) { animation-delay: 0.1s; }
        .social-btn:nth-child(2) { animation-delay: 0.2s; }
        .social-btn:nth-child(3) { animation-delay: 0.3s; }
        .social-btn:nth-child(4) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profile Section -->
        <div class="profile-section">
            <div class="banner">
            </div>
            <div class="profile-image"></div>
            <h1 class="profile-name">emurice</h1>
            <p class="profile-bio">Pejoki • Konten Kreator • Tampan dan Berani</p>
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <a href="https://youtube.com/@mrayffrd?si=rKrtmsEnuSwk3szy" class="social-btn btn-youtube" target="_blank">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="https://x.com/emuriceee" class="social-btn btn-x" target="_blank">
                <i class="fab fa-x-twitter"></i>
                <span>X (Twitter)</span>
            </a>
            <a href="https://www.instagram.com/emuricee_?stkn=bmJkMnZlNXJoOTVi" class="social-btn btn-instagram" target="_blank">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="https://www.threads.com/@emuricee_" class="social-btn btn-threads" target="_blank">
                <i class="fab fa-threads"></i>
                <span>@ Threads</span>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2024 emurice - All Social Links</p>
        </div>
    </div>

    <script>
        // ===== EDIT NAMA FILE GAMBAR DI SINI =====
        const bannerImage = 'banner.jpg';  // Nama file banner
        const profileImage = 'pp.jpg';      // Nama file profile picture
        // ==========================================

        // Set banner background
        document.querySelector('.banner').style.backgroundImage = `url('${bannerImage}')`;

        // Set profile image background
        document.querySelector('.profile-image').style.backgroundImage = `url('${profileImage}')`;
    </script>
</body>
</html>
