<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MATIKAN HP</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:#000; color:white; font-family:sans-serif;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:20px;
  }
  .power-btn{
    width:70vw; height:70vw; max-width:260px; max-height:260px;
    background: radial-gradient(circle at 35% 35%, #ff4d4d, #b30000);
    border-radius:50%; border:8px solid #330000;
    font-size:100px; color:white;
    box-shadow: 0 0 0 12px #1a0000, 0 0 80px rgba(255,0,0,0.6);
    display:flex; justify-content:center; align-items:center;
    cursor:pointer; user-select:none;
    transition: transform 0.1s;
  }
  .power-btn:active{transform:scale(0.92)}
  h1{margin-top:40px; font-size:22px; letter-spacing:3px; font-weight:900}
  .sub{opacity:0.5; font-size:13px; margin-top:10px; text-align:center; line-height:1.4}
  .ok{margin-top:25px; background:#111; border:1px solid #333; padding:12px 18px; border-radius:12px; font-size:12px; max-width:320px; text-align:center;}
</style>
</head>
<body>

<div class="power-btn" onclick="mati()">⏻</div>
<h1>MATIKAN DAYA</h1>
<div class="sub">1 ketuk langsung proses mati daya</div>
<div class="ok" id="info">Buka file ini di Chrome HP</div>

<script>
function mati(){
  if(!confirm("MATIKAN HP SEKARANG?")) return;
  document.getElementById('info').innerText = "Mencoba matikan...";

  // CARA 1: Intent Shutdown langsung (Work di Xiaomi, Oppo, Vivo, Samsung lama, HP Root)
  try {
    window.location.href = "intent:#Intent;action=android.intent.action.ACTION_REQUEST_SHUTDOWN;end";
  } catch(e){}

  // CARA 2: Kalau Cara 1 diblokir, paksa buka dialog Power (Android 11+)
  setTimeout(()=>{
    try {
      window.location.href = "intent:#Intent;action=android.intent.action.ACTION_REQUEST_SHUTDOWN;extra=confirm;end";
    } catch(e){}
  }, 400);

  // CARA 3: Fallback kalau bener-bener diblokir Google - kasih tau user
  setTimeout(()=>{
    document.getElementById('info').innerHTML = "HP kamu memblokir shutdown dari browser (keamanan Android).<br><br><b>Solusi 1 klik beneran:</b><br>1. Tahan tombol Power 1 detik<br><br><b>Kalau mau tetap dari layar:</b><br>Tambahkan ke Layar Utama > buka sebagai aplikasi, di beberapa HP Xiaomi/Redmi langsung bisa mati.";
    // Coba buka power menu
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
  }, 1500);
}
</script>
</body>
</html>
